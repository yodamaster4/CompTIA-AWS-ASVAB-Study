<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#13223B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cloud Ops">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cloud Ops: AWS Associate certification trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --sunk:#E3E8EF; --ink:#13223B; --muted:#56657C; --line:#CDD5E0;
  --accent:#FF9F43; --accent-ink:#13223B; --ok:#1C7F52; --ok-bg:#DDF2E7; --bad:#B83434; --bad-bg:#F8E1E1;
  --d1:#3566AE; --d2:#BC4E32; --d3:#6650A6; --d4:#177F72; --d5:#86741A;
  --head:"Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono:ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:10px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0E1827; --surface:#162438; --sunk:#1D2E46; --ink:#E6ECF4; --muted:#9BAAC0; --line:#2B3D57;
  --accent:#FFAA55; --accent-ink:#13223B; --ok:#4CC58A; --ok-bg:#153A2B; --bad:#F07A7A; --bad-bg:#43202A;
  --d1:#6F9FE6; --d2:#E88468; --d3:#A08CDD; --d4:#49C1B0; --d5:#D2BE58;
}}
:root[data-theme="dark"]{
  --bg:#0E1827; --surface:#162438; --sunk:#1D2E46; --ink:#E6ECF4; --muted:#9BAAC0; --line:#2B3D57;
  --accent:#FFAA55; --accent-ink:#13223B; --ok:#4CC58A; --ok-bg:#153A2B; --bad:#F07A7A; --bad-bg:#43202A;
  --d1:#6F9FE6; --d2:#E88468; --d3:#A08CDD; --d4:#49C1B0; --d5:#D2BE58;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,label.btn{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overflow-wrap:anywhere}
button:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--head);line-height:1.15;margin:0}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:18px;min-height:62px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--head);font-weight:700;font-size:21px;letter-spacing:.01em;background:none;border:0;padding:0}
.badge{width:34px;height:34px;border-radius:8px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:14px;font-weight:700}
.nav{display:flex;gap:4px;margin-left:8px}
.nav button{background:none;border:0;padding:8px 14px;border-radius:8px;font-family:var(--head);font-weight:600;font-size:16px;color:var(--muted)}
.nav button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:inset 0 -3px 0 var(--accent)}
.stats{margin-left:auto;display:flex;gap:16px;align-items:center;font-size:14px;color:var(--muted)}
.stats b{font-family:var(--head);font-size:18px;color:var(--ink);font-weight:700}
.stat{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}
.bnav{display:none}
@media (max-width:760px){
  .nav{display:none}
  .stats .hide-sm{display:none}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .bnav button{flex:1;background:none;border:0;padding:10px 4px;font-family:var(--head);font-weight:600;font-size:15px;color:var(--muted);border-radius:8px}
  .bnav button[aria-current="page"]{color:var(--ink);background:var(--sunk)}
  main{padding-bottom:84px}
  body.playing .bnav{display:none}
}
main{padding:26px 0 60px}
.brand,.stat{white-space:nowrap}
@media (max-width:760px){.top .wrap{gap:10px;min-height:56px}.brand{font-size:18px;gap:8px}.badge{width:30px;height:30px;font-size:13px}.stats{gap:12px;font-size:11.5px}.stats b{font-size:15px}.wrap{padding:0 14px}.qcard{padding:18px}.qcard .prompt{font-size:19px}.qcard .prompt.term{font-size:26px}.today h1{font-size:28px}}
@media (max-width:360px){.brand{font-size:0;gap:0}.brand .badge{font-size:13px}}
@media (hover:none){.keyhint{display:none}}

/* generic */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--ink);background:var(--accent);color:var(--accent-ink);font-family:var(--head);font-weight:700;font-size:17px;padding:11px 20px;border-radius:9px;min-height:46px}
.btn:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.small{font-size:15px;padding:7px 14px;min-height:38px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.muted{color:var(--muted)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:3px 9px;border-radius:99px;background:color-mix(in srgb,var(--dc,var(--muted)) 16%,transparent);color:var(--dc,var(--muted));max-width:100%;line-height:1.3}
.d1{--dc:var(--d1)}.d2{--dc:var(--d2)}.d3{--dc:var(--d3)}.d4{--dc:var(--d4)}.d5{--dc:var(--d5)}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:34px 0 14px}
.sechead h2{font-size:24px}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:18px}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--dc,var(--accent));border-radius:99px;transition:width .4s}

/* HQ */
.today h1{font-size:32px;margin-bottom:6px}
.today .counts{display:flex;gap:22px;margin:14px 0 18px}
.today .counts div{font-size:14px;color:var(--muted)}
.today .counts b{display:block;font-family:var(--head);font-size:30px;color:var(--ink)}
.focus{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.focus button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:14px;font-weight:700;color:var(--dc,var(--ink))}
.focus button:hover{border-color:var(--dc,var(--ink))}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi b{display:block;font-family:var(--head);font-size:28px;font-weight:700}
.kpi span{font-size:14px;color:var(--muted)}
.spark{display:flex;gap:4px;align-items:flex-end;height:44px;margin-top:10px}
.spark i{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:3px;opacity:.9}
.spark i.zero{background:var(--line)}

/* floor plan: the facility map */
.plan{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:16px;background:var(--surface);border:2px solid var(--ink);border-radius:4px;position:relative;
  background-image:linear-gradient(var(--sunk) 1px,transparent 1px),linear-gradient(90deg,var(--sunk) 1px,transparent 1px);background-size:22px 22px}
.wing{border:2px solid var(--dc);background:var(--surface);border-radius:3px;padding:12px;display:flex;flex-direction:column;gap:10px}
@media (max-width:860px){.plan{grid-template-columns:1fr}}
.wing header{display:flex;align-items:baseline;gap:10px}
.wing header .num{font-family:var(--head);font-weight:700;font-size:26px;color:var(--dc);line-height:1}
.wing header h3{font-size:16px}
.wing header .w{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.room{--m:0;position:relative;text-align:left;border:1.5px solid color-mix(in srgb,var(--dc) 55%,var(--line));border-radius:3px;padding:8px 9px 9px;min-height:74px;
  background:linear-gradient(to top,color-mix(in srgb,var(--dc) 32%,transparent) calc(var(--m) * 100%),var(--surface) calc(var(--m) * 100%));display:flex;flex-direction:column;gap:2px}
.room:hover{border-color:var(--dc)}
.room .rn{font-family:var(--head);font-weight:700;font-size:15px;color:var(--dc)}
.room .rt{font-size:13.5px;line-height:1.25}
.room .rp{margin-top:auto;font-size:12px;color:var(--muted)}
.room.secured{border-color:var(--dc);border-width:2.5px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:14px;height:14px;border:1.5px solid var(--muted);vertical-align:-2px;margin-right:6px;border-radius:2px}

/* train */
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.mode{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:6px;min-height:150px}
.mode:hover{border-color:var(--ink)}
.mode h3{font-size:20px}
.mode p{margin:0;color:var(--muted);font-size:15px}
.mode .tag{margin-top:auto;font-size:13px;font-weight:700;color:var(--muted)}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.pick{text-align:left;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--dc);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.pick:hover{border-color:var(--dc)}
.pick b{font-family:var(--head);font-size:17px}
.pick small{color:var(--muted);font-size:13px}

/* play area */
.play{max-width:760px;margin:0 auto}
.playhead{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.playhead .bar{flex:1}
.x{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-weight:700;font-size:14px}
.count{font-family:var(--head);font-weight:600;font-size:15px;color:var(--muted);white-space:nowrap}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px}
.qcard .ask{font-size:14px;color:var(--muted);margin:12px 0 4px}
.qcard .prompt{font-size:21px;line-height:1.4;margin:0 0 18px}
.qcard .prompt.term{font-family:var(--head);font-size:30px;font-weight:700}
.opts{display:grid;gap:10px}
.opt{text-align:left;display:flex;gap:12px;align-items:flex-start;background:var(--bg);border:2px solid var(--line);border-radius:9px;padding:12px 14px;font-size:17px}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt .k{flex:none;width:26px;height:26px;border-radius:6px;border:1.5px solid var(--muted);display:grid;place-items:center;font-family:var(--head);font-weight:700;font-size:14px;color:var(--muted)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt[disabled]{cursor:default}
.feedback{margin-top:16px;border-radius:9px;padding:14px 16px;border-left:5px solid var(--ok);background:var(--ok-bg)}
.feedback.no{border-left-color:var(--bad);background:var(--bad-bg)}
.feedback h4{margin:0 0 4px;font-family:var(--head);font-size:18px}
.feedback p{margin:4px 0}
.hook{margin-top:8px;padding:10px 12px;border:1.5px dashed var(--accent);border-radius:8px;background:color-mix(in srgb,var(--accent) 12%,transparent)}
.hook b{font-family:var(--head)}
.next{margin-top:16px;display:flex;justify-content:flex-end;gap:10px}
.learn .term{font-family:var(--head);font-size:34px;font-weight:700;margin:10px 0}
.learn .def{font-size:20px;line-height:1.45}
.newtag{font-family:var(--head);font-weight:700;font-size:13px;background:var(--accent);color:var(--accent-ink);padding:2px 8px;border-radius:5px}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .25s 2}
@media (prefers-reduced-motion:reduce){.shake{animation:none}.bar>i{transition:none}}
.kbd{font-size:13px;color:var(--muted);margin-top:14px}

/* match / sort / order */
.match{display:grid;grid-template-columns:1fr 1.5fr;gap:12px}
.match .col{display:grid;gap:8px;align-content:start}
.tile{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:8px;padding:10px 12px;font-size:15px;min-height:52px}
.tile.term{font-family:var(--head);font-weight:600;font-size:16px}
.tile.sel{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.tile.done{border-color:var(--ok);background:var(--ok-bg);opacity:.75}
.tile.bad{border-color:var(--bad);background:var(--bad-bg)}
@media (max-width:560px){.match{grid-template-columns:1fr 1.3fr}.tile{font-size:14px;padding:8px}}
.tray{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;min-height:50px}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.bucket{text-align:left;background:var(--surface);border:2px dashed var(--line);border-radius:10px;padding:10px;min-height:120px;display:flex;flex-direction:column;gap:6px}
.bucket:hover{border-color:var(--ink)}
.bucket h4{margin:0;font-family:var(--head);font-size:16px}
.bucket .in{font-size:13.5px;background:var(--ok-bg);border-radius:6px;padding:4px 7px}
.hint{font-size:14px;color:var(--bad);margin-top:6px}
.seq{display:grid;gap:8px;margin-bottom:16px;counter-reset:s}
.seq div{background:var(--ok-bg);border:2px solid var(--ok);border-radius:8px;padding:9px 12px;font-weight:700;counter-increment:s}
.seq div::before{content:counter(s) ". ";font-family:var(--head)}

/* logs */
.logbox{background:#0F1A2A;color:#D8E2F0;border-radius:10px;padding:10px;overflow-x:auto}
.logline{display:block;width:100%;text-align:left;background:none;border:0;border-left:4px solid transparent;color:inherit;font-family:var(--mono);font-size:13.5px;padding:8px 10px;white-space:pre;border-radius:4px}
.logline:hover{background:#1B2A40}
.logline.flag{border-left-color:#F5BC4A;background:#2A2A1E}
.logline.tp{border-left-color:#4CC58A;background:#153A2B}
.logline.fp{border-left-color:#F07A7A;background:#43202A}
.logline.fn{border-left-color:#F07A7A;background:#2B1F2A;outline:1px dashed #F07A7A}
.why{font-size:14px;margin:4px 0 10px 14px;color:var(--muted)}

/* results */
.result h2{font-size:30px}
.big{font-family:var(--head);font-size:56px;font-weight:700;line-height:1}
.dbar{display:grid;grid-template-columns:190px 1fr 50px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
@media (max-width:560px){.dbar{grid-template-columns:120px 1fr 44px}}
.missed{margin-top:18px;display:grid;gap:10px}
.missed div{border-left:4px solid var(--bad);padding:6px 12px;background:var(--surface);border-radius:4px}

/* exam */
.qnav{display:flex;flex-wrap:wrap;gap:5px;margin-top:16px}
.qnav button{width:34px;height:34px;border:1.5px solid var(--line);background:var(--surface);border-radius:6px;font-size:13px;font-weight:700}
.qnav button.ans{background:var(--sunk)}
.qnav button.cur{border-color:var(--ink);border-width:2.5px}
.qnav button.flg{box-shadow:inset 0 -4px 0 var(--accent)}
.timer{font-family:var(--head);font-weight:700;font-size:18px}

/* library */
details.obj{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--dc);border-radius:6px;margin-bottom:8px}
details.obj summary{cursor:pointer;padding:12px 16px;display:flex;gap:12px;align-items:baseline;list-style:none}
details.obj summary::-webkit-details-marker{display:none}
details.obj summary .rn{font-family:var(--head);font-weight:700;color:var(--dc);min-width:32px}
details.obj summary .pct{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}
.objbody{padding:0 16px 16px}
.terms{display:grid;gap:10px;margin:10px 0 14px}
.terms div{border-top:1px solid var(--line);padding-top:10px}
.terms b{font-family:var(--head);font-size:16.5px}
.terms p{margin:2px 0}
.terms em{color:var(--muted);font-size:14.5px}
.box{display:inline-block;font-size:12px;font-weight:700;padding:1px 7px;border-radius:5px;background:var(--sunk);color:var(--muted);margin-left:6px;vertical-align:1px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;font-family:var(--head);font-weight:600}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px;background:var(--surface)}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line)}
th{font-family:var(--head);font-size:15px}
td.num{font-family:var(--mono);white-space:nowrap}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin:14px 0}
.facts div{background:var(--sunk);border-radius:8px;padding:12px}
.facts b{display:block;font-family:var(--head);font-size:22px}
.facts span{font-size:13.5px;color:var(--muted)}
input[type=date],select{font:inherit;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px}
.welcome{border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.welcome ol{margin:8px 0 12px;padding-left:22px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:9px;font-weight:700;z-index:50;font-size:15px}
.sync{font-size:12px;color:var(--muted)}
p.lead{font-size:18px;max-width:62ch}
.labwarn{margin:14px 0;padding:12px 14px;border-radius:9px;border:1.5px solid var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface));font-size:15px}
.labh{font-size:20px;margin:22px 0 10px}
.steps{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.step{min-width:0;display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.step.on{border-color:var(--ok);background:color-mix(in srgb,var(--ok-bg) 60%,var(--surface))}
.tick{flex:none;width:30px;height:30px;border-radius:8px;border:2px solid var(--muted);background:var(--surface);position:relative}
.tick[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.tick[aria-pressed="true"]::after{content:"";position:absolute;left:9px;top:3px;width:8px;height:15px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg)}
.sbody{min-width:0;flex:1}.sbody h4{margin:3px 0 4px;font-family:var(--head);font-size:17px}.sbody p{margin:4px 0}
.step.on .sbody h4{text-decoration:line-through;text-decoration-color:var(--ok)}
.see{font-size:14.5px;color:var(--muted)}
.codewrap{position:relative;margin:8px 0;max-width:100%;min-width:0}
.code{margin:0;background:#0F1A2A;color:#D8E2F0;font-family:var(--mono);font-size:13px;line-height:1.5;padding:12px 14px;padding-right:74px;border-radius:8px;overflow-x:auto;white-space:pre;overflow-wrap:normal}
.copy{position:absolute;top:6px;right:6px;background:#1B2A40!important;color:#D8E2F0!important;border-color:#2B3D57!important;min-height:30px!important;padding:4px 10px!important;font-size:13px!important}

// ================= IDENTITY & GOVERNANCE =================
C("s1.1 o4.1", "iam", "IAM role", "An identity with permissions that is assumed temporarily (by users, services, or other accounts) and issues short-lived credentials. Preferred over long-term access keys.", "Roles are hats you put on and take off.");

C("s1.1 o4.1", "iam", "Implicit deny", "If no policy allows an action, it is denied by default.", "Silence means no.");
C("s1.1 o4.1", "iam", "Resource-based policy", "A policy attached to a resource (such as an S3 bucket policy or KMS key policy) that says who can access it, including other accounts.", "Policy on the thing, not the person.");

// ---- SAA Domain 1: Secure ----
Q("s1.1 o4.1","An application on EC2 needs to read objects from an S3 bucket. What is the MOST secure way to grant access?",["Store an IAM user's access keys in the application config","Attach an IAM role to the instance through an instance profile","Make the bucket public","Put the keys in EC2 user data"],1,"Instance roles provide temporary, automatically rotated credentials. Never store long-term keys on instances.");
Q("s1.1","A company wants to prevent any account in an organization from using Regions outside the EU, even administrators. What should be used?",["IAM permissions boundary","Service control policy with aws:RequestedRegion","S3 bucket policy","AWS Config rule"],1,"SCPs set maximum permissions for every principal in member accounts, including admins.");
Q("s1.1","A developer in Account A needs to manage resources in Account B. What is the recommended approach?",["Create an IAM user in B and share the password","Create a role in B that trusts A, and have the developer assume it","Share root credentials","Use VPC peering"],1,"Cross-account access uses a role in the target account with a trust policy, assumed via STS.");
Q("s1.1","Employees sign in with the corporate Active Directory. They need access to 30 AWS accounts. What is the best solution?",["Create IAM users in each account","IAM Identity Center federated with the corporate directory","Share one IAM user","Use Cognito user pools"],1,"IAM Identity Center provides workforce SSO across accounts using permission sets.");
Q("s1.2","A mobile app needs user sign-up and sign-in, and users need temporary credentials to upload to S3. Which service fits?",["IAM users","Amazon Cognito","IAM Identity Center","AWS Directory Service"],1,"Cognito user pools handle app users; identity pools vend temporary AWS credentials.");
Q("s1.2 o5.1","A web tier in a public subnet must reach a database in a private subnet on port 3306. What is the best way to allow ONLY the web tier?",["NACL allowing 0.0.0.0/0 on 3306","DB security group allowing 3306 from the web tier's security group","Put the DB in the public subnet","Open all ports between subnets"],1,"Referencing a security group as the source allows only instances in that group, even as IPs change.");
Q("s1.2 o5.1","Private instances need to download patches from the internet without being reachable from the internet. What is needed?",["Internet gateway attached to the private subnet","NAT gateway in a public subnet and a route from the private subnet","Elastic IP on each instance","VPC peering"],1,"A NAT gateway allows outbound-only internet access for private subnets.");
Q("s1.2","A web application is being hit with SQL injection attempts. What service should be added in front of the ALB?",["AWS Shield Standard","AWS WAF","Amazon GuardDuty","Amazon Inspector"],1,"WAF inspects HTTP requests and blocks SQL injection and XSS with managed rules.");
Q("s1.2","Instances in a private subnet access S3. The company wants traffic to stay off the internet at no extra cost. What should be used?",["NAT gateway","Interface endpoint","Gateway VPC endpoint for S3","Direct Connect"],2,"Gateway endpoints for S3 and DynamoDB are free and keep traffic on the AWS network.");
Q("s1.2","A company wants to automatically detect compromised EC2 instances communicating with known malicious IPs. Which service?",["Amazon Macie","Amazon GuardDuty","AWS Config","AWS Shield"],1,"GuardDuty analyzes VPC Flow Logs, DNS logs, and CloudTrail for threats.");
Q("s1.3","Database credentials must be stored securely and rotated automatically every 30 days. Which service?",["SSM Parameter Store SecureString","AWS Secrets Manager","KMS","S3 with SSE-KMS"],1,"Secrets Manager provides native automatic rotation.");
Q("s1.3","A company must ensure financial records in S3 cannot be deleted or modified for 7 years, even by the root user. What should be used?",["S3 Versioning","S3 Object Lock in compliance mode","MFA Delete","Bucket policy denying delete"],1,"Compliance mode Object Lock prevents anyone, including root, from deleting objects during retention.");
Q("s1.3","Which S3 setting prevents any bucket in the account from becoming public, regardless of bucket policies?",["S3 Object Lock","S3 Block Public Access at the account level","Default encryption","Versioning"],1,"Account-level Block Public Access overrides policies and ACLs that would grant public access.");
Q("s1.3 o4.2","A company needs full control and an audit trail for encryption keys, including who used them. What should they use?",["SSE-S3","Customer managed KMS keys","Client-side encryption only","AWS-owned keys"],1,"Customer managed KMS keys let you control key policies, rotation, and every use is logged in CloudTrail.");
Q("s1.2 s1.3","Content in an S3 bucket should be available only through CloudFront, not by direct S3 URLs. What should be configured?",["Presigned URLs","Origin access control with a bucket policy allowing only CloudFront","S3 Transfer Acceleration","Public bucket"],1,"OAC restricts the bucket so only the CloudFront distribution can read it.");

// ---- SAA Domain 2: Resilient ----
Q("s2.1","An order service receives traffic spikes that overwhelm the processing tier. Orders must not be lost. What improves resilience?",["Bigger EC2 instances","Put an SQS queue between the web and processing tiers","Use Route 53 weighted routing","Add a read replica"],1,"SQS buffers requests so consumers process at their own pace; messages persist until processed.");

Q("s2.2","A global application needs a relational database with low-latency reads in multiple Regions and fast cross-Region DR. What fits best?",["RDS Multi-AZ","Aurora Global Database","DynamoDB on-demand","ElastiCache"],1,"Aurora Global Database replicates to secondary Regions with typically sub-second lag and fast promotion.");
Q("s2.2 o5.2","Traffic should go to the primary Region and automatically switch to a standby Region if health checks fail. Which Route 53 policy?",["Weighted","Latency","Failover","Geolocation"],2,"Failover routing is active-passive based on health checks.");
Q("s2.2","A legacy app stores session state on the local instance, which breaks scaling. What is the best fix without code changes to the logic?",["Sticky sessions forever","Store sessions in ElastiCache or DynamoDB","Use bigger instances","Use one instance"],1,"Externalizing session state makes instances stateless so they can scale and fail independently.");

Q("s3.1 o1.3","A database needs consistent 60,000 IOPS on a single volume. Which EBS type?",["gp3","io2 Block Express","st1","sc1"],1,"Provisioned IOPS (io2) delivers high, consistent IOPS; gp3 tops out lower.");

Q("s3.3 o1.3","Hundreds of Lambda functions exhaust database connections on RDS. What helps?",["Bigger RDS instance","Amazon RDS Proxy","More read replicas","DynamoDB Streams"],1,"RDS Proxy pools and reuses connections.");

PACK.drills.push({ id: "cidr", title: "Subnet IP math", x: tags("s3.4 o5.1"), desc: "How many usable IPs does an AWS subnet have? Remember: AWS reserves 5 in every subnet.",
  tip: "Usable IPs = 2^(32 - prefix) - 5.", gen() {
    const p = 16 + Math.floor(Math.random() * 13); const total = Math.pow(2, 32 - p); const right = total - 5;
    const opts = [right, total, total - 2, total - 4].map(String); const uniq = [...new Set(opts)];
    while (uniq.length < 4) uniq.push(String(right + uniq.length * 3));
    const sh = uniq.sort(() => Math.random() - 0.5);
    return { stem: "A subnet has the CIDR 10.0.0.0/" + p + ".", prompt: "How many IP addresses can you assign to resources?", options: sh, ans: sh.indexOf(String(right)),
      explain: "/" + p + " has 2^" + (32 - p) + " = " + total.toLocaleString() + " addresses. AWS reserves 5 (network, VPC router, DNS, future use, broadcast), leaving " + right.toLocaleString() + "." }; } });
PACK.drills.push({ id: "cm", title: "Confusion matrix math", x: tags("m2.3"), desc: "Precision, recall, F1, and accuracy from real counts, with new numbers every round.",
  tip: "Precision = TP/(TP+FP). Recall = TP/(TP+FN). F1 = 2PR/(P+R).", gen() {
    const r = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
    const TP = r(20, 90), FP = r(5, 60), FN = r(5, 60), TN = r(200, 900);
    const P = TP / (TP + FP), R = TP / (TP + FN), F = 2 * P * R / (P + R), A = (TP + TN) / (TP + FP + FN + TN);
    const kind = ["Precision", "Recall", "F1 score", "Accuracy"][r(0, 3)];
    const val = { "Precision": P, "Recall": R, "F1 score": F, "Accuracy": A }[kind];
    const f = v => (v * 100).toFixed(1) + "%";
    const pool = [P, R, F, A, TP / (TP + TN), FP / (FP + TN)].map(f);
    const uniq = [...new Set([f(val), ...pool])].slice(0, 4);
    while (uniq.length < 4) uniq.push(f(Math.random()));
    const sh = uniq.sort(() => Math.random() - 0.5);
    return { stem: "A model's results: TP = " + TP + ", FP = " + FP + ", FN = " + FN + ", TN = " + TN + ".", prompt: "What is the " + kind.toLowerCase() + "?", options: sh, ans: sh.indexOf(f(val)),
      explain: "Precision = " + TP + "/(" + TP + "+" + FP + ") = " + f(P) + ". Recall = " + TP + "/(" + TP + "+" + FN + ") = " + f(R) + ". F1 = " + f(F) + ". Accuracy = (" + TP + "+" + TN + ")/" + (TP + FP + FN + TN) + " = " + f(A) + "." }; } });

  ["Use AWS's official practice", "Take the free 20-question Official Practice Question Set for your exam on AWS Skill Builder early, to learn the question style. About a week before test day, take the full Official Practice Exam (included with a Skill Builder subscription)."],
  ["Hands-on beats reading", "Do the labs in Train. Having built a NAT gateway or a knowledge base once makes scenario questions much easier to reason through."],
  ["MLA-C02 beta", "The beta runs until GA on January 14, 2027. Beta results are released after the beta period, not immediately."]
];

// ================= HANDS-ON LABS =================
// Each lab: steps [title, what to do, what you should see, optional code], cleanup, troubleshooting, quiz.
PACK.labs = [];
function LAB(o) {
  o.x = tags(o.tags);
  (o.quiz || []).forEach(q => PACK.mcq.push({ x: o.x, q: q[0], c: q[1], a: q[2], e: q[3], lab: o.id }));
  PACK.labs.push(o);
}

LAB({ id: "l00", tags: "s1.1 o4.1", title: "Lab 0: Set up a safe practice account", time: "20 min", cost: "Free",
  goal: "Lock down your account and set a spending alarm before building anything. Do this lab first.",
  why: "Root user protection, MFA, least privilege, and budgets show up on all three exams. It also protects you from surprise bills.",
  steps: [
    ["Turn on MFA for the root user", "Sign in as the root user (the email you signed up with). Open the account menu at the top right, choose Security credentials, and assign an MFA device (an authenticator app is fine).", "The MFA section shows one assigned device."],
    ["Create an everyday admin identity", "Open IAM Identity Center, enable it, create a user for yourself, and give it the AdministratorAccess permission set on your account. (If Identity Center isn't available, create an IAM user with console access and MFA instead.)", "You receive an email invitation and can sign in through the AWS access portal."],
    ["Stop using root", "Sign out of root. From now on, sign in with your new identity for every lab.", "The console top-right shows your new user, not 'root'."],
    ["Create a zero-spend budget", "Open Billing and Cost Management, then Budgets, and create a budget from the 'Zero spend budget' template (or a monthly cost budget of $5). Add your email.", "The budget appears in the Budgets list with your email as a recipient."],
    ["Pick one Region for all labs", "Choose a Region close to you (for example us-east-1) from the Region selector and use it for every lab so nothing gets forgotten elsewhere.", "Region selector shows your chosen Region."]
  ],
  cleanup: ["Nothing to clean up. Keep the budget and MFA forever."],
  stuck: [["I don't see IAM Identity Center", "Some account types can't enable it. Create an IAM user with the AdministratorAccess policy, a console password, and MFA."], ["Budgets needs permissions", "Billing access for IAM identities may need to be activated by root under Account settings."]],
  quiz: [
    ["What is the recommended way to handle the root user?", ["Use it daily with a strong password", "Enable MFA, avoid access keys, and use it only for tasks that require it", "Share it with the team", "Delete it"], 1, "Protect root with MFA and use an admin identity for daily work."],
    ["Which service alerts you when spending passes a threshold?", ["CloudTrail", "AWS Budgets", "Trusted Advisor", "Config"], 1, "AWS Budgets sends alerts on actual or forecast spend."]
  ] });

LAB({ id: "l01", tags: "s1.2 o5.1", title: "Lab 1: Build a VPC and a public web server", time: "45 min", cost: "Free Tier or a few cents",
  goal: "Build a VPC by hand, including subnets, an internet gateway, and route tables, then launch a web server the internet can reach.",
  why: "Knowing exactly what makes a subnet 'public' is one of the most tested networking ideas on SAA and CloudOps.",
  steps: [
    ["Create the VPC", "VPC console, Your VPCs, Create VPC. Choose 'VPC only', name it lab-vpc, CIDR 10.0.0.0/16.", "lab-vpc appears with state Available."],
    ["Create two subnets", "Subnets, Create subnet in lab-vpc: public-a (10.0.1.0/24) in one AZ and private-a (10.0.2.0/24) in the same AZ.", "Each /24 shows 251 available IPs. That's 256 minus the 5 AWS reserves."],
    ["Attach an internet gateway", "Internet gateways, Create, name lab-igw, then Actions, Attach to VPC, choose lab-vpc.", "lab-igw state is Attached."],
    ["Make public-a public", "Route tables, Create route table public-rt in lab-vpc. Edit routes: add 0.0.0.0/0 with target lab-igw. Subnet associations: associate public-a. On public-a, Edit subnet settings and enable auto-assign public IPv4.", "public-rt has two routes: local and 0.0.0.0/0 to the IGW."],
    ["Create a web security group", "Security groups, Create web-sg in lab-vpc. Inbound: HTTP (80) from 0.0.0.0/0. No SSH needed.", "web-sg shows one inbound rule for port 80."],
    ["Launch the web server", "EC2, Launch instance: Amazon Linux 2023, a free-tier eligible type (t2.micro or t3.micro), no key pair, lab-vpc, subnet public-a, security group web-sg. Under Advanced details, paste the user data below.", "Instance reaches Running and 2/2 status checks pass after a few minutes.",
     "#!/bin/bash\ndnf install -y httpd\necho \"<h1>Hello from $(hostname -f)</h1>\" > /var/www/html/index.html\nsystemctl enable --now httpd"],
    ["Test it", "Copy the instance's public IPv4 address and open http://THAT-IP in your browser (http, not https).", "Your browser shows 'Hello from ip-10-0-1-...'."],
    ["Break it on purpose", "In public-rt, delete the 0.0.0.0/0 route. Reload the page.", "The page no longer loads. Add the route back and it works again. That route is what made the subnet public."]
  ],
  cleanup: ["Terminate the EC2 instance.", "Delete web-sg (after the instance is gone).", "Detach and delete lab-igw.", "Delete the subnets, public-rt, and lab-vpc (or keep the VPC for Lab 2)."],
  stuck: [["Page won't load", "Check: public IP assigned, route 0.0.0.0/0 to IGW on the subnet's route table, security group allows port 80, and you used http:// not https://."], ["Status checks failing", "Wait 3 to 5 minutes after launch; user data runs on first boot."]],
  quiz: [
    ["What makes a subnet 'public' in AWS?", ["Its name contains 'public'", "Its route table has a route to an internet gateway", "It has a NAT gateway", "It has a security group"], 1, "A route to an internet gateway is the defining feature."],
    ["How many usable IPs does a /24 subnet have in AWS?", ["256", "254", "251", "250"], 2, "256 minus the 5 addresses AWS reserves."]
  ] });

LAB({ id: "l02", tags: "o5.3 s1.2", title: "Lab 2: Private subnet, NAT, and troubleshooting", time: "60 min", cost: "About $0.10 to $0.30 if cleaned up within the hour (NAT gateway and Reachability Analyzer are not free)",
  goal: "Give a private instance outbound internet through a NAT gateway, connect with Session Manager (no SSH), then diagnose a broken path with Reachability Analyzer and Flow Logs.",
  why: "CloudOps Domain 5 is heavy on troubleshooting subnets, routes, NACLs, and NAT. This is the scenario from the game, for real.",
  steps: [
    ["Create an instance role", "IAM, Roles, Create role for EC2 with the AmazonSSMManagedInstanceCore policy. Name it lab-ssm-role.", "The role lists AmazonSSMManagedInstanceCore."],
    ["Create a NAT gateway", "VPC, NAT gateways, Create in subnet public-a (from Lab 1), connectivity Public, allocate an Elastic IP.", "State goes from Pending to Available."],
    ["Route the private subnet", "Create route table private-rt: add 0.0.0.0/0 to the NAT gateway, associate private-a.", "private-rt shows local and 0.0.0.0/0 to nat-..."],
    ["Launch a private instance", "Launch Amazon Linux 2023 in private-a, no public IP, no key pair, a security group with NO inbound rules, and IAM instance profile lab-ssm-role.", "Instance running with only a private IP."],
    ["Connect with Session Manager", "Select the instance, Connect, Session Manager tab, Connect. Then run the command below.", "The update check completes: the private instance reached the internet through NAT.", "sudo dnf check-update"],
    ["Turn on Flow Logs", "Select private-a, Flow logs tab, Create flow log: filter All, destination CloudWatch Logs, create a new log group and let the console create the IAM role.", "Flow log status Active. Records appear in the log group within about 10 minutes."],
    ["Break it", "Edit private-rt and remove the 0.0.0.0/0 route.", "Session Manager may disconnect; the instance can no longer reach the internet or SSM."],
    ["Diagnose with Reachability Analyzer", "VPC, Reachability Analyzer, Create path: source your private instance, destination the internet gateway lab-igw. Analyze.", "Result: Not reachable, pointing at the missing route in private-rt."],
    ["Fix and verify", "Add the 0.0.0.0/0 route to the NAT back. Reconnect with Session Manager and rerun the command. Look in the flow log group for ACCEPT records.", "Commands work again; flow logs show ACCEPT."]
  ],
  cleanup: ["Terminate the private instance.", "Delete the NAT gateway (this stops the hourly charge), then release its Elastic IP.", "Delete the flow log and its CloudWatch log group.", "Delete private-rt. Keep or delete lab-vpc and lab-ssm-role."],
  stuck: [["Session Manager says the instance isn't connected", "Check the role is attached, the private route points to NAT, and the NAT is in a PUBLIC subnet. Wait 5 minutes after attaching the role."], ["Reachability Analyzer shows reachable but it still fails", "Check the subnet's network ACL allows outbound traffic and inbound ephemeral ports 1024 to 65535."]],
  quiz: [
    ["Where must a NAT gateway be placed?", ["In the private subnet", "In a public subnet with a route to an internet gateway", "Outside the VPC", "In any subnet"], 1, "The NAT reaches the internet through the public subnet's IGW route."],
    ["Which tool pinpoints the blocking component without sending traffic?", ["VPC Flow Logs", "Reachability Analyzer", "CloudTrail", "X-Ray"], 1, "Reachability Analyzer analyzes configuration paths."],
    ["Session Manager lets you connect without which of these?", ["An IAM role", "Open inbound ports or SSH keys", "The SSM agent", "Any network path to SSM"], 1, "No inbound ports or keys; it still needs a role and an outbound path."]
  ] });

LAB({ id: "l03", tags: "s3.4 s1.3 s4.1", title: "Lab 3: Private S3 website behind CloudFront", time: "40 min", cost: "Free Tier or a few cents",
  goal: "Serve a website from a private S3 bucket through CloudFront using origin access control, then add versioning and a lifecycle rule.",
  why: "OAC, CloudFront caching, versioning, and lifecycle are all core SAA topics.",
  steps: [
    ["Create a private bucket", "S3, Create bucket with a unique name (for example cloud-ops-lab-yourname). Leave Block Public Access ON.", "Bucket created; access shows 'Bucket and objects not public'."],
    ["Upload a page", "Create index.html on your computer with the content below and upload it.", "index.html is in the bucket.", "<h1>Served by CloudFront from a private bucket</h1>"],
    ["Try the S3 URL", "Open the object and click its Object URL.", "Access Denied. The bucket is private, as intended."],
    ["Create the distribution", "CloudFront, Create distribution. Origin: your bucket (the S3 bucket endpoint, not a website endpoint). Origin access: Origin access control, create a new OAC. Default root object: index.html. Create.", "The distribution is deploying. CloudFront offers a bucket policy to copy (or offers to update it for you)."],
    ["Allow only CloudFront", "Apply the bucket policy CloudFront generated to your bucket (Permissions, Bucket policy).", "The policy allows the cloudfront.amazonaws.com service principal with a condition on your distribution's ARN."],
    ["Test", "When the distribution is Enabled, open https://YOUR-ID.cloudfront.net", "Your page loads over HTTPS. The direct S3 URL still says Access Denied."],
    ["Update and invalidate", "Change the text in index.html and upload it again. Reload the CloudFront URL, then create an invalidation for /index.html and reload again.", "Before invalidation you may see the old page (cached). After, the new one."],
    ["Versioning and lifecycle", "Bucket Properties: enable Versioning. Management: create a lifecycle rule moving noncurrent versions to Standard-IA after 30 days and expiring them after 90.", "The object shows two versions under 'Show versions'. The lifecycle rule is listed."]
  ],
  cleanup: ["Disable the CloudFront distribution, wait until it finishes, then delete it.", "Delete the OAC.", "Empty the bucket (including all versions) and delete it."],
  stuck: [["403 from CloudFront", "The bucket policy is missing or has the wrong distribution ARN, or the default root object isn't index.html."], ["Still see the old page", "That's caching. Create an invalidation or wait for the TTL."]],
  quiz: [
    ["What does origin access control do?", ["Encrypts objects", "Lets only CloudFront read a private S3 bucket", "Speeds up uploads", "Replicates objects"], 1, "OAC restricts the origin so users must go through CloudFront."],
    ["You updated a file but CloudFront shows the old one. What's the fix?", ["Delete the bucket", "Create an invalidation or use versioned file names", "Turn off HTTPS", "Enable Transfer Acceleration"], 1, "Invalidation clears cached copies at the edge."]
  ] });

LAB({ id: "l04", tags: "s2.2 o2.1 o2.2", title: "Lab 4: Load balancer and Auto Scaling across two AZs", time: "60 min", cost: "Roughly $0.05 to $0.20 per hour while running (ALB is billed hourly)",
  goal: "Run a web tier across two Availability Zones behind an Application Load Balancer, then kill an instance and watch it heal.",
  why: "ALB plus Auto Scaling across AZs is the default highly available design on SAA and CloudOps.",
  steps: [
    ["Add a second public subnet", "In lab-vpc, create public-b (10.0.3.0/24) in a DIFFERENT AZ than public-a, associate it with public-rt, and enable auto-assign public IP.", "Two public subnets in two AZs."],
    ["Security groups", "Create alb-sg allowing HTTP 80 from 0.0.0.0/0. Create app-sg allowing HTTP 80 only from the security group alb-sg.", "app-sg's inbound source is alb-sg, not an IP range."],
    ["Launch template", "EC2, Launch templates, Create: Amazon Linux 2023, free-tier type, security group app-sg, and the Lab 1 user data.", "Template version 1 created."],
    ["Target group", "EC2, Target groups, Create: type Instances, HTTP 80, lab-vpc, health check path /.", "Empty target group created."],
    ["Load balancer", "Create an Application Load Balancer: internet-facing, subnets public-a and public-b, security group alb-sg, listener HTTP 80 forwarding to your target group.", "ALB state becomes Active and has a DNS name."],
    ["Auto Scaling group", "Create an Auto Scaling group from your template: subnets public-a and public-b, attach to the target group, turn on ELB health checks, desired 2, min 2, max 4, target tracking policy on average CPU 50%.", "Two instances launch, one per AZ, and become Healthy in the target group."],
    ["Test load balancing", "Open http://YOUR-ALB-DNS and refresh several times.", "The hostname alternates between two instances."],
    ["Break it", "Terminate one of the instances from the EC2 console.", "Within a few minutes, Auto Scaling launches a replacement and the target group shows two healthy targets again. The site stayed up."]
  ],
  cleanup: ["Delete the Auto Scaling group (it terminates its instances).", "Delete the load balancer, then the target group.", "Delete the launch template and security groups alb-sg and app-sg."],
  stuck: [["Targets unhealthy", "app-sg must allow port 80 from alb-sg, and the health check path must return 200. Give user data a few minutes."], ["503 from the ALB", "No healthy targets yet. Check the target group."]],
  quiz: [
    ["Why should app-sg allow traffic from alb-sg rather than 0.0.0.0/0?", ["It's faster", "Only the load balancer can reach the instances", "It's required by Auto Scaling", "It enables HTTPS"], 1, "Security group referencing limits access to the ALB."],
    ["What replaced the terminated instance?", ["CloudWatch", "The Auto Scaling group maintaining desired capacity", "The ALB", "Route 53"], 1, "Auto Scaling keeps the desired count and replaces unhealthy or missing instances."]
  ] });

LAB({ id: "l05", tags: "o1.1 o1.2", title: "Lab 5: CloudWatch agent, disk alarm, and email alert", time: "50 min", cost: "Free Tier or a few cents",
  goal: "Collect memory and disk metrics with the CloudWatch agent, alarm on disk usage, and get an email.",
  why: "This is the '3 AM disk alarm' scenario. Memory and disk are NOT default metrics, and CloudOps tests that constantly.",
  steps: [
    ["Role permissions", "Add the CloudWatchAgentServerPolicy to lab-ssm-role (from Lab 2).", "The role has two policies."],
    ["Launch an instance", "Launch Amazon Linux 2023 in public-a with lab-ssm-role and no inbound rules.", "Instance running; Session Manager connects."],
    ["Install the agent", "Systems Manager, Run Command, document AWS-ConfigureAWSPackage, action Install, name AmazonCloudWatchAgent, target your instance.", "Command status: Success."],
    ["Configure and start", "Connect with Session Manager and run the command below, which writes a small config and starts the agent.", "No errors, and the agent status shows running.",
     "sudo tee /opt/aws/amazon-cloudwatch-agent/etc/lab.json >/dev/null <<'EOF'\n{\"metrics\":{\"append_dimensions\":{\"InstanceId\":\"${aws:InstanceId}\"},\n \"metrics_collected\":{\"mem\":{\"measurement\":[\"mem_used_percent\"]},\n \"disk\":{\"measurement\":[\"used_percent\"],\"resources\":[\"/\"]}}}}\nEOF\nsudo /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a fetch-config -m ec2 -s -c file:/opt/aws/amazon-cloudwatch-agent/etc/lab.json\nsudo /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a status"],
    ["Find the metrics", "CloudWatch, Metrics, All metrics, namespace CWAgent.", "mem_used_percent and disk_used_percent appear for your instance (allow about 5 minutes)."],
    ["Create an SNS topic", "SNS, Topics, Create standard topic lab-alerts, create an email subscription, and confirm it from your inbox.", "Subscription status: Confirmed."],
    ["Create the alarm", "CloudWatch, Alarms, Create alarm on CWAgent disk_used_percent for your instance: greater than 30 for 1 datapoint of 1 minute, notify lab-alerts.", "Alarm in OK state."],
    ["Fill the disk", "In Session Manager, create a big file with the command below.", "Within a few minutes the alarm goes to ALARM and you get an email.", "sudo fallocate -l 3G /bigfile && df -h /"],
    ["Recover", "Delete the file with sudo rm /bigfile.", "The alarm returns to OK."]
  ],
  cleanup: ["Delete the alarm and the lab-alerts topic.", "Terminate the instance.", "Optionally remove CloudWatchAgentServerPolicy from the role."],
  stuck: [["No CWAgent metrics", "Check the role has CloudWatchAgentServerPolicy and rerun the status command. Look at /opt/aws/amazon-cloudwatch-agent/logs/amazon-cloudwatch-agent.log."], ["No email", "Confirm the SNS subscription and check spam."]],
  quiz: [
    ["Which EC2 metrics require the CloudWatch agent?", ["CPUUtilization", "Memory and disk space used", "NetworkIn", "StatusCheckFailed"], 1, "OS-level metrics like memory and disk come from the agent."],
    ["What sends the alarm email?", ["CloudTrail", "An SNS topic subscribed to by email", "AWS Config", "EventBridge Scheduler"], 1, "CloudWatch alarms notify through SNS."]
  ] });

LAB({ id: "l06", tags: "s2.1 o3.2", title: "Lab 6: Event-driven pipeline (S3 to Lambda to DynamoDB)", time: "40 min", cost: "Free Tier or pennies",
  goal: "When a file lands in S3, a Lambda function records it in DynamoDB automatically. No servers.",
  why: "Loose coupling and event-driven automation are central to SAA Domain 2 and CloudOps 3.2.",
  steps: [
    ["Create the table", "DynamoDB, Create table named uploads with partition key file (String). Default settings.", "Table status Active."],
    ["Create the function", "Lambda, Create function lab-recorder, runtime Python 3.12 (or newer), new basic execution role. Paste the code below and Deploy.", "Function saved and deployed.",
     "import boto3, urllib.parse\ntable = boto3.resource('dynamodb').Table('uploads')\n\ndef lambda_handler(event, context):\n    for r in event['Records']:\n        key = urllib.parse.unquote_plus(r['s3']['object']['key'])\n        size = r['s3']['object'].get('size', 0)\n        table.put_item(Item={'file': key, 'size': size})\n    return {'ok': True}"],
    ["Give it permission", "Open the function's execution role in IAM and add an inline policy allowing dynamodb:PutItem on the uploads table's ARN.", "The role now has the basic execution policy plus your inline policy."],
    ["Create a bucket and trigger", "Create a new S3 bucket. In Lambda, Add trigger, S3, choose the bucket, event type All object create events, acknowledge the recursion warning.", "The trigger appears in the function diagram."],
    ["Test", "Upload any two files to the bucket.", "Two items appear in the uploads table (Explore items), each with the file name and size."],
    ["Read the logs", "Lambda, Monitor, View CloudWatch logs.", "One log stream with START, END, and REPORT lines showing duration and memory."],
    ["Break it", "Remove the inline DynamoDB policy and upload another file.", "No new item appears; the logs show AccessDeniedException. Least privilege in action. Add the policy back."]
  ],
  cleanup: ["Remove the trigger and delete the function.", "Empty and delete the bucket.", "Delete the uploads table.", "Delete the function's log group and IAM role."],
  stuck: [["No items appear", "Check the logs. AccessDenied means the role policy; no logs at all means the trigger isn't attached."]],
  quiz: [
    ["What is the maximum run time for one Lambda invocation?", ["5 minutes", "15 minutes", "1 hour", "Unlimited"], 1, "Lambda's maximum timeout is 15 minutes."],
    ["The function failed with AccessDeniedException writing to DynamoDB. What's wrong?", ["The table is full", "The execution role lacks dynamodb:PutItem", "S3 is private", "Lambda is out of memory"], 1, "The function's execution role needs permission for each action it performs."]
  ] });

LAB({ id: "l07", tags: "o3.1", title: "Lab 7: CloudFormation change sets, drift, and DeletionPolicy", time: "40 min", cost: "Free",
  goal: "Deploy infrastructure from a template, preview changes safely, catch manual drift, and keep data when a stack is deleted.",
  why: "Change sets, drift detection, and DeletionPolicy are classic CloudOps questions.",
  steps: [
    ["Save the template", "Save the YAML below as lab.yaml.", "A text file named lab.yaml.",
     "AWSTemplateFormatVersion: '2010-09-09'\nDescription: Cloud Ops lab stack\nResources:\n  LabTopic:\n    Type: AWS::SNS::Topic\n  LabBucket:\n    Type: AWS::S3::Bucket\n    DeletionPolicy: Retain\n    Properties:\n      VersioningConfiguration:\n        Status: Enabled\n      Tags:\n        - Key: env\n          Value: lab\nOutputs:\n  BucketName:\n    Value: !Ref LabBucket"],
    ["Create the stack", "CloudFormation, Create stack, upload lab.yaml, name lab-stack.", "Status CREATE_COMPLETE; Outputs shows the bucket name."],
    ["Preview a change", "Edit lab.yaml, change Value: lab to Value: dev. Stack actions, Create change set for current stack, upload the new file.", "The change set shows LabBucket Modify with Replacement False. Execute it."],
    ["Cause drift", "In the S3 console, open the lab bucket, Properties, and suspend Versioning.", "Versioning shows Suspended."],
    ["Detect drift", "Stack actions, Detect drift, then View drift results.", "LabBucket is DRIFTED; the details show VersioningConfiguration differs."],
    ["Delete the stack", "Delete lab-stack.", "The stack is deleted, the SNS topic is gone, but the bucket still exists because of DeletionPolicy: Retain."]
  ],
  cleanup: ["Empty and delete the retained bucket manually."],
  stuck: [["Change set shows no changes", "Make sure you uploaded the edited template."]],
  quiz: [
    ["What shows the effect of an update before you run it?", ["Drift detection", "A change set", "StackSets", "Rollback"], 1, "Change sets preview additions, modifications, and replacements."],
    ["Why did the bucket survive stack deletion?", ["Versioning", "DeletionPolicy: Retain", "Termination protection", "The bucket wasn't empty"], 1, "Retain keeps the resource when the stack is deleted."]
  ] });

LAB({ id: "l08", tags: "o4.1 o4.2 s1.3", title: "Lab 8: Audit and detect (CloudTrail, Access Analyzer, Config, GuardDuty)", time: "45 min", cost: "Pennies (GuardDuty has a 30-day free trial; turn off Config after)",
  goal: "Find out who did what, catch external sharing, and flag a noncompliant resource automatically.",
  why: "CloudOps Domain 4 and SAA 1.3 expect you to know which service answers which security question.",
  steps: [
    ["Look at CloudTrail event history", "CloudTrail, Event history. Filter by Event name CreateBucket or RunInstances from earlier labs.", "You see your own earlier actions with user, time, and source IP. Event history covers 90 days."],
    ["Create an analyzer", "IAM, Access Analyzer, Create analyzer, type external access, zone of trust: your account.", "Analyzer active with zero or few findings."],
    ["Share a bucket externally", "Create a test bucket and add a bucket policy that allows s3:GetObject to the example account 111122223333 (below; replace YOUR-BUCKET).", "Policy saved.",
     "{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [{\n    \"Effect\": \"Allow\",\n    \"Principal\": {\"AWS\": \"arn:aws:iam::111122223333:root\"},\n    \"Action\": \"s3:GetObject\",\n    \"Resource\": \"arn:aws:s3:::YOUR-BUCKET/*\"\n  }]\n}"],
    ["See the finding", "Back in Access Analyzer, refresh findings.", "An active finding shows your bucket is shared with account 111122223333."],

    ["Try GuardDuty", "GuardDuty, Get started, Enable. Then Settings, Generate sample findings.", "Sample findings appear with severities and resource details."]
  ],
  cleanup: ["Delete the test bucket.", "Archive or delete the analyzer.", "Delete the Config rule and STOP the Config recorder (it bills per configuration item).", "Suspend or disable GuardDuty before the trial ends if you don't want charges."],
  stuck: [["No Access Analyzer finding", "Findings can take a few minutes. Make sure the analyzer's zone of trust is the account, not the organization."]],
  quiz: [
    ["Which service answers 'who deleted this bucket'?", ["CloudWatch", "CloudTrail", "Config", "Inspector"], 1, "CloudTrail records API calls with identity and time."],
    ["Which service shows a bucket is shared with an outside account?", ["IAM Access Analyzer", "Trusted Advisor", "GuardDuty", "Shield"], 0, "Access Analyzer finds resources shared outside your zone of trust."],
    ["Which service flags a bucket without versioning as noncompliant?", ["AWS Config", "Macie", "CloudFront", "X-Ray"], 0, "Config rules evaluate resource configuration."]
  ] });

LAB({ id: "l09", tags: "o2.3 s2.2", title: "Lab 9: Backup and point-in-time recovery", time: "30 min", cost: "Pennies",
  goal: "Recover from an accidental delete with DynamoDB point-in-time recovery and take a backup with AWS Backup.",
  why: "Restoring to meet RPO and RTO is CloudOps Task 2.3.",
  steps: [
    ["Create a table", "DynamoDB, Create table orders with partition key id (String).", "Table Active."],
    ["Turn on PITR", "Backups tab, Point-in-time recovery, Edit, enable.", "PITR Enabled with an earliest restorable time."],
    ["Add data", "Explore items, Create item: add three items with ids 1, 2, 3.", "Three items listed."],
    ["Note the time, then 'accidentally' delete", "Write down the current time. Wait two minutes, then delete item 2.", "Two items left."],
    ["Restore", "Backups, Restore to point in time: pick a time just before the delete, new table name orders-restored.", "Restore finishes after several minutes, as a NEW table."],
    ["Verify", "Explore items in orders-restored.", "All three items are back. The original table still has two: PITR never overwrites the source."],
    ["On-demand backup with AWS Backup", "AWS Backup, Create on-demand backup, resource type DynamoDB, table orders, default vault.", "A completed recovery point appears in the vault."]
  ],
  cleanup: ["Delete the recovery point from the backup vault.", "Delete orders and orders-restored."],

<script id="engine">
// ===== ENGINE: reusable for any cert content pack =====
(function () {
"use strict";
// Capture a clean copy of this page (before rendering) for "Download offline copy".
const PRISTINE = (() => {
  try {
    const root = document.documentElement.cloneNode(true);
    root.querySelectorAll("script").forEach(s => { if (!["pack", "engine"].includes(s.id)) s.remove(); });
    root.querySelectorAll("iframe").forEach(n => n.remove());
    const app = root.querySelector("#app"); if (app) app.innerHTML = "";
    return "<!DOCTYPE html>\n" + root.outerHTML;
  } catch (e) { return null; }
})();
const HOSTED_EMBED = !!(window.claude && window.claude.use);
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const hash = s => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); };
const today = () => { const d = new Date(); return Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 86400000); };
const dom = o => +String(o)[0];
const objCmp = (a, b) => a.localeCompare(b, undefined, { numeric: true });
const T = tr => PACK.tracks[tr];
const TRACKS = PACK.trackOrder || Object.keys(PACK.tracks);
const OBJ_KEYS = {}; TRACKS.forEach(t => { OBJ_KEYS[t] = Object.keys(T(t).objectives).sort(objCmp); });
const SEL = () => { const s = ((S && S.tracks) || []).filter(t => PACK.tracks[t]); return s.length ? TRACKS.filter(t => s.includes(t)) : TRACKS.slice(); };
const DT = () => SEL().includes(SUB.map) ? SUB.map : SEL()[0];
const oOf = (i, tr) => (i && i.x && i.x[tr]) || null;
const inTrack = (i, tr) => !!oOf(i, tr);
const inPool = i => SEL().some(t => inTrack(i, t));
const trShow = i => inTrack(i, DT()) ? DT() : (SEL().find(t => inTrack(i, t)) || Object.keys((i && i.x) || {})[0]);
const oShow = i => oOf(i, trShow(i));
const INTERVALS = [0, 1, 3, 7, 14, 30];
const LEVELS = PACK.levels || ["Visitor", "Apprentice", "Practitioner", "Specialist", "Engineer", "Architect", "Principal"];

// ---------- build items ----------
const ITEMS = [], BYID = {}, BYOBJ = {};
PACK.cards.forEach(c => { const it = Object.assign({}, c, { kind: "card", id: "c:" + slug(c.t) }); if (BYID[it.id]) it.id += ":" + hash(c.d); BYID[it.id] = it; ITEMS.push(it); });
PACK.mcq.forEach(q => { const it = Object.assign({}, q, { kind: "mcq", id: "q:" + hash(q.q) }); BYID[it.id] = it; ITEMS.push(it); });
TRACKS.forEach(t => { BYOBJ[t] = {}; });
ITEMS.forEach(i => { TRACKS.forEach(t => { const o = oOf(i, t); if (o) (BYOBJ[t][o] = BYOBJ[t][o] || []).push(i); }); });
const CARDS = ITEMS.filter(i => i.kind === "card");

// ---------- state ----------
const KEY = PACK.id + ":v1";
const blank = () => ({ v: 1, items: {}, obj: {}, xp: 0, streak: 0, lastDay: null, examDate: "", runLen: 20, newPerRun: 10, best: {}, days: {}, exams: [], welcomed: false, theme: "", tracks: [], labs: {}, updatedAt: 0 });
let S = load();
function migrate(s) { if (!Array.isArray(s.tracks)) s.tracks = []; if (!s.labs || typeof s.labs !== "object") s.labs = {}; return s; }
function load() { try { const r = localStorage.getItem(KEY); if (r) return migrate(Object.assign(blank(), JSON.parse(r))); } catch (e) {} return blank(); }
function mergeState(a, b) {
  if (!b || typeof b !== "object") return a;
  if ((b.updatedAt || 0) < (a.resetAt || 0)) return a;
  if ((a.updatedAt || 0) < (b.resetAt || 0)) a = blank();
  const m = JSON.parse(JSON.stringify(Object.assign(blank(), a)));
  const newer = (b.updatedAt || 0) > (a.updatedAt || 0);
  Object.entries(b.items || {}).forEach(([k, v]) => { const x = m.items[k]; const n = v.r + v.w, nx = x ? x.r + x.w : -1; if (!x || n > nx || (n === nx && v.d > x.d)) m.items[k] = v; });
  Object.entries(b.obj || {}).forEach(([k, v]) => { const x = m.obj[k]; if (!x || v.t > x.t) m.obj[k] = v; });
  Object.entries(b.days || {}).forEach(([k, v]) => { m.days[k] = Math.max(m.days[k] || 0, v); });
  Object.entries(b.best || {}).forEach(([k, v]) => { m.best[k] = Math.max(m.best[k] || 0, v); });
  const seen = new Set(m.exams.map(x => x.at)); (b.exams || []).forEach(x => { if (!seen.has(x.at)) m.exams.push(x); }); m.exams.sort((x, y) => x.at - y.at);
  Object.entries(b.labs || {}).forEach(([k, v]) => { const x = m.labs[k] || { s: [], c: [], done: false };
    m.labs[k] = { s: [...new Set([...(x.s || []), ...(v.s || [])])], c: [...new Set([...(x.c || []), ...(v.c || [])])], done: !!(x.done || v.done) }; });
  m.xp = Math.max(m.xp || 0, b.xp || 0);
  if ((b.lastDay || 0) > (m.lastDay || 0)) { m.lastDay = b.lastDay; m.streak = b.streak; } else if (b.lastDay === m.lastDay) m.streak = Math.max(m.streak, b.streak || 0);
  if (newer) ["examDate", "runLen", "newPerRun", "theme", "tracks", "welcomed"].forEach(k => { if (b[k] !== undefined && b[k] !== "") m[k] = b[k]; });
  else if (!m.examDate && b.examDate) m.examDate = b.examDate;
  m.welcomed = m.welcomed || !!b.welcomed;
  m.resetAt = Math.max(a.resetAt || 0, b.resetAt || 0);
  m.updatedAt = Math.max(a.updatedAt || 0, b.updatedAt || 0);
  return migrate(m);
}
if (window.__SEED) { try { S = mergeState(S, migrate(Object.assign(blank(), window.__SEED))); localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function save() { S.updatedAt = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} cloudSave(); }

// optional account sync (claude.ai runtime). Works without it.
let cloud = null, cloudTimer = null, syncNote = "";
(async () => {
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const uid = await user.id(); if (!uid) return;
    const ref = db.doc("data/users/" + uid + "/progress");
    const snap = await ref.get();
    cloud = { ref };
    if (snap.exists) {
      const d = snap.data();
      if (d && d.state) { const remote = migrate(Object.assign(blank(), JSON.parse(d.state))); S = mergeState(S, remote); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
    }
    syncNote = "Progress saves to your Claude account and this browser"; cloudSave(); render();
  } catch (e) { cloud = null; }
})();
function cloudSave() {
  if (!cloud) return; clearTimeout(cloudTimer);
  cloudTimer = setTimeout(async () => { try { await cloud.ref.set({ state: JSON.stringify(S), updatedAt: S.updatedAt }); } catch (e) {} }, 1200);
}

// ---------- files: offline copy + backups ----------
async function offerFile(filename, data, mime) {
  if (HOSTED_EMBED) {
    try {
      const dl = await window.claude.use("downloads");
      if (dl) { await dl.save({ filename, data: new Blob([data], { type: mime }) }); return true; }
    } catch (err) { if (err && err.code === "declined") return false; }
  }
  try {
    const url = URL.createObjectURL(new Blob([data], { type: mime }));
    const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000); return true;
  } catch (err) { toast("This browser blocked the download"); return false; }
}
function stamp() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function downloadOffline() {
  if (!PRISTINE) return toast("Offline copy isn't available in this view");
  const seed = "<script id=\"seed\">window.__SEED=" + JSON.stringify(S).replace(/</g, "\\u003c") + ";<\/script>";
  const html = PRISTINE.replace('<script id="pack">', seed + '\n<script id="pack">');
  offerFile(slug(PACK.brand) + "-offline.html", html, "text/html");
}
function downloadBackup() { offerFile(PACK.id + "-progress-" + stamp() + ".json", JSON.stringify(S), "application/json"); }
function importBackup(file) {
  const r = new FileReader();
  r.onload = () => {
    try { const b = JSON.parse(r.result); if (!b || typeof b.items !== "object") throw 0; S = mergeState(S, migrate(Object.assign(blank(), b))); save(); render(); toast("Backup merged into your progress"); }
    catch (err) { toast("That file isn't a Sec+ Ops backup"); }
  };
  r.readAsText(file);
}

// ---------- learning model ----------
function touchDay() { const t = today(); S.days[t] = (S.days[t] || 0) + 1; if (S.lastDay !== t) { S.streak = S.lastDay === t - 1 ? S.streak + 1 : 1; S.lastDay = t; } }
function addXP(n) { S.xp += n; }
function objStat1(k, ok) { const s = S.obj[k] || { r: 0, t: 0 }; s.t++; if (ok) s.r++; S.obj[k] = s; }
function objStat(x, ok) { Object.entries((x && x.x) || {}).forEach(([t, o]) => objStat1(t + ":" + o, ok)); }
function grade(id, ok) {
  const it = S.items[id] || { b: 0, d: 0, r: 0, w: 0 };
  if (ok) { it.b = Math.min(5, it.b + 1); it.d = today() + INTERVALS[it.b]; it.r++; }
  else { it.b = 1; it.d = today(); it.w++; }
  S.items[id] = it; objStat(BYID[id], ok); addXP(ok ? 10 : 2); touchDay();
}
function seenCount(list) { return list.filter(i => S.items[i.id]).length; }
function objMastery(o, tr) {
  tr = tr || DT(); const its = BYOBJ[tr][o] || []; if (!its.length) return 0;
  let m = 0; its.forEach(i => { const st = S.items[i.id]; if (st) m += st.b / 5; }); m /= its.length;
  const a = S.obj[tr + ":" + o]; const cov = seenCount(its) / its.length;
  if (a && a.t >= 3) return Math.min(1, 0.85 * m + 0.15 * (a.r / a.t) * cov);
  return m;
}
function domMastery(d, tr) { const os = OBJ_KEYS[tr].filter(o => dom(o) === d); return os.reduce((s, o) => s + objMastery(o, tr), 0) / os.length; }
function readiness(tr) { tr = tr || DT(); return T(tr).domains.reduce((s, d) => s + d.w * domMastery(d.n, tr), 0) / 100; }
function level() { const l = Math.floor(S.xp / 600); return { n: l + 1, title: LEVELS[Math.min(l, LEVELS.length - 1)], into: S.xp % 600 }; }
function dueCount(filter) { const t = today(); return ITEMS.filter(i => inPool(i) && (!filter || filter(i)) && S.items[i.id] && S.items[i.id].d <= t).length; }
function newCount(filter) { return ITEMS.filter(i => inPool(i) && (!filter || filter(i)) && !S.items[i.id]).length; }

function pickNew(list, n) {
  const groups = {};
  list.forEach(i => { const tr = trShow(i), o = oOf(i, tr), k = tr + ":" + dom(o);
    if (!groups[k]) groups[k] = { w: ((T(tr).domains[dom(o) - 1] || { w: 10 }).w) * (tr === DT() ? 1.5 : 1), a: [] };
    groups[k].a.push(i); });
  Object.values(groups).forEach(g => g.a.sort((x, y) => objCmp(oShow(x), oShow(y)) || (x.kind === y.kind ? 0 : x.kind === "card" ? -1 : 1)));
  const out = [];
  while (out.length < n) {
    const ks = Object.keys(groups).filter(k => groups[k].a.length); if (!ks.length) break;
    const tot = ks.reduce((s, k) => s + groups[k].w, 0); let r = Math.random() * tot, pick = ks[0];
    for (const k of ks) { r -= groups[k].w; if (r <= 0) { pick = k; break; } }
    out.push(groups[pick].a.shift());
  }
  return out;
}
function buildRun(filter, len, newMax) {
  len = len || S.runLen; newMax = newMax == null ? S.newPerRun : newMax;
  const t = today(); const pool = ITEMS.filter(i => inPool(i) && (!filter || filter(i)));
  const due = pool.filter(i => S.items[i.id] && S.items[i.id].d <= t).sort((a, b) => S.items[a.id].d - S.items[b.id].d || S.items[a.id].b - S.items[b.id].b);
  let run = due.slice(0, len);
  run = run.concat(pickNew(pool.filter(i => !S.items[i.id]), Math.min(newMax, len - run.length)));
  if (run.length < len) {
    const extra = shuffle(pool.filter(i => S.items[i.id] && !run.includes(i))).sort((a, b) => S.items[a.id].b - S.items[b.id].b).slice(0, len - run.length);
    run = run.concat(extra);
  }
  return run;
}

// ---------- questions ----------
function distractors(item, n) {
  const pick = new Map();
  const add = arr => shuffle(arr).forEach(c => { if (pick.size < n && c.id !== item.id && c.t !== item.t && !pick.has(c.t)) pick.set(c.t, c); });
  add(CARDS.filter(c => c.f === item.f));
  add(CARDS.filter(c => oShow(c) === oShow(item)));
  add(CARDS.filter(c => dom(oShow(c)) === dom(oShow(item))));
  return [...pick.values()];
}
function makeQ(item, forceDir) {
  if (item.kind === "mcq") {
    const idx = shuffle(item.c.map((_, i) => i));
    return { item, ask: "", prompt: item.q, options: idx.map(i => item.c[i]), ans: idx.indexOf(item.a), explain: item.e, hook: "" };
  }
  const opts = shuffle([item, ...distractors(item, 3)]);
  const fwd = forceDir != null ? forceDir : Math.random() < 0.6;
  if (fwd) return { item, ask: item.f === "port" ? "Which protocol is this?" : "Which term matches this description?", prompt: item.d, options: opts.map(x => x.t), ans: opts.indexOf(item), explain: item.t + ": " + item.d, hook: item.m };
  return { item, ask: item.f === "port" ? "What does this protocol use?" : "What does this term mean?", prompt: item.t, term: true, options: opts.map(x => x.d), ans: opts.indexOf(item), explain: item.t + ": " + item.d, hook: item.m };
}

// ---------- UI state ----------
let VIEW = "hq", ACT = null, SUB = { train: null, lib: "obj" }, examTimer = null;
const app = () => $("#app");
function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 1800); }
function chip(x) {
  const tr = trShow(x), o = oOf(x, tr); if (!o) return "";
