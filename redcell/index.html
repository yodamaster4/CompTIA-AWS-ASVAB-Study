<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#13223B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Study Trainer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --sunk:#E3E8EF; --ink:#13223B; --muted:#56657C; --line:#CDD5E0;
  --accent:#FF9F43; --accent-ink:#13223B; --ok:#1C7F52; --ok-bg:#DDF2E7; --bad:#B83434; --bad-bg:#F8E1E1;
  --d1:#3566AE; --d2:#BC4E32; --d3:#6650A6; --d4:#177F72; --d5:#86741A;
  --head:"Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono:ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:10px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0E1827; --surface:#162438; --sunk:#1D2E46; --ink:#E6ECF4; --muted:#9BAAC0; --line:#2B3D57;
  --accent:#FFAA55; --accent-ink:#13223B; --ok:#4CC58A; --ok-bg:#153A2B; --bad:#F07A7A; --bad-bg:#43202A;
  --d1:#6F9FE6; --d2:#E88468; --d3:#A08CDD; --d4:#49C1B0; --d5:#D2BE58;
}}
:root[data-theme="dark"]{
  --bg:#0E1827; --surface:#162438; --sunk:#1D2E46; --ink:#E6ECF4; --muted:#9BAAC0; --line:#2B3D57;
  --accent:#FFAA55; --accent-ink:#13223B; --ok:#4CC58A; --ok-bg:#153A2B; --bad:#F07A7A; --bad-bg:#43202A;
  --d1:#6F9FE6; --d2:#E88468; --d3:#A08CDD; --d4:#49C1B0; --d5:#D2BE58;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,label.btn{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overflow-wrap:anywhere}
button:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--head);line-height:1.15;margin:0}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:18px;min-height:62px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--head);font-weight:700;font-size:21px;letter-spacing:.01em;background:none;border:0;padding:0}
.badge{width:34px;height:34px;border-radius:8px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:14px;font-weight:700}
.nav{display:flex;gap:4px;margin-left:8px}
.nav button{background:none;border:0;padding:8px 14px;border-radius:8px;font-family:var(--head);font-weight:600;font-size:16px;color:var(--muted)}
.nav button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:inset 0 -3px 0 var(--accent)}
.stats{margin-left:auto;display:flex;gap:16px;align-items:center;font-size:14px;color:var(--muted)}
.stats b{font-family:var(--head);font-size:18px;color:var(--ink);font-weight:700}
.stat{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}
.bnav{display:none}
@media (max-width:760px){
  .nav{display:none}
  .stats .hide-sm{display:none}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .bnav button{flex:1;background:none;border:0;padding:10px 4px;font-family:var(--head);font-weight:600;font-size:15px;color:var(--muted);border-radius:8px}
  .bnav button[aria-current="page"]{color:var(--ink);background:var(--sunk)}
  main{padding-bottom:84px}
  body.playing .bnav{display:none}
}
main{padding:26px 0 60px}
.brand,.stat{white-space:nowrap}
@media (max-width:760px){.top .wrap{gap:10px;min-height:56px}.brand{font-size:18px;gap:8px}.badge{width:30px;height:30px;font-size:13px}.stats{gap:12px;font-size:11.5px}.stats b{font-size:15px}.wrap{padding:0 14px}.qcard{padding:18px}.qcard .prompt{font-size:19px}.qcard .prompt.term{font-size:26px}.today h1{font-size:28px}}
@media (max-width:360px){.brand{font-size:0;gap:0}.brand .badge{font-size:13px}}
@media (hover:none){.keyhint{display:none}}

/* generic */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--ink);background:var(--accent);color:var(--accent-ink);font-family:var(--head);font-weight:700;font-size:17px;padding:11px 20px;border-radius:9px;min-height:46px}
.btn:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.small{font-size:15px;padding:7px 14px;min-height:38px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.muted{color:var(--muted)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:3px 9px;border-radius:99px;background:color-mix(in srgb,var(--dc,var(--muted)) 16%,transparent);color:var(--dc,var(--muted));max-width:100%;line-height:1.3}
.d1{--dc:var(--d1)}.d2{--dc:var(--d2)}.d3{--dc:var(--d3)}.d4{--dc:var(--d4)}.d5{--dc:var(--d5)}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:34px 0 14px}
.sechead h2{font-size:24px}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:18px}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--dc,var(--accent));border-radius:99px;transition:width .4s}

/* HQ */
.today h1{font-size:32px;margin-bottom:6px}
.today .counts{display:flex;gap:22px;margin:14px 0 18px}
.today .counts div{font-size:14px;color:var(--muted)}
.today .counts b{display:block;font-family:var(--head);font-size:30px;color:var(--ink)}
.focus{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.focus button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:14px;font-weight:700;color:var(--dc,var(--ink))}
.focus button:hover{border-color:var(--dc,var(--ink))}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi b{display:block;font-family:var(--head);font-size:28px;font-weight:700}
.kpi span{font-size:14px;color:var(--muted)}
.spark{display:flex;gap:4px;align-items:flex-end;height:44px;margin-top:10px}
.spark i{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:3px;opacity:.9}
.spark i.zero{background:var(--line)}

/* floor plan: the facility map */
.plan{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:16px;background:var(--surface);border:2px solid var(--ink);border-radius:4px;position:relative;
  background-image:linear-gradient(var(--sunk) 1px,transparent 1px),linear-gradient(90deg,var(--sunk) 1px,transparent 1px);background-size:22px 22px}
.wing{border:2px solid var(--dc);background:var(--surface);border-radius:3px;padding:12px;display:flex;flex-direction:column;gap:10px}
@media (max-width:860px){.plan{grid-template-columns:1fr}}
.wing header{display:flex;align-items:baseline;gap:10px}
.wing header .num{font-family:var(--head);font-weight:700;font-size:26px;color:var(--dc);line-height:1}
.wing header h3{font-size:16px}
.wing header .w{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.room{--m:0;position:relative;text-align:left;border:1.5px solid color-mix(in srgb,var(--dc) 55%,var(--line));border-radius:3px;padding:8px 9px 9px;min-height:74px;
  background:linear-gradient(to top,color-mix(in srgb,var(--dc) 32%,transparent) calc(var(--m) * 100%),var(--surface) calc(var(--m) * 100%));display:flex;flex-direction:column;gap:2px}
.room:hover{border-color:var(--dc)}
.room .rn{font-family:var(--head);font-weight:700;font-size:15px;color:var(--dc)}
.room .rt{font-size:13.5px;line-height:1.25}
.room .rp{margin-top:auto;font-size:12px;color:var(--muted)}
.room.secured{border-color:var(--dc);border-width:2.5px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:14px;height:14px;border:1.5px solid var(--muted);vertical-align:-2px;margin-right:6px;border-radius:2px}

/* train */
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.mode{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:6px;min-height:150px}
.mode:hover{border-color:var(--ink)}
.mode h3{font-size:20px}
.mode p{margin:0;color:var(--muted);font-size:15px}
.mode .tag{margin-top:auto;font-size:13px;font-weight:700;color:var(--muted)}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.pick{text-align:left;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--dc);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.pick:hover{border-color:var(--dc)}
.pick b{font-family:var(--head);font-size:17px}
.pick small{color:var(--muted);font-size:13px}

/* play area */
.play{max-width:760px;margin:0 auto}
.playhead{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.playhead .bar{flex:1}
.x{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-weight:700;font-size:14px}
.count{font-family:var(--head);font-weight:600;font-size:15px;color:var(--muted);white-space:nowrap}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px}
.qcard .ask{font-size:14px;color:var(--muted);margin:12px 0 4px}
.qcard .prompt{font-size:21px;line-height:1.4;margin:0 0 18px}
.qcard .prompt.term{font-family:var(--head);font-size:30px;font-weight:700}
.opts{display:grid;gap:10px}
.opt{text-align:left;display:flex;gap:12px;align-items:flex-start;background:var(--bg);border:2px solid var(--line);border-radius:9px;padding:12px 14px;font-size:17px}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt .k{flex:none;width:26px;height:26px;border-radius:6px;border:1.5px solid var(--muted);display:grid;place-items:center;font-family:var(--head);font-weight:700;font-size:14px;color:var(--muted)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt[disabled]{cursor:default}
.feedback{margin-top:16px;border-radius:9px;padding:14px 16px;border-left:5px solid var(--ok);background:var(--ok-bg)}
.feedback.no{border-left-color:var(--bad);background:var(--bad-bg)}
.feedback h4{margin:0 0 4px;font-family:var(--head);font-size:18px}
.feedback p{margin:4px 0}
.hook{margin-top:8px;padding:10px 12px;border:1.5px dashed var(--accent);border-radius:8px;background:color-mix(in srgb,var(--accent) 12%,transparent)}
.hook b{font-family:var(--head)}
.next{margin-top:16px;display:flex;justify-content:flex-end;gap:10px}
.learn .term{font-family:var(--head);font-size:34px;font-weight:700;margin:10px 0}
.learn .def{font-size:20px;line-height:1.45}
.newtag{font-family:var(--head);font-weight:700;font-size:13px;background:var(--accent);color:var(--accent-ink);padding:2px 8px;border-radius:5px}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .25s 2}
@media (prefers-reduced-motion:reduce){.shake{animation:none}.bar>i{transition:none}}
.kbd{font-size:13px;color:var(--muted);margin-top:14px}

/* match / sort / order */
.match{display:grid;grid-template-columns:1fr 1.5fr;gap:12px}
.match .col{display:grid;gap:8px;align-content:start}
.tile{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:8px;padding:10px 12px;font-size:15px;min-height:52px}
.tile.term{font-family:var(--head);font-weight:600;font-size:16px}
.tile.sel{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.tile.done{border-color:var(--ok);background:var(--ok-bg);opacity:.75}
.tile.bad{border-color:var(--bad);background:var(--bad-bg)}
@media (max-width:560px){.match{grid-template-columns:1fr 1.3fr}.tile{font-size:14px;padding:8px}}
.tray{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;min-height:50px}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.bucket{text-align:left;background:var(--surface);border:2px dashed var(--line);border-radius:10px;padding:10px;min-height:120px;display:flex;flex-direction:column;gap:6px}
.bucket:hover{border-color:var(--ink)}
.bucket h4{margin:0;font-family:var(--head);font-size:16px}
.bucket .in{font-size:13.5px;background:var(--ok-bg);border-radius:6px;padding:4px 7px}
.hint{font-size:14px;color:var(--bad);margin-top:6px}
.seq{display:grid;gap:8px;margin-bottom:16px;counter-reset:s}
.seq div{background:var(--ok-bg);border:2px solid var(--ok);border-radius:8px;padding:9px 12px;font-weight:700;counter-increment:s}
.seq div::before{content:counter(s) ". ";font-family:var(--head)}

/* logs */
.logbox{background:#0F1A2A;color:#D8E2F0;border-radius:10px;padding:10px;overflow-x:auto}
.logline{display:block;width:100%;text-align:left;background:none;border:0;border-left:4px solid transparent;color:inherit;font-family:var(--mono);font-size:13.5px;padding:8px 10px;white-space:pre;border-radius:4px}
.logline:hover{background:#1B2A40}
.logline.flag{border-left-color:#F5BC4A;background:#2A2A1E}
.logline.tp{border-left-color:#4CC58A;background:#153A2B}
.logline.fp{border-left-color:#F07A7A;background:#43202A}
.logline.fn{border-left-color:#F07A7A;background:#2B1F2A;outline:1px dashed #F07A7A}
.why{font-size:14px;margin:4px 0 10px 14px;color:var(--muted)}

/* results */
.result h2{font-size:30px}
.big{font-family:var(--head);font-size:56px;font-weight:700;line-height:1}
.dbar{display:grid;grid-template-columns:190px 1fr 50px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
@media (max-width:560px){.dbar{grid-template-columns:120px 1fr 44px}}
.missed{margin-top:18px;display:grid;gap:10px}
.missed div{border-left:4px solid var(--bad);padding:6px 12px;background:var(--surface);border-radius:4px}

/* exam */
.qnav{display:flex;flex-wrap:wrap;gap:5px;margin-top:16px}
.qnav button{width:34px;height:34px;border:1.5px solid var(--line);background:var(--surface);border-radius:6px;font-size:13px;font-weight:700}
.qnav button.ans{background:var(--sunk)}
.qnav button.cur{border-color:var(--ink);border-width:2.5px}
.qnav button.flg{box-shadow:inset 0 -4px 0 var(--accent)}
.timer{font-family:var(--head);font-weight:700;font-size:18px}

/* library */
details.obj{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--dc);border-radius:6px;margin-bottom:8px}
details.obj summary{cursor:pointer;padding:12px 16px;display:flex;gap:12px;align-items:baseline;list-style:none}
details.obj summary::-webkit-details-marker{display:none}
details.obj summary .rn{font-family:var(--head);font-weight:700;color:var(--dc);min-width:32px}
details.obj summary .pct{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}
.objbody{padding:0 16px 16px}
.terms{display:grid;gap:10px;margin:10px 0 14px}
.terms div{border-top:1px solid var(--line);padding-top:10px}
.terms b{font-family:var(--head);font-size:16.5px}
.terms p{margin:2px 0}
.terms em{color:var(--muted);font-size:14.5px}
.box{display:inline-block;font-size:12px;font-weight:700;padding:1px 7px;border-radius:5px;background:var(--sunk);color:var(--muted);margin-left:6px;vertical-align:1px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;font-family:var(--head);font-weight:600}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px;background:var(--surface)}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line)}
th{font-family:var(--head);font-size:15px}
td.num{font-family:var(--mono);white-space:nowrap}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin:14px 0}
.facts div{background:var(--sunk);border-radius:8px;padding:12px}
.facts b{display:block;font-family:var(--head);font-size:22px}
.facts span{font-size:13.5px;color:var(--muted)}
input[type=date],select{font:inherit;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px}
.welcome{border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.welcome ol{margin:8px 0 12px;padding-left:22px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:9px;font-weight:700;z-index:50;font-size:15px}
.sync{font-size:12px;color:var(--muted)}
p.lead{font-size:18px;max-width:62ch}
.labwarn{margin:14px 0;padding:12px 14px;border-radius:9px;border:1.5px solid var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface));font-size:15px}
.labh{font-size:20px;margin:22px 0 10px}
.steps{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.step{min-width:0;display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.step.on{border-color:var(--ok);background:color-mix(in srgb,var(--ok-bg) 60%,var(--surface))}
.tick{flex:none;width:30px;height:30px;border-radius:8px;border:2px solid var(--muted);background:var(--surface);position:relative}
.tick[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.tick[aria-pressed="true"]::after{content:"";position:absolute;left:9px;top:3px;width:8px;height:15px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg)}
.sbody{min-width:0;flex:1}.sbody h4{margin:3px 0 4px;font-family:var(--head);font-size:17px}.sbody p{margin:4px 0}
.step.on .sbody h4{text-decoration:line-through;text-decoration-color:var(--ok)}
.see{font-size:14.5px;color:var(--muted)}
.codewrap{position:relative;margin:8px 0;max-width:100%;min-width:0}
.code{margin:0;background:#0F1A2A;color:#D8E2F0;font-family:var(--mono);font-size:13px;line-height:1.5;padding:12px 14px;padding-right:74px;border-radius:8px;overflow-x:auto;white-space:pre;overflow-wrap:normal}
.copy{position:absolute;top:6px;right:6px;background:#1B2A40!important;color:#D8E2F0!important;border-color:#2B3D57!important;min-height:30px!important;padding:4px 10px!important;font-size:13px!important}

// tag parser: "p1.1 c1.3 h1.1" -> { pt:"1.1", cysa:"1.3", ceh:"1.1" }
const TK = { p: "pt", c: "cysa", h: "ceh" };
function tags(str) { const x = {}; str.trim().split(/\s+/).forEach(t => { if (t) x[TK[t[0]]] = t.slice(1); }); return x; }
function C(tg, f, t, d, m) { PACK.cards.push({ x: tags(tg), f, t, d, m: m || "" }); }

// ====================================================================
//  METHODOLOGY & ENGAGEMENT  (the posting names NIST 800-115 and PTES)
// ====================================================================
C("p1.1 h1.1", "method", "Rules of Engagement (RoE)", "The written agreement that defines what testers may do, when, from where, and against which targets. Nothing starts until it is signed.", "No signature, no test.");
C("p1.1", "method", "Scope", "The exact systems, networks, IPs, and applications you are authorized to test. Anything outside it is off-limits, even if reachable.", "Reachable is not the same as in-scope.");
C("p1.1", "method", "Authorization / 'get out of jail' letter", "Signed proof from someone who owns the systems that the testing is permitted. It is what separates a pentest from a crime.", "The one document you carry on an on-site job.");
C("p1.1", "method", "Scope creep", "Letting testing drift beyond the agreed targets. Must be refused or formally re-scoped in writing.", "Stay inside the lines.");
C("p1.1", "method", "Statement of Work (SOW)", "The contract section defining deliverables, timeline, and responsibilities for the engagement.", "What you'll deliver and by when.");
C("p1.1", "method", "Master Service Agreement (MSA)", "The overarching contract between the testing firm and the client that individual SOWs sit under.", "The umbrella over every SOW.");
C("p1.1", "method", "Non-Disclosure Agreement (NDA)", "Legally binds testers to keep client data and findings confidential.", "What happens in the test stays in the report.");
C("p1.1", "method", "Permission to test (third party)", "Cloud and hosted targets may need the provider's approval too, not just the client's. Check the provider's testing policy.", "Two landlords can mean two permissions.");
C("p1.2 h1.1", "method", "NIST SP 800-115", "The U.S. government's Technical Guide to Information Security Testing. Four phases: Planning, Discovery, Attack, Reporting.", "Plan, Discover, Attack, Report.");
C("p1.2", "method", "NIST 800-115: Planning", "Phase 1. Set rules, scope, goals, and gather approvals before any technical work.", "Paperwork before packets.");
C("p1.2", "method", "NIST 800-115: Discovery", "Phase 2. Reconnaissance and scanning to find hosts, services, and potential vulnerabilities.", "Find the targets and their weak spots.");
C("p1.2", "method", "NIST 800-115: Attack", "Phase 3. Verify vulnerabilities by exploiting them; loops back to Discovery as new access reveals more.", "Prove the weakness is real.");
C("p1.2", "method", "NIST 800-115: Reporting", "Phase 4. Document findings, risk, and remediation. Runs alongside all phases, not just at the end.", "If it isn't written down, it didn't happen.");
C("p1.2 h1.1", "method", "PTES", "Penetration Testing Execution Standard. Seven phases from pre-engagement to reporting; the industry's common playbook.", "The seven-step pentest recipe.");
C("p1.2", "method", "PTES: Pre-engagement", "Scope, RoE, timeline, and logistics agreed with the client.", "PTES step 1: agree the rules.");
C("p1.2", "method", "PTES: Intelligence Gathering", "Passive and active recon to build a picture of the target.", "PTES step 2: learn the target.");
C("p1.2", "method", "PTES: Threat Modeling", "Identify likely attackers and the assets they'd target to focus the test.", "PTES step 3: think like the attacker.");
C("p1.2", "method", "PTES: Vulnerability Analysis", "Find and validate weaknesses worth exploiting.", "PTES step 4: find the cracks.");
C("p1.2", "method", "PTES: Exploitation", "Gain access by exploiting a validated vulnerability.", "PTES step 5: get in.");
C("p1.2", "method", "PTES: Post-Exploitation", "Determine value of access: escalate, pivot, find sensitive data, measure impact.", "PTES step 6: what can this access reach?");
C("p1.2", "method", "PTES: Reporting", "Communicate findings to technical and executive audiences with clear remediation.", "PTES step 7: tell the story.");
C("p1.2 c1.2 h1.1", "method", "MITRE ATT&CK", "A knowledge base of real-world adversary tactics (the 'why') and techniques (the 'how'), used to plan tests and map detections.", "The attacker's playbook, catalogued.");
C("p1.2", "method", "Cyber Kill Chain", "Lockheed Martin's 7-stage model of an intrusion: Recon, Weaponize, Deliver, Exploit, Install, C2, Actions on Objectives.", "Break any link to stop the attack.");
C("p1.2", "method", "OWASP Testing Guide", "OWASP's methodology for web application security testing; pairs with the OWASP Top 10.", "The web tester's checklist.");
C("p1.2", "method", "Open vs. closed-box testing", "Open-box (white): tester gets full info. Closed-box (black): tester gets nothing. Partial (gray): some info.", "How much the tester knows going in.");
C("p1.1", "method", "Red team vs. pentest", "A pentest finds as many vulns as possible in scope; a red team emulates a real adversary against detection and response, often stealthily.", "Pentest = coverage. Red team = realism.");
C("p1.1", "method", "Red / Blue / Purple team", "Red attacks, Blue defends, Purple is the two working together to improve detection.", "Red + Blue, sharing notes = Purple.");

// ====================================================================
//  REPORTING & RISK
// ====================================================================
C("p1.3 c4.1", "report", "Executive summary", "The non-technical part of a report: business risk and impact, written for leadership.", "The part the boss reads.");
C("p1.3 c4.1", "report", "CVSS", "Common Vulnerability Scoring System, 0.0-10.0. Standard way to rate severity of a finding.", "The 0-to-10 severity dial.");
C("c2.2", "report", "CVSS base metrics", "The intrinsic qualities of a vuln: attack vector, complexity, privileges, user interaction, and impact to C/I/A.", "What the flaw is, regardless of your network.");
C("c2.2", "report", "CVSS environmental metrics", "Adjust the score for your specific environment and asset importance.", "How much this flaw matters to you.");
C("p1.3 c2.2", "report", "CVE", "Common Vulnerabilities and Exposures: a unique ID for a specific publicly known flaw (e.g. CVE-2021-44228).", "The vuln's name tag.");
C("c2.2", "report", "CWE", "Common Weakness Enumeration: categories of flaw types (e.g. CWE-79 is XSS). CVE is an instance; CWE is the class.", "The family a vuln belongs to.");
C("p1.3", "report", "Risk = likelihood x impact", "The core formula for rating findings: how likely it is to be exploited times how bad it would be.", "Odds times damage.");
C("p1.3 c2.3", "report", "Remediation", "The fix for a finding (patch, config change, code fix). A good report always includes it.", "Don't just break it, say how to fix it.");
C("c2.3", "report", "Risk acceptance", "A documented decision by the business to live with a risk rather than fix it.", "We'll take that chance, on paper.");
C("c2.3", "report", "Compensating control", "An alternative safeguard when the ideal fix isn't possible (e.g. segment a system that can't be patched).", "Can't fix it? Wall it off.");
C("p1.3 c4.1", "report", "False positive", "A scanner or tool reports a vuln that isn't actually there. Testers must validate before reporting.", "The alarm that cried wolf.");
C("c1.3", "report", "False negative", "A real vuln the tool missed. The more dangerous error, because nobody knows it's there.", "The silent miss.");
C("p1.3", "report", "Re-test / validation", "After the client fixes findings, the tester confirms the fixes actually work.", "Trust, then verify the fix.");
C("c4.1", "report", "SLA (remediation)", "Service Level Agreement: the agreed time to fix findings by severity (e.g. critical in 7 days).", "The fix-it clock.");

// ====================================================================
//  RECONNAISSANCE & ENUMERATION
// ====================================================================
C("p2.1 h1.1", "recon", "Passive reconnaissance", "Gathering info without interacting with the target directly (public records, search engines, social media). Low risk of detection.", "Look, don't touch.");
C("p2.2 h2.1", "recon", "Active reconnaissance", "Directly probing the target (scanning, banner grabbing). More data, but detectable.", "Knock on the doors.");
C("p2.1 h1.1", "recon", "OSINT", "Open-Source Intelligence: info from publicly available sources. The backbone of passive recon.", "Hiding in plain sight.");
C("p2.1 h1.1", "recon", "Google dorking", "Using advanced search operators (site:, filetype:, intitle:) to find exposed files and pages.", "The search bar as a scalpel.");
C("p2.1", "recon", "Shodan", "A search engine for internet-connected devices. Finds exposed servers, cameras, and ICS by banner.", "Google for devices, not web pages.");
C("p2.1 h1.1", "recon", "WHOIS", "Looks up domain registration: owner, contacts, name servers, dates.", "Who owns this domain?");
C("p2.1 h1.1", "recon", "DNS enumeration", "Mapping a target's DNS records (A, MX, NS, TXT) to find hosts and mail servers.", "The target's address book.");
C("p2.1", "recon", "theHarvester", "OSINT tool that collects emails, subdomains, and hosts from public sources.", "Reaps emails and subdomains.");
C("p2.1", "recon", "Maltego", "Visual OSINT tool that maps relationships between people, domains, and infrastructure.", "Connect-the-dots for intel.");
C("p2.1", "recon", "Subdomain enumeration", "Finding a domain's subdomains (dev., vpn., mail.) to widen the attack surface.", "Every subdomain is another door.");
C("p2.2 h2.1", "scan", "Nmap", "The standard network scanner: host discovery, port scanning, service/version and OS detection, and scripting.", "The pentester's first tool out of the bag.");
C("p2.2", "scan", "nmap -sS", "SYN (half-open) scan. Fast and relatively stealthy; sends SYN, never completes the handshake.", "Half a handshake.");
C("p2.2", "scan", "nmap -sT", "TCP connect scan. Completes the full handshake; used when raw sockets aren't available.", "The full, noisy handshake.");
C("p2.2", "scan", "nmap -sU", "UDP scan. Slower and trickier, but finds DNS, SNMP, DHCP, and other UDP services.", "Don't forget UDP.");
C("p2.2", "scan", "nmap -sV", "Service/version detection. Identifies what software and version is behind each open port.", "Not just open, but what's running.");
C("p2.2", "scan", "nmap -O", "OS detection via TCP/IP stack fingerprinting.", "Guess the operating system.");
C("p2.2", "scan", "nmap -A", "Aggressive scan: version, OS, scripts, and traceroute in one. Loud but thorough.", "Everything at once.");
C("p2.2", "scan", "nmap -p-", "Scan all 65,535 ports instead of the default top 1,000.", "Leave no port unchecked.");
C("p2.2", "scan", "nmap -sn", "Ping sweep / host discovery only, no port scan. Finds live hosts on a subnet.", "Who's alive out there?");
C("p2.2", "scan", "nmap -Pn", "Skip host discovery; treat all hosts as up. Use when targets block pings.", "Assume it's there and scan anyway.");
C("p2.2", "scan", "nmap -T0 to -T5", "Timing templates. T0 is paranoid/slow (evasion), T4 is aggressive/fast, T5 is insane.", "The speed vs. stealth dial.");
C("p2.2 h2.1", "scan", "NSE", "Nmap Scripting Engine. Lua scripts for discovery, version detection, and even safe exploits (--script).", "Nmap with superpowers.");
C("p2.2", "scan", "Masscan", "An internet-scale port scanner, far faster than Nmap for huge ranges.", "Nmap's speed-demon cousin.");
C("p2.2 h2.1", "scan", "Banner grabbing", "Reading the text a service returns on connect to identify software and version.", "Ask the service to introduce itself.");
C("p2.2", "scan", "Ping sweep", "Sending ICMP echo requests across a range to find live hosts.", "Roll call for the subnet.");
C("p2.3 h2.2", "enum", "Enumeration", "Actively pulling detailed info (users, shares, versions) from identified services.", "Squeeze the services for detail.");
C("p2.3 h2.2", "enum", "SMB enumeration", "Probing Windows file sharing (port 445) for shares, users, and the domain, e.g. with enum4linux or smbclient.", "Windows loves to overshare.");
C("p2.3 h2.2", "enum", "SNMP enumeration", "Querying SNMP (UDP 161) with community strings like 'public' to pull device config and users.", "'public' is a password people forget.");
C("p2.3", "enum", "LDAP enumeration", "Querying directory services (port 389/636) to map users, groups, and the AD structure.", "The directory, read aloud.");
C("p2.3", "enum", "Null session", "An unauthenticated SMB/RPC connection that legacy Windows allowed, leaking users and shares.", "Logging in as nobody.");
C("p2.3 h2.2", "enum", "DNS zone transfer (AXFR)", "A misconfigured DNS server handing over its entire zone file, exposing every host.", "The whole map, for free.");
C("p2.3", "enum", "Gobuster / ffuf / dirb", "Directory and file brute-forcers that find hidden web paths (/admin, /backup) via wordlists.", "Guessing URLs at machine speed.");
C("p2.3", "enum", "Wordlist (SecLists)", "Curated lists of common names, passwords, and paths used for brute-forcing and fuzzing.", "The community's cheat sheet of guesses.");

// ====================================================================
//  VULNERABILITY DISCOVERY & ANALYSIS
// ====================================================================
C("p3.1 c2.1", "vuln", "Vulnerability scanner", "Automated tool that checks systems against a database of known flaws (Nessus, OpenVAS, Qualys).", "The automated weakness-finder.");
C("p3.1 c2.1", "vuln", "Nessus", "A widely used commercial vulnerability scanner with a large plugin/signature library.", "The industry-standard scanner.");
C("p3.1 c2.1", "vuln", "OpenVAS / Greenbone", "A free, open-source vulnerability scanner.", "The open-source Nessus.");
C("p3.1 c2.1", "vuln", "Credentialed scan", "A scan run with valid login creds for deeper, more accurate results and fewer false positives.", "Scan with the keys in hand.");
C("p3.1 c2.1", "vuln", "Non-credentialed scan", "A scan from an outsider's view, with no login. Shows what an unauthenticated attacker sees.", "Scan from the street.");
C("p3.1 c2.1", "vuln", "Agent-based scan", "A scanner agent installed on the host reports in, good for mobile or offline systems.", "The scanner lives on the machine.");
C("c2.1", "vuln", "Scan scheduling / windows", "Running scans at approved times to avoid disrupting production systems.", "Scan at 2 a.m., not at noon.");
C("p3.2 c2.2", "vuln", "Vulnerability validation", "Confirming a scanner's finding is real before reporting it, by manual testing.", "Prove the scanner right.");
C("p3.2 c2.2", "vuln", "Prioritization", "Ranking findings by severity, exploitability, and asset value so the worst get fixed first.", "Fix the fires, not the sparks.");
C("c1.2", "vuln", "Threat intelligence", "Data on current attackers, their TTPs, and indicators, used to focus defense and testing.", "Know thy enemy.");
C("c1.2", "vuln", "IOC", "Indicator of Compromise: forensic evidence of an intrusion (bad IP, file hash, domain).", "The attacker's fingerprints.");
C("c1.2", "vuln", "TTP", "Tactics, Techniques, and Procedures: how a specific adversary operates. Harder to change than IOCs.", "The attacker's habits.");
C("c2.2 p3.2", "vuln", "EPSS", "Exploit Prediction Scoring System: estimates the probability a vuln will be exploited in the wild.", "How likely is anyone to actually use it?");
C("c2.2 p3.2", "vuln", "CISA KEV", "CISA's Known Exploited Vulnerabilities catalog: flaws confirmed exploited in the real world. Patch these first.", "The 'being exploited right now' list.");
C("p3.2", "vuln", "Exploit-DB / searchsploit", "A database of public exploits; searchsploit queries it offline from Kali.", "Pre-written exploits on the shelf.");
C("c2.4", "vuln", "Attack surface", "The sum of all points where an attacker could try to get in or pull data out.", "Every door and window counts.");
C("c2.4", "vuln", "Threat modeling", "Systematically imagining how a system could be attacked, early in design (e.g. STRIDE).", "War-game the design.");

// ====================================================================
//  OWASP TOP 10 (2021)  - how each is found and fixed
//  Each card's definition includes FIND and FIX so study covers both.
// ====================================================================
C("p4.2 c2.4 h4.1", "owasp", "A01 Broken Access Control", "Users act outside their permissions (viewing others' data, forced browsing to admin pages). FIND: change IDs/roles in requests, try restricted URLs. FIX: deny by default, enforce checks server-side.", "Can a normal user reach the admin page?");
C("p4.2 c2.4 h4.1", "owasp", "A02 Cryptographic Failures", "Sensitive data exposed by weak or missing encryption (plaintext, old TLS, weak hashes). FIND: check for HTTP, weak ciphers, unsalted hashes. FIX: TLS everywhere, strong modern algorithms, hash+salt passwords.", "Is the secret actually protected?");
C("p4.2 c2.4 h4.2", "owasp", "A03 Injection", "Untrusted input is run as a command (SQLi, OS command, LDAP). FIND: inject metacharacters and payloads. FIX: parameterized queries, input validation, least privilege.", "Data treated as code.");
C("p4.2 c2.4 h4.1", "owasp", "A04 Insecure Design", "Flaws baked into the architecture itself, not a coding bug. FIND: threat modeling, abuse-case review. FIX: secure design patterns, threat modeling early.", "You can't patch a bad blueprint.");
C("p4.2 c2.4 h4.1", "owasp", "A05 Security Misconfiguration", "Default creds, verbose errors, open cloud buckets, unnecessary features. FIND: check defaults, headers, error messages. FIX: hardening baselines, least functionality.", "Built right, left unlocked.");
C("p4.2 c2.4 h4.1", "owasp", "A06 Vulnerable & Outdated Components", "Using libraries or software with known CVEs. FIND: inventory versions, check against CVE/KEV. FIX: patch, track a software bill of materials (SBOM).", "Your weakest dependency is your weakness.");
C("p4.2 c2.4 h4.1", "owasp", "A07 Identification & Authentication Failures", "Weak login: credential stuffing, no MFA, weak session handling. FIND: test lockouts, session tokens, password policy. FIX: MFA, strong session management, rate limiting.", "Prove you are who you say.");
C("p4.2 c2.4 h4.1", "owasp", "A08 Software & Data Integrity Failures", "Trusting unverified updates, plugins, or CI/CD pipelines (supply chain). FIND: check for unsigned updates, insecure deserialization. FIX: verify signatures, secure the pipeline.", "Trust, but verify the source.");
C("p4.2 c1.3 h4.1", "owasp", "A09 Security Logging & Monitoring Failures", "Attacks go unnoticed because nothing is logged or watched. FIND: check if actions are logged and alerted. FIX: log security events, centralize, alert, and review.", "If no one's watching, no one knows.");
C("p4.2 c2.4 h5.2", "owasp", "A10 Server-Side Request Forgery (SSRF)", "Tricking a server into making requests on the attacker's behalf, often to internal services or cloud metadata. FIND: supply internal URLs to server-side fetches. FIX: allow-list destinations, block internal ranges.", "Make the server fetch what you can't reach.");

// ====================================================================
//  WEB APPLICATION ATTACKS  (posting names SQLi, XSS, CSRF)
// ====================================================================
C("p4.2 c1.3 h4.2", "web", "SQL injection (SQLi)", "Injecting SQL through input to read, alter, or bypass the database. FIND: ' OR 1=1--, error messages. FIX: parameterized queries / prepared statements.", "The classic: ' OR 1=1--");
C("p4.2 h4.2", "web", "Union-based SQLi", "Uses UNION SELECT to append attacker-chosen data to query results.", "Bolt your query onto theirs.");
C("p4.2 h4.2", "web", "Blind SQLi", "No visible output; infer data from true/false responses or time delays.", "Read the database in the dark.");
C("p4.2", "web", "sqlmap", "Automated SQL injection and database takeover tool.", "SQLi on autopilot.");
C("p4.2 c1.3 h4.1", "web", "Cross-Site Scripting (XSS)", "Injecting script that runs in another user's browser. FIND: inject <script> or event handlers into inputs. FIX: output encoding, Content Security Policy.", "Your script, their browser.");
C("p4.2 h4.1", "web", "Stored XSS", "The malicious script is saved on the server (e.g. a comment) and hits every viewer. The most dangerous XSS.", "Set the trap once, catch everyone.");
C("p4.2 h4.1", "web", "Reflected XSS", "The script is bounced off the server from a crafted link; only the victim who clicks is hit.", "Bounced back off a bad link.");
C("p4.2 h4.1", "web", "DOM-based XSS", "The flaw is entirely in client-side JavaScript handling input unsafely.", "The browser attacks itself.");
C("p4.2 c2.4 h4.1", "web", "Cross-Site Request Forgery (CSRF)", "Tricking a logged-in user's browser into sending an unwanted action. FIND: check for missing anti-CSRF tokens. FIX: CSRF tokens, SameSite cookies.", "Your session, their command.");
C("p4.2 h4.1", "web", "Insecure Direct Object Reference (IDOR)", "Changing an ID in a request to access another user's object (?id=123 -> 124). A form of broken access control.", "Just change the number.");
C("p4.2 h4.1", "web", "Directory traversal", "Using ../ sequences to read files outside the web root (/etc/passwd).", "Climb out of the web folder.");
C("p4.2 h4.1", "web", "File upload vulnerability", "Uploading a malicious file (e.g. a web shell) that the server executes.", "Upload a shell, get a shell.");
C("p4.2 h4.1", "web", "Command injection", "Injecting OS commands through an app that passes input to a shell.", "Make the server run your command.");
C("p4.2 h4.1", "web", "XXE (XML External Entity)", "Abusing XML parsers to read local files or reach internal systems.", "XML that reaches too far.");
C("p4.2 h4.1", "web", "Session hijacking", "Stealing or guessing a session token to impersonate a logged-in user.", "Steal the wristband, skip the line.");
C("p4.2 c1.3", "web", "API abuse / BOLA", "Broken Object Level Authorization: APIs that don't check if you own the object you request. The API version of IDOR.", "APIs forget to check ownership.");

// ====================================================================
//  WEB TOOLING
// ====================================================================
C("p4.2 h4.1", "webtool", "Burp Suite", "The standard web app testing proxy: intercept, modify, and replay HTTP. Core tool for web pentests.", "Sit between browser and server.");
C("p4.2", "webtool", "Burp Proxy", "Intercepts browser traffic so you can read and edit requests before they're sent.", "Pause and edit the request.");
C("p4.2", "webtool", "Burp Repeater", "Manually tweak and resend a single request over and over to test behavior.", "Poke the same request a hundred ways.");
C("p4.2", "webtool", "Burp Intruder", "Automates sending many payloads into a request (fuzzing, brute-forcing fields).", "Spray payloads at one spot.");
C("p4.2", "webtool", "OWASP ZAP", "A free, open-source web app scanner and proxy, similar to Burp.", "The free web proxy.");
C("p4.2", "webtool", "Nikto", "A fast web server scanner for known bad files, outdated software, and misconfigurations.", "Quick-and-dirty web server check.");
C("p4.2", "webtool", "wpscan", "A scanner specialized for WordPress sites, themes, and plugins.", "WordPress weakness finder.");

// ====================================================================
//  NETWORK ATTACKS
// ====================================================================
C("p4.1 h3.2", "netatk", "On-path attack (MITM)", "Positioning between two parties to read or alter traffic. Formerly 'man-in-the-middle'.", "Sit in the middle, read it all.");
C("p4.1 h3.2", "netatk", "ARP poisoning / spoofing", "Faking ARP replies on a LAN to redirect traffic through the attacker. Enables on-path attacks.", "Lie about who owns the IP.");
C("p4.1", "netatk", "DNS poisoning / spoofing", "Corrupting DNS answers to send victims to attacker-controlled hosts.", "Poison the address book.");
C("p4.1 h3.2", "netatk", "Packet sniffing", "Capturing network traffic to read unencrypted data or credentials.", "Eavesdrop on the wire.");
C("p4.1 h3.2", "netatk", "Wireshark", "The standard packet capture and analysis tool. Reads traffic down to the byte.", "A microscope for packets.");
C("p4.1", "netatk", "tcpdump", "Command-line packet capture, ideal over SSH and in scripts.", "Wireshark for the terminal.");
C("p4.1", "netatk", "Responder", "Poisons LLMNR/NBT-NS/mDNS on Windows networks to capture credential hashes.", "Answer 'me!' and catch the hash.");
C("p4.1 h3.1", "netatk", "Pass-the-Hash", "Authenticating with a captured NTLM hash instead of the plaintext password.", "The hash is as good as the password.");
C("p4.1 h3.1", "netatk", "Kerberoasting", "Requesting service tickets in Active Directory and cracking them offline for service account passwords.", "Crack AD service passwords offline.");
C("p4.1", "netatk", "SMB relay", "Relaying captured authentication to another host to gain access without cracking anything.", "Forward the login to a new door.");
C("p4.1 h3.2", "netatk", "Denial of Service (DoS)", "Overwhelming a service so legitimate users can't reach it. Usually out of scope unless explicitly authorized.", "Flood it until it drowns.");
C("p4.4 h5.1", "netatk", "Evil twin", "A rogue Wi-Fi access point mimicking a legitimate one to capture traffic or creds.", "A fake hotspot with a familiar name.");
C("p4.4 h5.1", "netatk", "Deauth attack", "Forcing Wi-Fi clients to disconnect, often to capture the reconnection handshake.", "Kick them off to catch them logging back on.");
C("p4.4 h5.1", "netatk", "WPA handshake capture", "Grabbing the 4-way handshake to crack the Wi-Fi password offline (aircrack-ng).", "Catch the handshake, crack the key.");

// ====================================================================
//  EXPLOITATION & HOST ATTACKS
// ====================================================================
C("p4.3 h3.1", "exploit", "Metasploit Framework", "The standard exploitation framework: a huge library of exploits, payloads, and post modules.", "The exploitation Swiss Army knife.");
C("p4.3", "exploit", "msfconsole", "The main command-line interface to Metasploit.", "Metasploit's cockpit.");
C("p4.3", "exploit", "Exploit vs. payload", "The exploit opens the door (the vulnerability); the payload is what runs once you're in (e.g. a shell).", "Exploit gets you in, payload does the work.");
C("p4.3 h3.1", "exploit", "Meterpreter", "Metasploit's advanced in-memory payload for post-exploitation (file access, pivoting, screenshots).", "A toolkit that lives in memory.");
C("p4.3 h3.1", "exploit", "Reverse shell", "The target connects back to the attacker, bypassing inbound firewall rules. The usual choice.", "Have the target call you.");
C("p4.3", "exploit", "Bind shell", "The target opens a listening port for the attacker to connect to. Blocked by most firewalls.", "Wait for the attacker to knock.");
C("p4.3", "exploit", "msfvenom", "Metasploit's standalone payload generator (e.g. build a reverse-shell executable).", "The payload factory.");
C("p4.3 h3.1", "exploit", "Privilege escalation", "Going from a low-privileged account to admin/root. Core post-exploitation goal.", "From user to root.");
C("p4.3", "exploit", "Vertical vs. horizontal privesc", "Vertical: gain higher privileges. Horizontal: access another account at the same level.", "Climb up, or step sideways.");
C("p4.3", "exploit", "LinPEAS / WinPEAS", "Scripts that enumerate a host for privilege-escalation paths on Linux/Windows.", "Find the path to root for you.");
C("p4.3", "exploit", "Local exploit (kernel)", "Exploiting a flaw in the OS kernel or local service to escalate privileges.", "Exploit the machine from inside.");
C("p4.3 h3.1", "exploit", "Password cracking", "Recovering passwords from hashes offline (John the Ripper, Hashcat).", "Turn the hash back into a word.");
C("p4.3", "exploit", "John the Ripper", "A classic, flexible offline password-cracking tool.", "The old reliable cracker.");
C("p4.3", "exploit", "Hashcat", "A GPU-accelerated password cracker, very fast on modern hardware.", "Cracking at GPU speed.");
C("p4.3 h3.1", "exploit", "Credential stuffing", "Reusing breached username/password pairs against other sites, betting on reuse.", "People reuse passwords. Attackers count on it.");
C("p4.3", "exploit", "Password spraying", "Trying one common password against many accounts to avoid lockout.", "One password, every door.");

// ====================================================================
//  POST-EXPLOITATION & LATERAL MOVEMENT
// ====================================================================
C("p5.1 h3.1", "postex", "Post-exploitation", "Everything after initial access: escalate, gather data, pivot, and measure real impact.", "You're in. Now what's it worth?");
C("p5.1", "postex", "Lateral movement", "Moving from one compromised host to others to reach the real target.", "Hop from box to box.");
C("p5.1", "postex", "Pivoting", "Using a compromised host as a relay to reach networks you can't touch directly.", "Tunnel through the beachhead.");
C("p5.1 h3.1", "postex", "Persistence", "Maintaining access across reboots (scheduled tasks, services, keys). In a test, documented and removed after.", "A way back in.");
C("p5.1", "postex", "Privilege escalation to Domain Admin", "The AD endgame: controlling the domain controller controls everything.", "Own the DC, own the domain.");
C("p5.1", "postex", "Golden ticket", "Forging Kerberos tickets with the KRBTGT hash for near-unlimited AD access.", "A master key to Active Directory.");
C("p5.1 h3.1", "postex", "Data exfiltration (simulated)", "Demonstrating that sensitive data could be stolen, to prove impact. Done carefully and within scope.", "Prove the data could walk.");
C("p5.1", "postex", "BloodHound", "Maps Active Directory attack paths visually, revealing routes to Domain Admin.", "The map to Domain Admin.");
C("p5.1", "postex", "Mimikatz", "Extracts plaintext passwords, hashes, and Kerberos tickets from Windows memory.", "Reads secrets out of memory.");
C("p5.2", "postex", "Covering tracks", "In a real attack, deleting logs; in a sanctioned test, documenting actions and restoring state instead.", "Red teams emulate it; honest testers log it.");
C("p5.2", "postex", "Cleanup / restoration", "Removing tools, accounts, and changes made during testing so the environment is left as found.", "Leave it like you found it.");
C("p5.1 h3.2", "postex", "C2 (Command and Control)", "The channel an attacker uses to control compromised hosts (e.g. Cobalt Strike, Sliver).", "The remote control.");

// ====================================================================
//  CLOUD ATTACKS  (posting names cloud environments)
// ====================================================================
C("p4.5 h5.2", "cloud", "Cloud shared responsibility", "The provider secures the cloud; the customer secures what they put in it. Most cloud breaches are the customer's side.", "They guard the building; you lock your unit.");
C("p4.5 h5.2", "cloud", "IAM misconfiguration", "Over-permissive cloud identities and roles, the most common cloud attack path.", "Too many keys to too many people.");
C("p4.5 h5.2", "cloud", "Instance metadata (IMDS) abuse", "Reaching 169.254.169.254 (often via SSRF) to steal a cloud VM's credentials. IMDSv2 mitigates it.", "The server's own keys, one request away.");
C("p4.5 h5.2", "cloud", "Public storage bucket", "Misconfigured S3/blob storage left world-readable, leaking data. A classic cloud finding.", "The open bucket.");
C("p4.5", "cloud", "Privilege escalation in cloud", "Chaining IAM permissions (e.g. iam:PassRole) to gain more access than intended.", "Permissions that add up to admin.");
C("p4.5", "cloud", "ScoutSuite", "Multi-cloud security auditing tool that reports misconfigurations across AWS, Azure, and GCP.", "Config auditor for the cloud.");
C("p4.5", "cloud", "Prowler", "An AWS security assessment tool checking against benchmarks like CIS.", "AWS checkup against best practice.");
C("p4.5", "cloud", "Pacu", "An AWS exploitation framework, the cloud counterpart to Metasploit.", "Metasploit for AWS.");
C("p4.5", "cloud", "CloudGoat", "A deliberately vulnerable AWS environment for safe, legal cloud-attack practice.", "A legal cloud playground.");
C("p4.5", "cloud", "AWS testing policy", "AWS permits testing many services without prior approval, but bans others (e.g. DoS). Always read the current policy first.", "Know the provider's rules before you touch.");

// ====================================================================
//  SOCIAL ENGINEERING & PHYSICAL
// ====================================================================
C("p4.4 h3.3", "social", "Social engineering", "Manipulating people, rather than systems, to gain access or information. Often the easiest way in.", "Hack the human.");
C("p4.4 h3.3", "social", "Phishing", "Fraudulent email luring victims to reveal creds or run malware.", "Bait in the inbox.");
C("p4.4 h3.3", "social", "Spear phishing", "A phishing attack tailored to a specific person or role. Higher success rate.", "A phish with your name on it.");
C("p4.4 h3.3", "social", "Pretexting", "Inventing a believable scenario (e.g. posing as IT) to extract information.", "A convincing cover story.");
C("p4.4 h3.3", "social", "Tailgating / piggybacking", "Following an authorized person through a secure door.", "In on someone else's badge.");
C("p4.4", "social", "GoPhish / SET", "Tools for running phishing campaigns and social-engineering tests (GoPhish; Social-Engineer Toolkit).", "Phishing campaigns, managed.");
C("p4.4", "social", "Dumpster diving", "Recovering sensitive info from discarded trash.", "Treasure in the trash.");
C("p4.4", "social", "USB drop", "Leaving malware-laden USB drives for curious staff to plug in.", "Curiosity plugs in the malware.");

// ====================================================================
//  SCRIPTING & AUTOMATION  (posting names bash/python/powershell/js)
// ====================================================================
C("p5.1", "script", "Why red cells script", "Automation handles repetitive tasks (scanning, parsing, reporting) and builds custom tooling the job explicitly asks for.", "Automate the boring, build the custom.");
C("p5.1", "script", "Python for pentesting", "The dominant language for security tooling: sockets, requests, parsing, and most public exploits.", "The pentester's go-to language.");
C("p5.1", "script", "Bash scripting", "Glue for Linux/Kali: chaining tools, looping over targets, parsing output.", "Duct tape for the command line.");
C("p5.1", "script", "PowerShell for offense", "The language of Windows and Active Directory attacks; lives on every modern Windows host.", "The attacker's native Windows tongue.");
C("p5.1", "script", "JavaScript in attacks", "Powers XSS payloads and client-side attacks; also useful for understanding web apps.", "The browser's own language, turned.");
C("p5.1", "script", "Living off the land (LOLBins)", "Using built-in, trusted system tools (PowerShell, certutil, wmic) to avoid dropping detectable malware.", "Use the tools already there.");
C("p5.1", "script", "cron / scheduled tasks", "OS schedulers used to automate scripts, and sometimes abused for persistence.", "Set it and forget it, for good or ill.");

// ====================================================================
//  COVERAGE FILL - CySA+ and CEH objectives not yet represented
// ====================================================================
// CySA+ 1.1 System & network concepts
C("c1.1", "defense", "Baseline / normal behavior", "Knowing a system's normal activity so anomalies stand out. You can't spot 'weird' without knowing 'normal'.", "Learn normal to catch abnormal.");
C("c1.1", "defense", "Log aggregation", "Centralizing logs from many sources (hosts, network, cloud) so events can be correlated in one place.", "All the logs, one haystack.");
C("c1.1", "defense", "Network telemetry (flow data)", "Metadata about connections (NetFlow: who talked to whom, when, how much) used to spot odd traffic.", "The call records of the network.");
// CySA+ 1.4 Tools & techniques
C("c1.4", "defense", "SIEM", "Security Information and Event Management: collects, correlates, and alerts on log data across the enterprise.", "The analyst's command center.");
C("c1.4", "defense", "EDR", "Endpoint Detection and Response: monitors hosts for malicious behavior and enables investigation and containment.", "A watchdog on every endpoint.");
C("c1.4", "defense", "Packet analyzer (defensive)", "Tools like Wireshark used by defenders to inspect suspicious traffic in detail.", "Read the packets to read the attack.");
C("c1.4", "defense", "SOAR", "Security Orchestration, Automation, and Response: automates repetitive response playbooks.", "Automate the response, not just the alert.");
// CySA+ 3.2 Detection & analysis
C("c3.2", "ir", "Triage", "Quickly assessing an alert's severity and scope to decide what deserves attention first.", "First responder's sort.");
C("c3.2", "ir", "Scoping an incident", "Determining how far an intrusion reached: which hosts, accounts, and data are affected.", "How big is the fire?");
C("c3.2", "ir", "Chain of custody", "Documenting who handled evidence and when, so it stays admissible and trustworthy.", "Track the evidence's every hand.");
C("c3.2", "ir", "Order of volatility", "Collect the most fleeting evidence first (memory, then disk, then backups) before it's lost.", "Grab what vanishes fastest, first.");
// CySA+ 4.2 Incident reporting
C("c4.2", "report", "Root cause analysis", "Finding why an incident happened, not just what, so the same gap can be closed for good.", "Fix the cause, not just the symptom.");
C("c4.2", "report", "Lessons learned", "The post-incident review that turns an incident into improvements to people, process, and tech.", "Every incident should teach something.");
C("c4.2", "report", "Escalation path", "The predefined chain of who to notify, and when, as an incident grows in severity.", "Know who to call before you need to.");
// CEH 1.2 Recon countermeasures
C("h1.2", "defense", "Footprinting countermeasures", "Steps defenders take to limit OSINT exposure: scrub metadata, limit public info, lock down DNS.", "Give the attacker less to find.");
C("h1.2", "defense", "Data minimization (public)", "Publishing only what's necessary so attackers gather less from public sources.", "Less out there, less to exploit.");
// CEH 5.3 Cryptography
C("h5.3", "crypto", "Symmetric vs. asymmetric", "Symmetric uses one shared key (fast, e.g. AES); asymmetric uses a public/private key pair (e.g. RSA).", "One key shared, or a matched pair.");
C("h5.3", "crypto", "Hashing", "A one-way function producing a fixed fingerprint of data (e.g. SHA-256). Used for integrity, not secrecy.", "Fingerprint, not a lockbox.");
C("h5.3", "crypto", "Salting", "Adding random data to each password before hashing so identical passwords don't share a hash.", "A pinch of random per password.");
C("h5.3", "crypto", "PKI", "Public Key Infrastructure: certificates and authorities that bind public keys to identities for trust.", "The web of digital IDs.");
C("h5.3", "crypto", "Encryption at rest vs. in transit", "At rest protects stored data; in transit protects data moving over a network (TLS).", "Guard it sitting still and on the move.");
C("h5.3", "crypto", "Crypto attacks", "Attacks on weak crypto: brute force, rainbow tables (precomputed hashes), and downgrade attacks.", "Weak crypto invites these.");

// Two more questions on the filled areas
function Q2(tg,q,c,a,e){ PACK.mcq.push({x:tags(tg),q,c,a,e}); }
Q2("c1.4","Which platform collects and correlates logs from across the enterprise and raises alerts for analysts?",
  ["EDR","SIEM","A vulnerability scanner","A firewall"],1,
  "A SIEM aggregates and correlates log data and generates alerts. EDR focuses on endpoints specifically.");
Q2("c3.2","When collecting digital evidence, which should you capture first?",
  ["Backup tapes","Data on disk","Volatile memory (RAM)","Printed reports"],2,
  "Order of volatility: the most fleeting evidence (memory) is collected first, before it's lost to a reboot or power-off.");
Q2("h5.3","Adding random data to each password before hashing, so identical passwords produce different hashes, is called:",
  ["Encryption","Salting","Encoding","Tokenization"],1,
  "Salting defeats precomputed rainbow-table attacks by making each stored hash unique.");

// ====================================================================
//  EXAM-STYLE QUESTIONS  (scenario-driven, like the real exams)
// ====================================================================
function Q(tg, q, c, a, e) { PACK.mcq.push({ x: tags(tg), q, c, a, e }); }

// --- Engagement, scope, methodology ---
Q("p1.1 h1.1", "During a test you discover a server that is clearly the client's but is not listed in the scope document. What is the correct action?",
  ["Test it, since it belongs to the client", "Stop and get written authorization before touching it", "Ignore it and note nothing", "Exploit it quietly to check, then decide"],
  1, "Only systems in the signed scope may be tested. Out-of-scope systems require formal written authorization first, even if client-owned.");
Q("p1.2 h1.1", "What are the four phases of NIST SP 800-115, in order?",
  ["Recon, Scan, Exploit, Report", "Planning, Discovery, Attack, Reporting", "Pre-engagement, Exploitation, Pivot, Cleanup", "Scope, Test, Patch, Verify"],
  1, "NIST SP 800-115 defines Planning, Discovery, Attack, and Reporting, with Reporting running throughout.");
Q("p1.2", "In PTES, which phase comes immediately before Exploitation?",
  ["Pre-engagement", "Threat Modeling", "Vulnerability Analysis", "Reporting"],
  2, "PTES order: Pre-engagement, Intelligence Gathering, Threat Modeling, Vulnerability Analysis, Exploitation, Post-Exploitation, Reporting.");
Q("p1.1", "A client wants to see how their detection and response team performs against a realistic, stealthy adversary. What type of engagement fits best?",
  ["A vulnerability scan", "A standard penetration test", "A red team engagement", "A compliance audit"],
  2, "Red team engagements emulate a real adversary to test detection and response, favoring stealth over coverage.");
Q("p1.1 h1.1", "Which document gives the tester legal cover to perform the assessment?",
  ["The CVSS score sheet", "The signed authorization / permission-to-test", "The Nmap output", "The OWASP Top 10"],
  1, "Signed authorization from the system owner is what separates a legal pentest from unauthorized access.");

// --- Recon & scanning ---
Q("p2.1 h1.1", "You gather target information using only public records and search engines, never contacting the target's systems. This is:",
  ["Active reconnaissance", "Passive reconnaissance", "Exploitation", "Enumeration"],
  1, "Passive recon avoids direct interaction with the target, lowering detection risk. Active recon probes the target directly.");
Q("p2.2 h2.1", "Which Nmap flag performs service and version detection?",
  ["-sS", "-sn", "-sV", "-Pn"],
  2, "-sV probes open ports to identify the service and version. -sS is a SYN scan; -sn is host discovery; -Pn skips discovery.");
Q("p2.2", "A target is blocking ICMP, so Nmap reports all hosts as down. Which flag lets you scan anyway?",
  ["-A", "-Pn", "-O", "-sU"],
  1, "-Pn skips host discovery and treats hosts as up, useful when pings are blocked.");
Q("p2.2 h2.1", "You need to scan all 65,535 TCP ports, not just the common ones. Which flag?",
  ["-F", "-p-", "-top-ports 100", "-sU"],
  1, "-p- scans every TCP port. -F is a fast scan of fewer ports.");
Q("p2.3 h2.2", "A misconfigured DNS server lets you request its entire zone file. This attack is called:",
  ["DNS tunneling", "A zone transfer (AXFR)", "DNS poisoning", "A null session"],
  1, "An unrestricted DNS zone transfer (AXFR) hands over every record, exposing the internal host map.");

// --- Vulnerability management ---
Q("p3.1 c2.1", "Compared with a non-credentialed scan, a credentialed vulnerability scan generally provides:",
  ["Less accurate results", "More accurate results with fewer false positives", "Only external findings", "No difference"],
  1, "Logging in lets the scanner inspect installed software and config directly, improving accuracy and reducing false positives.");
Q("c2.2", "Which resource tells you a vulnerability is actively being exploited in the wild right now?",
  ["The CWE list", "The CISA KEV catalog", "The CVSS base score", "The OWASP Top 10"],
  1, "CISA's Known Exploited Vulnerabilities catalog lists flaws confirmed exploited in the wild; prioritize patching these.");
Q("c2.2 p3.2", "A scanner reports a critical SQL injection vulnerability. Before putting it in the report, you should:",
  ["Report it immediately as critical", "Validate it manually to rule out a false positive", "Raise its CVSS score", "Delete the finding"],
  1, "Testers validate scanner findings manually; scanners produce false positives, and reporting one damages credibility.");
Q("c2.2", "CVE-2021-44228 identifies a specific flaw, while CWE-79 identifies a category of flaw. CWE-79 is:",
  ["A specific product bug", "The category 'Cross-Site Scripting'", "A CVSS metric", "An exploit"],
  1, "CWE is a weakness category (CWE-79 = XSS); CVE is a specific instance of a flaw in a product.");

// --- Web attacks (SQLi, XSS, CSRF named in posting) ---
Q("p4.2 h4.2", "Entering ' OR 1=1-- into a login field logs you in without valid credentials. This is:",
  ["Cross-site scripting", "SQL injection", "CSRF", "Directory traversal"],
  1, "The injected SQL makes the WHERE clause always true. Parameterized queries prevent it.");
Q("p4.2 h4.1", "An attacker stores <script> in a forum post so it runs in every visitor's browser. This is:",
  ["Reflected XSS", "Stored XSS", "DOM-based XSS", "CSRF"],
  1, "Stored (persistent) XSS is saved server-side and executes for every viewer, making it the most impactful XSS type.");
Q("p4.2 c2.4 h4.1", "The best primary defense against SQL injection is:",
  ["Hiding error messages", "Parameterized queries / prepared statements", "A web application firewall", "Renaming the database"],
  1, "Parameterized queries separate code from data so input can't change the query. A WAF is a secondary layer.");
Q("p4.2 h4.1", "A logged-in user clicks a malicious link that silently submits a money transfer on a trusted banking site. The site lacked anti-CSRF tokens. This attack is:",
  ["XSS", "CSRF", "SSRF", "SQLi"],
  1, "CSRF abuses the victim's existing authenticated session. Anti-CSRF tokens and SameSite cookies prevent it.");
Q("p4.2 c2.4 h5.2", "An application fetches a URL you supply, and you point it at 169.254.169.254 to read cloud credentials. This is:",

function startQuiz(title, items, opts) {

  items.forEach(it => {
    if (opts.learn !== false && it.kind === "card" && !S.items[it.id]) { list.push({ learn: true, item: it }); pending.push({ q: makeQ(it), at: list.length + 3 }); }
    else list.push(makeQ(it));
    for (let k = pending.length - 1; k >= 0; k--) if (pending[k].at <= list.length) { list.push(pending[k].q); pending.splice(k, 1); }
  });
  pending.forEach(p => list.push(p.q));
  ACT = { type: "quiz", title, list, i: 0, answered: false, correct: 0, graded: 0, missed: [], requeued: new Set(), xp0: S.xp };
  window.scrollTo(0, 0); render();
}

    const cd = shuffle(CARDS.filter(i => oOf(i, tr) && dom(oOf(i, tr)) === d.n));

  });

  const list = shuffle(qs).slice(0, n).map(it => makeQ(it, it.kind === "card" ? Math.random() < 0.7 : null));
  ACT = { type: "exam", tr, n: list.length, list, ans: Array(list.length).fill(null), flag: Array(list.length).fill(false), i: 0, end: Date.now() + Math.round(list.length * (T(tr).minutes / T(tr).questions) * 60000), xp0: S.xp };

  const bars = T(a.tr).domains.map(d => { const v = byD[d.n] || [0, 0]; const r = v[1] ? v[0] / v[1] : 0; return `<div class="dbar d${d.n}"><span>${d.n}. ${esc(d.name)}</span><div class="bar"><i style="width:${r * 100}%"></i></div><b>${v[0]}/${v[1]}</b></div>`; }).join("");
  finish({ title: T(a.tr).short + " " + (scaled >= passAt ? "practice exam: passing range" : "practice exam: keep training"), score: right, of: a.n, xp: S.xp - a.xp0,
    note: `<b style="font-family:var(--head);font-size:22px">Approximate scaled score: ${scaled} / 1,000</b> (${passAt} passes). This is a straight-line estimate; the real exam uses scaled scoring across different exam forms.<div style="margin-top:12px">${bars}</div>`, missed, again: "exam", againArg: [a.n, a.tr] });
}

// ---------- events ----------
const AGAIN = { run: () => startRun(), blitz: x => startBlitz(x), match: x => startMatch(x), sort: x => startSort(x), order: x => startOrder(x), scen: x => startScen(x), log: x => startLog(x), drill: x => startDrill(x), lab: x => startLab(x), exam: x => startExam(x[0], x[1]) };
const ACTIONS = {
  nav: d => { ACT = null; VIEW = d.v; SUB.train = null; window.scrollTo(0, 0); render(); },
  welcomed: () => { S.welcomed = true; save(); render(); },
  dloffline: () => downloadOffline(),
  dlbackup: () => downloadBackup(),
  run: d => startRun(d.d),
  track: d => { let s = SEL().slice(); if (s.includes(d.t)) { if (s.length < 2) return toast("Keep at least one exam selected"); s = s.filter(t => t !== d.t); } else s.push(d.t); S.tracks = TRACKS.filter(t => s.includes(t)); save(); render(); },
  maptr: d => { SUB.map = d.t; render(); },
  room: d => { VIEW = "library"; SUB.lib = "obj"; ACT_OPEN = d.o; render(); const el = document.querySelector("details[open]"); if (el) el.scrollIntoView({ block: "start" }); },
  drill1: d => { const dt = DT(); const items = buildRun(i => oOf(i, dt) === d.o, 15, 15); startQuiz("Objective " + d.o + " drill", items); },
  mode: d => { SUB.train = d.m || null; window.scrollTo(0, 0); render(); },
  libtab: d => { SUB.lib = d.t; render(); },
  reset: () => { if (confirm("Erase all progress, XP, and history? This can't be undone.")) { const th = S.theme; S = blank(); S.theme = th; S.resetAt = Date.now(); save(); render(); toast("Progress reset"); } },
  quit: () => { if (ACT && ACT.type === "exam" && !confirm("Leave the exam? Your answers will be lost.")) return; clearInterval(examTimer); ACT = null; render(); },
  again: () => { const a = ACT; AGAIN[a.again](a.againArg); },
  qans: d => quizAnswer(+d.i), qnext: () => quizNext(),
  blitz: d => startBlitz(d.d), bans: d => blitzAnswer(+d.i),
  match: d => startMatch(+d.i), ml: d => { ACT.sel = d.id; render(); }, mr: d => matchRight(d.id),
  sort: d => startSort(+d.i), si: d => { ACT.sel = +d.i; render(); }, sb: d => sortBucket(+d.i),
  order: d => startOrder(+d.i), op: d => orderPick(d.v),
  scen: d => startScen(+d.i), sc: d => scenPick(+d.k), scnext: () => scenNext(),
  log: d => startLog(+d.i), lg: d => { const i = +d.i; ACT.flags.has(i) ? ACT.flags.delete(i) : ACT.flags.add(i); render(); }, logcheck: () => logCheck(), logdone: () => logDone(),
  lab: d => startLab(+d.i), labstep: d => labToggle("s", +d.i), labclean: d => labToggle("c", +d.i), copy: d => labCopy(+d.i),
  labquiz: () => { const l = ACT.l; startQuiz(l.title + ": quiz", ITEMS.filter(q => q.lab === l.id), { learn: false }); ACT.labIdx = PACK.labs.indexOf(l); },
  drill: d => startDrill(+d.i), dans: d => drillAnswer(+d.i), dnext: () => drillNext(),
  exam: d => startExam(+d.n, d.tr), eans: d => { ACT.ans[ACT.i] = +d.i; render(); }, eflag: () => { ACT.flag[ACT.i] = !ACT.flag[ACT.i]; render(); },
  emove: d => { ACT.i = Math.max(0, Math.min(ACT.n - 1, ACT.i + +d.d)); render(); }, ego: d => { ACT.i = +d.i; render(); },
  esubmit: () => { const un = ACT.ans.filter(x => x == null).length; if (un && !confirm(un + " question(s) unanswered. Submit anyway?")) return; submitExam(); }
};
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.tagName === "SELECT" || b.tagName === "INPUT") return;
  const f = ACTIONS[b.dataset.act]; if (f) { e.preventDefault(); f(b.dataset, b); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.act === "set") { const k = t.dataset.k; S[k] = k === "theme" ? t.value : +t.value; save(); render(); }
  if (t.dataset.act === "examdate") { S.examDate = t.value; save(); render(); }
  if (t.dataset.act === "importfile" && t.files && t.files[0]) { importBackup(t.files[0]); t.value = ""; }
});
document.addEventListener("keydown", e => {
  if (!ACT || ["INPUT","SELECT","BUTTON","SUMMARY"].includes(e.target.tagName) && (e.key === "Enter" || e.key === " ")) return;
  if (["INPUT","SELECT"].includes(e.target.tagName)) return;
  const n = parseInt(e.key, 10);
  const t = ACT.type;
  if (n >= 1 && n <= 6) {
    if (t === "quiz" && !ACT.list[ACT.i].learn && !ACT.answered && n <= ACT.list[ACT.i].options.length) return quizAnswer(n - 1);
    if (t === "blitz" && n <= ACT.q.options.length) return blitzAnswer(n - 1);
    if (t === "drill" && !ACT.answered && n <= 4) return drillAnswer(n - 1);
    if (t === "exam" && n <= ACT.list[ACT.i].options.length) { ACT.ans[ACT.i] = n - 1; return render(); }
    if (t === "scen" && !ACT.solved && n <= ACT.choices.length) return scenPick(ACT.choices[n - 1]);
  }
  if (e.key === "Enter" || e.key === " ") {
    if (t === "quiz" && (ACT.answered || ACT.list[ACT.i].learn)) { e.preventDefault(); return quizNext(); }
    if (t === "drill" && ACT.answered) { e.preventDefault(); return drillNext(); }
    if (t === "scen" && ACT.solved) { e.preventDefault(); return scenNext(); }
  }
});

render();
if (!HOSTED_EMBED && /^https?:$/.test(location.protocol) && "serviceWorker" in navigator && window.top === window) {
  fetch("manifest.webmanifest", { method: "HEAD" }).then(r => {
    if (!r.ok) return;
    const add = (rel, href) => { const l = document.createElement("link"); l.rel = rel; l.href = href; document.head.appendChild(l); };
    add("manifest", "manifest.webmanifest"); add("apple-touch-icon", "icon-192.png");
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }).catch(() => {});
}
window.__game = { ITEMS, S: () => S, PACK }; // for debugging
})();

</script>
