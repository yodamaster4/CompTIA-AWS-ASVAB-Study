LAB({ id: "l00", tags: "r1.2 c1.1", title: "Lab 0: Build a safe, isolated home lab", time: "60 min", cost: "Free (uses free hypervisor software)",
  goal: "Create a small virtual lab that is cut off from your home network and the internet, so you can practice safely and legally.",
  why: "Every skill in this app is practiced on systems you own. An isolated lab also teaches networking, snapshots, and documentation, which employers like to see.",
  steps: [
    ["Install a hypervisor", "Install VirtualBox or VMware Workstation Player on your computer. Check that virtualization is enabled in your BIOS if VMs will not start.", "You can create a new empty virtual machine."],
    ["Create an isolated network", "In the hypervisor, create a Host-only or Internal network with no route to your home network. Give it a subnet such as 10.10.10.0/24.", "VMs attached to it can reach each other but not your router."],
    ["Add an analyst VM", "Install a Linux distribution of your choice for your own analysis work. Attach it to the isolated network. Learn the terminal basics: ls, cd, cat, grep, ip addr, ss.", "'ip addr' shows an address in your lab subnet."],
    ["Add a target VM", "Install a second Linux VM as your 'server'. Put an SSH service and a simple web server on it. This is the machine you will inspect and harden.", "You can ping it from the analyst VM and open its web page."],
    ["Take snapshots", "Snapshot both VMs in their clean state. Before every experiment take a new snapshot, and restore after.", "The hypervisor lists a snapshot named 'clean'."],
    ["Start a lab notebook", "Create a folder or document where you record date, goal, commands run, and results for each lab. This becomes portfolio material.", "You have a first entry describing this lab."]
  ],
  cleanup: ["Shut the VMs down when not in use.", "Keep snapshots small; delete old ones you no longer need."],
  stuck: [["VMs cannot reach each other", "Check both are on the same internal network name and have addresses in the same subnet."], ["Virtualization will not start", "Enable VT-x/AMD-V in the BIOS and turn off conflicting features such as other hypervisors."]],
  quiz: [["Why should a practice lab be isolated from your home network?", ["It runs faster", "So intentionally vulnerable or experimental systems cannot affect real devices or others", "Because ISPs require it", "It makes snapshots smaller"], 1, "Isolation keeps experiments contained, safe, and legal."],
    ["What is the main benefit of snapshots in a lab?", ["They save disk space", "You can undo mistakes and restore a clean state", "They speed up the network", "They encrypt the VM"], 1, "Snapshots let you experiment freely and roll back."]] });

LAB({ id: "l01", tags: "r3.1 c4.1", title: "Lab 1: Read your own network traffic", time: "45 min", cost: "Free",

    const extra = shuffle(pool.filter(i => S.items[i.id] && !run.includes(i))).sort((a, b) => S.items[a.id].b - S.items[b.id].b).slice(0, len - run.length);
    run = run.concat(extra);
  }
  return run;
}

// ---------- questions ----------
function distractors(item, n) {
  const pick = new Map();
  const add = arr => shuffle(arr).forEach(c => { if (pick.size < n && c.id !== item.id && c.t !== item.t && !pick.has(c.t)) pick.set(c.t, c); });
  add(CARDS.filter(c => c.f === item.f));
  add(CARDS.filter(c => oShow(c) === oShow(item)));
  add(CARDS.filter(c => dom(oShow(c)) === dom(oShow(item))));
  return [...pick.values()];
}
function makeQ(item, forceDir) {
  if (item.kind === "mcq") {
    const idx = shuffle(item.c.map((_, i) => i));
    return { item, ask: "", prompt: item.q, options: idx.map(i => item.c[i]), ans: idx.indexOf(item.a), explain: item.e, hook: "" };
  }
  const opts = shuffle([item, ...distractors(item, 3)]);
  const fwd = forceDir != null ? forceDir : Math.random() < 0.6;
  if (fwd) return { item, ask: item.f === "port" ? "Which protocol is this?" : "Which term matches this description?", prompt: item.d, options: opts.map(x => x.t), ans: opts.indexOf(item), explain: item.t + ": " + item.d, hook: item.m };
  return { item, ask: item.f === "port" ? "What does this protocol use?" : "What does this term mean?", prompt: item.t, term: true, options: opts.map(x => x.d), ans: opts.indexOf(item), explain: item.t + ": " + item.d, hook: item.m };
}

function startQuiz(title, items, opts) {
  opts = opts || {};
  const list = [], pending = [];
  items.forEach(it => {
    if (opts.learn !== false && it.kind === "card" && !S.items[it.id]) { list.push({ learn: true, item: it }); pending.push({ q: makeQ(it), at: list.length + 3 }); }
    else list.push(makeQ(it));
    for (let k = pending.length - 1; k >= 0; k--) if (pending[k].at <= list.length) { list.push(pending[k].q); pending.splice(k, 1); }
  });
  pending.forEach(p => list.push(p.q));
  ACT = { type: "quiz", title, list, i: 0, answered: false, correct: 0, graded: 0, missed: [], requeued: new Set(), xp0: S.xp };
  window.scrollTo(0, 0); render();
}

document.addEventListener("submit", e => {
  const f = e.target.closest("[data-hform]"); if (!f) return; e.preventDefault();
  const v = new FormData(f).get("v") || ""; if (f.dataset.hform === "typeit") tiSubmit(v); else if (f.dataset.hform === "sim") simSubmit(v);
});


// ---------- events ----------
const AGAIN = { ...HANDS_AGAIN, run: () => startRun(), blitz: x => startBlitz(x), match: x => startMatch(x), sort: x => startSort(x), order: x => startOrder(x), scen: x => startScen(x), log: x => startLog(x), drill: x => startDrill(x), lab: x => startLab(x), exam: x => startExam(x[0], x[1]) };
const ACTIONS = {
  ...HANDS_ACTIONS,
  nav: d => { ACT = null; VIEW = d.v; SUB.train = null; window.scrollTo(0, 0); render(); },
  welcomed: () => { S.welcomed = true; save(); render(); },
  dloffline: () => downloadOffline(),
  dlbackup: () => downloadBackup(),
  run: d => startRun(d.d),
  track: d => { let s = SEL().slice(); if (s.includes(d.t)) { if (s.length < 2) return toast("Keep at least one exam selected"); s = s.filter(t => t !== d.t); } else s.push(d.t); S.tracks = TRACKS.filter(t => s.includes(t)); save(); render(); },
  maptr: d => { SUB.map = d.t; render(); },
  room: d => { VIEW = "library"; SUB.lib = "obj"; ACT_OPEN = d.o; render(); const el = document.querySelector("details[open]"); if (el) el.scrollIntoView({ block: "start" }); },
  drill1: d => { const dt = DT(); const items = buildRun(i => oOf(i, dt) === d.o, 15, 15); startQuiz("Objective " + d.o + " drill", items); },
  mode: d => { SUB.train = d.m || null; window.scrollTo(0, 0); render(); },
  libtab: d => { SUB.lib = d.t; render(); },
  reset: () => { if (confirm("Erase all progress, XP, and history? This can't be undone.")) { const th = S.theme; S = blank(); S.theme = th; S.resetAt = Date.now(); save(); render(); toast("Progress reset"); } },
  quit: () => { if (ACT && ACT.type === "exam" && !confirm("Leave the exam? Your answers will be lost.")) return; clearInterval(examTimer); ACT = null; render(); },
  again: () => { const a = ACT; AGAIN[a.again](a.againArg); },
  qans: d => quizAnswer(+d.i), qnext: () => quizNext(),
  blitz: d => startBlitz(d.d), bans: d => blitzAnswer(+d.i),
  match: d => startMatch(+d.i), ml: d => { ACT.sel = d.id; render(); }, mr: d => matchRight(d.id),
  sort: d => startSort(+d.i), si: d => { ACT.sel = +d.i; render(); }, sb: d => sortBucket(+d.i),
  order: d => startOrder(+d.i), op: d => orderPick(d.v),
  scen: d => startScen(+d.i), sc: d => scenPick(+d.k), scnext: () => scenNext(),
  log: d => startLog(+d.i), lg: d => { const i = +d.i; ACT.flags.has(i) ? ACT.flags.delete(i) : ACT.flags.add(i); render(); }, logcheck: () => logCheck(), logdone: () => logDone(),
  lab: d => startLab(+d.i), labstep: d => labToggle("s", +d.i), labclean: d => labToggle("c", +d.i), copy: d => labCopy(+d.i),
  labquiz: () => { const l = ACT.l; startQuiz(l.title + ": quiz", ITEMS.filter(q => q.lab === l.id), { learn: false }); ACT.labIdx = PACK.labs.indexOf(l); },
  drill: d => startDrill(+d.i), dans: d => drillAnswer(+d.i), dnext: () => drillNext(),
  exam: d => startExam(+d.n, d.tr), eans: d => { ACT.ans[ACT.i] = +d.i; render(); }, eflag: () => { ACT.flag[ACT.i] = !ACT.flag[ACT.i]; render(); },
  emove: d => { ACT.i = Math.max(0, Math.min(ACT.n - 1, ACT.i + +d.d)); render(); }, ego: d => { ACT.i = +d.i; render(); },
  esubmit: () => { const un = ACT.ans.filter(x => x == null).length; if (un && !confirm(un + " question(s) unanswered. Submit anyway?")) return; submitExam(); }
};
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.tagName === "SELECT" || b.tagName === "INPUT") return;
  const f = ACTIONS[b.dataset.act]; if (f) { e.preventDefault(); f(b.dataset, b); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.act === "set") { const k = t.dataset.k; S[k] = k === "theme" ? t.value : +t.value; save(); render(); }
  if (t.dataset.act === "examdate") { S.examDate = t.value; save(); render(); }
  if (t.dataset.act === "importfile" && t.files && t.files[0]) { importBackup(t.files[0]); t.value = ""; }
});
document.addEventListener("keydown", e => {
  if (!ACT || ["INPUT","SELECT","BUTTON","SUMMARY"].includes(e.target.tagName) && (e.key === "Enter" || e.key === " ")) return;
  if (["INPUT","SELECT"].includes(e.target.tagName)) return;
  const n = parseInt(e.key, 10);
  const t = ACT.type;
  if (n >= 1 && n <= 6) {
    if (t === "quiz" && !ACT.list[ACT.i].learn && !ACT.answered && n <= ACT.list[ACT.i].options.length) return quizAnswer(n - 1);
    if (t === "blitz" && n <= ACT.q.options.length) return blitzAnswer(n - 1);
    if (t === "drill" && !ACT.answered && n <= 4) return drillAnswer(n - 1);
    if (t === "exam" && n <= ACT.list[ACT.i].options.length) { ACT.ans[ACT.i] = n - 1; return render(); }
    if (t === "scen" && !ACT.solved && n <= ACT.choices.length) return scenPick(ACT.choices[n - 1]);
  }
  if (e.key === "Enter" || e.key === " ") {
    if (t === "quiz" && (ACT.answered || ACT.list[ACT.i].learn)) { e.preventDefault(); return quizNext(); }
    if (t === "drill" && ACT.answered) { e.preventDefault(); return drillNext(); }
    if (t === "scen" && ACT.solved) { e.preventDefault(); return scenNext(); }
  }
});

render();
if (!HOSTED_EMBED && /^https?:$/.test(location.protocol) && "serviceWorker" in navigator && window.top === window) {
  fetch("manifest.webmanifest", { method: "HEAD" }).then(r => {
    if (!r.ok) return;
    const add = (rel, href) => { const l = document.createElement("link"); l.rel = rel; l.href = href; document.head.appendChild(l); };
    add("manifest", "manifest.webmanifest"); add("apple-touch-icon", "icon-192.png");
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }).catch(() => {});
}
window.__game = { ITEMS, S: () => S, PACK }; // for debugging
})();

</script>
</body>
