<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#13223B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Red Cell Ops">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Red Cell Ops: security testing role prep, CySA+, CEH, and CyberOps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --sunk:#E3E8EF; --ink:#13223B; --muted:#56657C; --line:#CDD5E0;
  --accent:#FF9F43; --accent-ink:#13223B; --ok:#1C7F52; --ok-bg:#DDF2E7; --bad:#B83434; --bad-bg:#F8E1E1;
  --d1:#3566AE; --d2:#BC4E32; --d3:#6650A6; --d4:#177F72; --d5:#86741A;
  --head:"Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono:ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:10px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0E1827; --surface:#162438; --sunk:#1D2E46; --ink:#E6ECF4; --muted:#9BAAC0; --line:#2B3D57;
  --accent:#FFAA55; --accent-ink:#13223B; --ok:#4CC58A; --ok-bg:#153A2B; --bad:#F07A7A; --bad-bg:#43202A;
  --d1:#6F9FE6; --d2:#E88468; --d3:#A08CDD; --d4:#49C1B0; --d5:#D2BE58;
}}
:root[data-theme="dark"]{
  --bg:#0E1827; --surface:#162438; --sunk:#1D2E46; --ink:#E6ECF4; --muted:#9BAAC0; --line:#2B3D57;
  --accent:#FFAA55; --accent-ink:#13223B; --ok:#4CC58A; --ok-bg:#153A2B; --bad:#F07A7A; --bad-bg:#43202A;
  --d1:#6F9FE6; --d2:#E88468; --d3:#A08CDD; --d4:#49C1B0; --d5:#D2BE58;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,label.btn{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overflow-wrap:anywhere}
button:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--head);line-height:1.15;margin:0}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:18px;min-height:62px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--head);font-weight:700;font-size:21px;letter-spacing:.01em;background:none;border:0;padding:0}
.badge{width:34px;height:34px;border-radius:8px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:14px;font-weight:700}
.nav{display:flex;gap:4px;margin-left:8px}
.nav button{background:none;border:0;padding:8px 14px;border-radius:8px;font-family:var(--head);font-weight:600;font-size:16px;color:var(--muted)}
.nav button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:inset 0 -3px 0 var(--accent)}
.stats{margin-left:auto;display:flex;gap:16px;align-items:center;font-size:14px;color:var(--muted)}
.stats b{font-family:var(--head);font-size:18px;color:var(--ink);font-weight:700}
.stat{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}
.bnav{display:none}
@media (max-width:760px){
  .nav{display:none}
  .stats .hide-sm{display:none}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .bnav button{flex:1;background:none;border:0;padding:10px 4px;font-family:var(--head);font-weight:600;font-size:15px;color:var(--muted);border-radius:8px}
  .bnav button[aria-current="page"]{color:var(--ink);background:var(--sunk)}
  main{padding-bottom:84px}
  body.playing .bnav{display:none}
}
main{padding:26px 0 60px}
.brand,.stat{white-space:nowrap}
@media (max-width:760px){.top .wrap{gap:10px;min-height:56px}.brand{font-size:18px;gap:8px}.badge{width:30px;height:30px;font-size:13px}.stats{gap:12px;font-size:11.5px}.stats b{font-size:15px}.wrap{padding:0 14px}.qcard{padding:18px}.qcard .prompt{font-size:19px}.qcard .prompt.term{font-size:26px}.today h1{font-size:28px}}
@media (max-width:360px){.brand{font-size:0;gap:0}.brand .badge{font-size:13px}}
@media (hover:none){.keyhint{display:none}}

/* generic */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--ink);background:var(--accent);color:var(--accent-ink);font-family:var(--head);font-weight:700;font-size:17px;padding:11px 20px;border-radius:9px;min-height:46px}
.btn:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.small{font-size:15px;padding:7px 14px;min-height:38px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.muted{color:var(--muted)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:3px 9px;border-radius:99px;background:color-mix(in srgb,var(--dc,var(--muted)) 16%,transparent);color:var(--dc,var(--muted));max-width:100%;line-height:1.3}
.d1{--dc:var(--d1)}.d2{--dc:var(--d2)}.d3{--dc:var(--d3)}.d4{--dc:var(--d4)}.d5{--dc:var(--d5)}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:34px 0 14px}
.sechead h2{font-size:24px}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:18px}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--dc,var(--accent));border-radius:99px;transition:width .4s}

/* HQ */
.today h1{font-size:32px;margin-bottom:6px}
.today .counts{display:flex;gap:22px;margin:14px 0 18px}
.today .counts div{font-size:14px;color:var(--muted)}
.today .counts b{display:block;font-family:var(--head);font-size:30px;color:var(--ink)}
.focus{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.focus button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:14px;font-weight:700;color:var(--dc,var(--ink))}
.focus button:hover{border-color:var(--dc,var(--ink))}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi b{display:block;font-family:var(--head);font-size:28px;font-weight:700}
.kpi span{font-size:14px;color:var(--muted)}
.spark{display:flex;gap:4px;align-items:flex-end;height:44px;margin-top:10px}
.spark i{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:3px;opacity:.9}
.spark i.zero{background:var(--line)}

/* floor plan: the facility map */
.plan{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:16px;background:var(--surface);border:2px solid var(--ink);border-radius:4px;position:relative;
  background-image:linear-gradient(var(--sunk) 1px,transparent 1px),linear-gradient(90deg,var(--sunk) 1px,transparent 1px);background-size:22px 22px}
.wing{border:2px solid var(--dc);background:var(--surface);border-radius:3px;padding:12px;display:flex;flex-direction:column;gap:10px}
@media (max-width:860px){.plan{grid-template-columns:1fr}}
.wing header{display:flex;align-items:baseline;gap:10px}
.wing header .num{font-family:var(--head);font-weight:700;font-size:26px;color:var(--dc);line-height:1}
.wing header h3{font-size:16px}
.wing header .w{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.room{--m:0;position:relative;text-align:left;border:1.5px solid color-mix(in srgb,var(--dc) 55%,var(--line));border-radius:3px;padding:8px 9px 9px;min-height:74px;
  background:linear-gradient(to top,color-mix(in srgb,var(--dc) 32%,transparent) calc(var(--m) * 100%),var(--surface) calc(var(--m) * 100%));display:flex;flex-direction:column;gap:2px}
.room:hover{border-color:var(--dc)}
.room .rn{font-family:var(--head);font-weight:700;font-size:15px;color:var(--dc)}
.room .rt{font-size:13.5px;line-height:1.25}
.room .rp{margin-top:auto;font-size:12px;color:var(--muted)}
.room.secured{border-color:var(--dc);border-width:2.5px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:14px;height:14px;border:1.5px solid var(--muted);vertical-align:-2px;margin-right:6px;border-radius:2px}

/* train */
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.mode{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:6px;min-height:150px}
.mode:hover{border-color:var(--ink)}
.mode h3{font-size:20px}
.mode p{margin:0;color:var(--muted);font-size:15px}
.mode .tag{margin-top:auto;font-size:13px;font-weight:700;color:var(--muted)}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.pick{text-align:left;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--dc);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.pick:hover{border-color:var(--dc)}
.pick b{font-family:var(--head);font-size:17px}
.pick small{color:var(--muted);font-size:13px}

/* play area */
.play{max-width:760px;margin:0 auto}
.playhead{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.playhead .bar{flex:1}
.x{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-weight:700;font-size:14px}
.count{font-family:var(--head);font-weight:600;font-size:15px;color:var(--muted);white-space:nowrap}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px}
.qcard .ask{font-size:14px;color:var(--muted);margin:12px 0 4px}
.qcard .prompt{font-size:21px;line-height:1.4;margin:0 0 18px}
.qcard .prompt.term{font-family:var(--head);font-size:30px;font-weight:700}
.opts{display:grid;gap:10px}
.opt{text-align:left;display:flex;gap:12px;align-items:flex-start;background:var(--bg);border:2px solid var(--line);border-radius:9px;padding:12px 14px;font-size:17px}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt .k{flex:none;width:26px;height:26px;border-radius:6px;border:1.5px solid var(--muted);display:grid;place-items:center;font-family:var(--head);font-weight:700;font-size:14px;color:var(--muted)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt[disabled]{cursor:default}
.feedback{margin-top:16px;border-radius:9px;padding:14px 16px;border-left:5px solid var(--ok);background:var(--ok-bg)}
.feedback.no{border-left-color:var(--bad);background:var(--bad-bg)}
.feedback h4{margin:0 0 4px;font-family:var(--head);font-size:18px}
.feedback p{margin:4px 0}
.hook{margin-top:8px;padding:10px 12px;border:1.5px dashed var(--accent);border-radius:8px;background:color-mix(in srgb,var(--accent) 12%,transparent)}
.hook b{font-family:var(--head)}
.next{margin-top:16px;display:flex;justify-content:flex-end;gap:10px}
.learn .term{font-family:var(--head);font-size:34px;font-weight:700;margin:10px 0}
.learn .def{font-size:20px;line-height:1.45}
.newtag{font-family:var(--head);font-weight:700;font-size:13px;background:var(--accent);color:var(--accent-ink);padding:2px 8px;border-radius:5px}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .25s 2}
@media (prefers-reduced-motion:reduce){.shake{animation:none}.bar>i{transition:none}}
.kbd{font-size:13px;color:var(--muted);margin-top:14px}

/* match / sort / order */
.match{display:grid;grid-template-columns:1fr 1.5fr;gap:12px}
.match .col{display:grid;gap:8px;align-content:start}
.tile{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:8px;padding:10px 12px;font-size:15px;min-height:52px}
.tile.term{font-family:var(--head);font-weight:600;font-size:16px}
.tile.sel{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.tile.done{border-color:var(--ok);background:var(--ok-bg);opacity:.75}
.tile.bad{border-color:var(--bad);background:var(--bad-bg)}
@media (max-width:560px){.match{grid-template-columns:1fr 1.3fr}.tile{font-size:14px;padding:8px}}
.tray{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;min-height:50px}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.bucket{text-align:left;background:var(--surface);border:2px dashed var(--line);border-radius:10px;padding:10px;min-height:120px;display:flex;flex-direction:column;gap:6px}
.bucket:hover{border-color:var(--ink)}
.bucket h4{margin:0;font-family:var(--head);font-size:16px}
.bucket .in{font-size:13.5px;background:var(--ok-bg);border-radius:6px;padding:4px 7px}
.hint{font-size:14px;color:var(--bad);margin-top:6px}
.seq{display:grid;gap:8px;margin-bottom:16px;counter-reset:s}
.seq div{background:var(--ok-bg);border:2px solid var(--ok);border-radius:8px;padding:9px 12px;font-weight:700;counter-increment:s}
.seq div::before{content:counter(s) ". ";font-family:var(--head)}

/* logs */
.logbox{background:#0F1A2A;color:#D8E2F0;border-radius:10px;padding:10px;overflow-x:auto}
.logline{display:block;width:100%;text-align:left;background:none;border:0;border-left:4px solid transparent;color:inherit;font-family:var(--mono);font-size:13.5px;padding:8px 10px;white-space:pre;border-radius:4px}
.logline:hover{background:#1B2A40}
.logline.flag{border-left-color:#F5BC4A;background:#2A2A1E}
.logline.tp{border-left-color:#4CC58A;background:#153A2B}
.logline.fp{border-left-color:#F07A7A;background:#43202A}
.logline.fn{border-left-color:#F07A7A;background:#2B1F2A;outline:1px dashed #F07A7A}
.why{font-size:14px;margin:4px 0 10px 14px;color:var(--muted)}

/* results */
.result h2{font-size:30px}
.big{font-family:var(--head);font-size:56px;font-weight:700;line-height:1}
.dbar{display:grid;grid-template-columns:190px 1fr 50px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
@media (max-width:560px){.dbar{grid-template-columns:120px 1fr 44px}}
.missed{margin-top:18px;display:grid;gap:10px}
.missed div{border-left:4px solid var(--bad);padding:6px 12px;background:var(--surface);border-radius:4px}

/* exam */
.qnav{display:flex;flex-wrap:wrap;gap:5px;margin-top:16px}
.qnav button{width:34px;height:34px;border:1.5px solid var(--line);background:var(--surface);border-radius:6px;font-size:13px;font-weight:700}
.qnav button.ans{background:var(--sunk)}
.qnav button.cur{border-color:var(--ink);border-width:2.5px}
.qnav button.flg{box-shadow:inset 0 -4px 0 var(--accent)}
.timer{font-family:var(--head);font-weight:700;font-size:18px}

/* library */
details.obj{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--dc);border-radius:6px;margin-bottom:8px}
details.obj summary{cursor:pointer;padding:12px 16px;display:flex;gap:12px;align-items:baseline;list-style:none}
details.obj summary::-webkit-details-marker{display:none}
details.obj summary .rn{font-family:var(--head);font-weight:700;color:var(--dc);min-width:32px}
details.obj summary .pct{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}
.objbody{padding:0 16px 16px}
.terms{display:grid;gap:10px;margin:10px 0 14px}
.terms div{border-top:1px solid var(--line);padding-top:10px}
.terms b{font-family:var(--head);font-size:16.5px}
.terms p{margin:2px 0}
.terms em{color:var(--muted);font-size:14.5px}
.box{display:inline-block;font-size:12px;font-weight:700;padding:1px 7px;border-radius:5px;background:var(--sunk);color:var(--muted);margin-left:6px;vertical-align:1px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;font-family:var(--head);font-weight:600}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px;background:var(--surface)}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line)}
th{font-family:var(--head);font-size:15px}
td.num{font-family:var(--mono);white-space:nowrap}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin:14px 0}
.facts div{background:var(--sunk);border-radius:8px;padding:12px}
.facts b{display:block;font-family:var(--head);font-size:22px}
.facts span{font-size:13.5px;color:var(--muted)}
input[type=date],select{font:inherit;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px}
.welcome{border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.welcome ol{margin:8px 0 12px;padding-left:22px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:9px;font-weight:700;z-index:50;font-size:15px}
.sync{font-size:12px;color:var(--muted)}
p.lead{font-size:18px;max-width:62ch}
.labwarn{margin:14px 0;padding:12px 14px;border-radius:9px;border:1.5px solid var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface));font-size:15px}
.labh{font-size:20px;margin:22px 0 10px}
.steps{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.step{min-width:0;display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.step.on{border-color:var(--ok);background:color-mix(in srgb,var(--ok-bg) 60%,var(--surface))}
.tick{flex:none;width:30px;height:30px;border-radius:8px;border:2px solid var(--muted);background:var(--surface);position:relative}
.tick[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.tick[aria-pressed="true"]::after{content:"";position:absolute;left:9px;top:3px;width:8px;height:15px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg)}
.sbody{min-width:0;flex:1}.sbody h4{margin:3px 0 4px;font-family:var(--head);font-size:17px}.sbody p{margin:4px 0}
.step.on .sbody h4{text-decoration:line-through;text-decoration-color:var(--ok)}
.see{font-size:14.5px;color:var(--muted)}
.codewrap{position:relative;margin:8px 0;max-width:100%;min-width:0}
.code{margin:0;background:#0F1A2A;color:#D8E2F0;font-family:var(--mono);font-size:13px;line-height:1.5;padding:12px 14px;padding-right:74px;border-radius:8px;overflow-x:auto;white-space:pre;overflow-wrap:normal}
.copy{position:absolute;top:6px;right:6px;background:#1B2A40!important;color:#D8E2F0!important;border-color:#2B3D57!important;min-height:30px!important;padding:4px 10px!important;font-size:13px!important}

.rlist{display:grid;gap:7px;margin-bottom:6px}.rlist div{display:grid;grid-template-columns:70px 1fr 42px;gap:8px;align-items:center;font-size:14px}.rlist b{font-family:var(--head);font-size:16px!important;display:inline!important}
.trackbar{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.seg button{text-align:left;border:2px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 13px;display:flex;flex-direction:column;max-width:230px}
.seg button b{font-family:var(--head);font-size:16px}
.seg button small{font-size:12.5px;color:var(--muted);line-height:1.3}
.seg button[aria-pressed="true"]{border-color:var(--ink);background:var(--surface);box-shadow:inset 0 -4px 0 var(--accent)}
@media (max-width:760px){.seg{margin-left:0}.seg button{max-width:none;flex:1 1 100%}}


/* hands-on activities */
.tin{width:100%;font:inherit;font-size:18px;background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:9px;padding:12px 14px}
.tin:focus{outline:3px solid var(--accent);outline-offset:1px;border-color:var(--ink)}
.tbox{background:#0F1A2A;color:#D8E2F0;border-radius:10px;padding:12px 14px;font-family:var(--mono);font-size:13.5px;max-height:46vh;overflow:auto;margin:12px 0}
.tbox .tl{white-space:pre-wrap}.tbox .tl .pr{color:#4CC58A}
.tbox pre{margin:2px 0 10px;white-space:pre-wrap;font:inherit;color:#B9C7DB}
.tbox pre.bad{color:#F07A7A}
.tbox.sheet{background:var(--sunk);color:var(--ink);font-family:var(--body);font-size:16px}
.tbox.sheet .tl .pr{color:var(--ok);font-weight:700}.tbox.sheet pre{color:var(--muted);font-family:var(--body)}.tbox.sheet pre.bad{color:var(--bad)}
.tprompt{display:flex;align-items:center;gap:10px}.tprompt .pr{font-family:var(--mono);color:var(--muted);white-space:nowrap;font-size:14px}
.tprompt .tin{font-family:var(--mono);font-size:16px}
