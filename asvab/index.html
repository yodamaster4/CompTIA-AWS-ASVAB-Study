<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#13223B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Enlist Ready">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Enlist Ready: ASVAB trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF0EA; --surface:#FFFFFF; --sunk:#E3E8EF; --ink:#1C2A1E; --muted:#56657C; --line:#CDD5E0;
  --accent:#E0B84A; --accent-ink:#13223B; --ok:#1C7F52; --ok-bg:#DDF2E7; --bad:#B83434; --bad-bg:#F8E1E1;
  --d1:#3566AE; --d2:#BC4E32; --d3:#6650A6; --d4:#177F72; --d5:#86741A;
  --head:"Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono:ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:10px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0E1827; --surface:#162438; --sunk:#1D2E46; --ink:#E6ECF4; --muted:#9BAAC0; --line:#2B3D57;
  --accent:#E8C45C; --accent-ink:#13223B; --ok:#4CC58A; --ok-bg:#153A2B; --bad:#F07A7A; --bad-bg:#43202A;
  --d1:#6F9FE6; --d2:#E88468; --d3:#A08CDD; --d4:#49C1B0; --d5:#D2BE58;
}}
:root[data-theme="dark"]{
  --bg:#0E1827; --surface:#162438; --sunk:#1D2E46; --ink:#E6ECF4; --muted:#9BAAC0; --line:#2B3D57;
  --accent:#E8C45C; --accent-ink:#13223B; --ok:#4CC58A; --ok-bg:#153A2B; --bad:#F07A7A; --bad-bg:#43202A;
  --d1:#6F9FE6; --d2:#E88468; --d3:#A08CDD; --d4:#49C1B0; --d5:#D2BE58;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,label.btn{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overflow-wrap:anywhere}
button:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--head);line-height:1.15;margin:0}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:18px;min-height:62px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--head);font-weight:700;font-size:21px;letter-spacing:.01em;background:none;border:0;padding:0}
.badge{width:34px;height:34px;border-radius:8px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:14px;font-weight:700}
.nav{display:flex;gap:4px;margin-left:8px}
.nav button{background:none;border:0;padding:8px 14px;border-radius:8px;font-family:var(--head);font-weight:600;font-size:16px;color:var(--muted)}
.nav button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:inset 0 -3px 0 var(--accent)}
.stats{margin-left:auto;display:flex;gap:16px;align-items:center;font-size:14px;color:var(--muted)}
.stats b{font-family:var(--head);font-size:18px;color:var(--ink);font-weight:700}
.stat{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}
.bnav{display:none}
@media (max-width:760px){
  .nav{display:none}
  .stats .hide-sm{display:none}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .bnav button{flex:1;background:none;border:0;padding:10px 4px;font-family:var(--head);font-weight:600;font-size:15px;color:var(--muted);border-radius:8px}
  .bnav button[aria-current="page"]{color:var(--ink);background:var(--sunk)}
  main{padding-bottom:84px}
  body.playing .bnav{display:none}
}
main{padding:26px 0 60px}
.brand,.stat{white-space:nowrap}
@media (max-width:760px){.top .wrap{gap:10px;min-height:56px}.brand{font-size:18px;gap:8px}.badge{width:30px;height:30px;font-size:13px}.stats{gap:12px;font-size:11.5px}.stats b{font-size:15px}.wrap{padding:0 14px}.qcard{padding:18px}.qcard .prompt{font-size:19px}.qcard .prompt.term{font-size:26px}.today h1{font-size:28px}}
@media (max-width:360px){.brand{font-size:0;gap:0}.brand .badge{font-size:13px}}
@media (hover:none){.keyhint{display:none}}

/* generic */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--ink);background:var(--accent);color:var(--accent-ink);font-family:var(--head);font-weight:700;font-size:17px;padding:11px 20px;border-radius:9px;min-height:46px}
.btn:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.small{font-size:15px;padding:7px 14px;min-height:38px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.muted{color:var(--muted)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:3px 9px;border-radius:99px;background:color-mix(in srgb,var(--dc,var(--muted)) 16%,transparent);color:var(--dc,var(--muted));max-width:100%;line-height:1.3}
.d1{--dc:var(--d1)}.d2{--dc:var(--d2)}.d3{--dc:var(--d3)}.d4{--dc:var(--d4)}.d5{--dc:var(--d5)}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:34px 0 14px}
.sechead h2{font-size:24px}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:18px}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--dc,var(--accent));border-radius:99px;transition:width .4s}

/* HQ */
.today h1{font-size:32px;margin-bottom:6px}
.today .counts{display:flex;gap:22px;margin:14px 0 18px}
.today .counts div{font-size:14px;color:var(--muted)}
.today .counts b{display:block;font-family:var(--head);font-size:30px;color:var(--ink)}
.focus{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.focus button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:14px;font-weight:700;color:var(--dc,var(--ink))}
.focus button:hover{border-color:var(--dc,var(--ink))}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi b{display:block;font-family:var(--head);font-size:28px;font-weight:700}
.kpi span{font-size:14px;color:var(--muted)}
.spark{display:flex;gap:4px;align-items:flex-end;height:44px;margin-top:10px}
.spark i{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:3px;opacity:.9}
.spark i.zero{background:var(--line)}

/* floor plan: the facility map */
.plan{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:16px;background:var(--surface);border:2px solid var(--ink);border-radius:4px;position:relative;
  background-image:linear-gradient(var(--sunk) 1px,transparent 1px),linear-gradient(90deg,var(--sunk) 1px,transparent 1px);background-size:22px 22px}
.wing{border:2px solid var(--dc);background:var(--surface);border-radius:3px;padding:12px;display:flex;flex-direction:column;gap:10px}
@media (max-width:860px){.plan{grid-template-columns:1fr}}
.wing header{display:flex;align-items:baseline;gap:10px}
.wing header .num{font-family:var(--head);font-weight:700;font-size:26px;color:var(--dc);line-height:1}
.wing header h3{font-size:16px}
.wing header .w{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.room{--m:0;position:relative;text-align:left;border:1.5px solid color-mix(in srgb,var(--dc) 55%,var(--line));border-radius:3px;padding:8px 9px 9px;min-height:74px;
  background:linear-gradient(to top,color-mix(in srgb,var(--dc) 32%,transparent) calc(var(--m) * 100%),var(--surface) calc(var(--m) * 100%));display:flex;flex-direction:column;gap:2px}
.room:hover{border-color:var(--dc)}
.room .rn{font-family:var(--head);font-weight:700;font-size:15px;color:var(--dc)}
.room .rt{font-size:13.5px;line-height:1.25}
.room .rp{margin-top:auto;font-size:12px;color:var(--muted)}
.room.secured{border-color:var(--dc);border-width:2.5px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:14px;height:14px;border:1.5px solid var(--muted);vertical-align:-2px;margin-right:6px;border-radius:2px}

/* train */
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.mode{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:6px;min-height:150px}
.mode:hover{border-color:var(--ink)}
.mode h3{font-size:20px}
.mode p{margin:0;color:var(--muted);font-size:15px}
.mode .tag{margin-top:auto;font-size:13px;font-weight:700;color:var(--muted)}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.pick{text-align:left;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--dc);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.pick:hover{border-color:var(--dc)}
.pick b{font-family:var(--head);font-size:17px}
.pick small{color:var(--muted);font-size:13px}

/* play area */
.play{max-width:760px;margin:0 auto}
.playhead{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.playhead .bar{flex:1}
.x{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-weight:700;font-size:14px}
.count{font-family:var(--head);font-weight:600;font-size:15px;color:var(--muted);white-space:nowrap}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px}
.qcard .ask{font-size:14px;color:var(--muted);margin:12px 0 4px}
.qcard .prompt{font-size:21px;line-height:1.4;margin:0 0 18px}
.qcard .prompt.term{font-family:var(--head);font-size:30px;font-weight:700}
.opts{display:grid;gap:10px}
.opt{text-align:left;display:flex;gap:12px;align-items:flex-start;background:var(--bg);border:2px solid var(--line);border-radius:9px;padding:12px 14px;font-size:17px}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt .k{flex:none;width:26px;height:26px;border-radius:6px;border:1.5px solid var(--muted);display:grid;place-items:center;font-family:var(--head);font-weight:700;font-size:14px;color:var(--muted)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt[disabled]{cursor:default}
.feedback{margin-top:16px;border-radius:9px;padding:14px 16px;border-left:5px solid var(--ok);background:var(--ok-bg)}
.feedback.no{border-left-color:var(--bad);background:var(--bad-bg)}
.feedback h4{margin:0 0 4px;font-family:var(--head);font-size:18px}
.feedback p{margin:4px 0}
.hook{margin-top:8px;padding:10px 12px;border:1.5px dashed var(--accent);border-radius:8px;background:color-mix(in srgb,var(--accent) 12%,transparent)}
.hook b{font-family:var(--head)}
.next{margin-top:16px;display:flex;justify-content:flex-end;gap:10px}
.learn .term{font-family:var(--head);font-size:34px;font-weight:700;margin:10px 0}
.learn .def{font-size:20px;line-height:1.45}
.newtag{font-family:var(--head);font-weight:700;font-size:13px;background:var(--accent);color:var(--accent-ink);padding:2px 8px;border-radius:5px}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .25s 2}
@media (prefers-reduced-motion:reduce){.shake{animation:none}.bar>i{transition:none}}
.kbd{font-size:13px;color:var(--muted);margin-top:14px}

/* match / sort / order */
.match{display:grid;grid-template-columns:1fr 1.5fr;gap:12px}
.match .col{display:grid;gap:8px;align-content:start}
.tile{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:8px;padding:10px 12px;font-size:15px;min-height:52px}
.tile.term{font-family:var(--head);font-weight:600;font-size:16px}
.tile.sel{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.tile.done{border-color:var(--ok);background:var(--ok-bg);opacity:.75}
.tile.bad{border-color:var(--bad);background:var(--bad-bg)}
@media (max-width:560px){.match{grid-template-columns:1fr 1.3fr}.tile{font-size:14px;padding:8px}}
.tray{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;min-height:50px}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.bucket{text-align:left;background:var(--surface);border:2px dashed var(--line);border-radius:10px;padding:10px;min-height:120px;display:flex;flex-direction:column;gap:6px}
.bucket:hover{border-color:var(--ink)}
.bucket h4{margin:0;font-family:var(--head);font-size:16px}
.bucket .in{font-size:13.5px;background:var(--ok-bg);border-radius:6px;padding:4px 7px}
.hint{font-size:14px;color:var(--bad);margin-top:6px}
.seq{display:grid;gap:8px;margin-bottom:16px;counter-reset:s}
.seq div{background:var(--ok-bg);border:2px solid var(--ok);border-radius:8px;padding:9px 12px;font-weight:700;counter-increment:s}
.seq div::before{content:counter(s) ". ";font-family:var(--head)}

/* logs */
.logbox{background:#0F1A2A;color:#D8E2F0;border-radius:10px;padding:10px;overflow-x:auto}
.logline{display:block;width:100%;text-align:left;background:none;border:0;border-left:4px solid transparent;color:inherit;font-family:var(--mono);font-size:13.5px;padding:8px 10px;white-space:pre;border-radius:4px}
.logline:hover{background:#1B2A40}
.logline.flag{border-left-color:#F5BC4A;background:#2A2A1E}
.logline.tp{border-left-color:#4CC58A;background:#153A2B}
.logline.fp{border-left-color:#F07A7A;background:#43202A}
.logline.fn{border-left-color:#F07A7A;background:#2B1F2A;outline:1px dashed #F07A7A}
.why{font-size:14px;margin:4px 0 10px 14px;color:var(--muted)}

/* results */
.result h2{font-size:30px}
.big{font-family:var(--head);font-size:56px;font-weight:700;line-height:1}
.dbar{display:grid;grid-template-columns:190px 1fr auto;gap:10px;align-items:center;margin:8px 0;font-size:14px}
@media (max-width:560px){.dbar{grid-template-columns:120px 1fr 44px}}
.missed{margin-top:18px;display:grid;gap:10px}
.missed div{border-left:4px solid var(--bad);padding:6px 12px;background:var(--surface);border-radius:4px}

/* exam */
.qnav{display:flex;flex-wrap:wrap;gap:5px;margin-top:16px}
.qnav button{width:34px;height:34px;border:1.5px solid var(--line);background:var(--surface);border-radius:6px;font-size:13px;font-weight:700}
.qnav button.ans{background:var(--sunk)}
.qnav button.cur{border-color:var(--ink);border-width:2.5px}
.qnav button.flg{box-shadow:inset 0 -4px 0 var(--accent)}
.timer{font-family:var(--head);font-weight:700;font-size:18px}

/* library */
details.obj{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--dc);border-radius:6px;margin-bottom:8px}
details.obj summary{cursor:pointer;padding:12px 16px;display:flex;gap:12px;align-items:baseline;list-style:none}
details.obj summary::-webkit-details-marker{display:none}
details.obj summary .rn{font-family:var(--head);font-weight:700;color:var(--dc);min-width:32px}
details.obj summary .pct{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}
.objbody{padding:0 16px 16px}
.terms{display:grid;gap:10px;margin:10px 0 14px}
.terms div{border-top:1px solid var(--line);padding-top:10px}
.terms b{font-family:var(--head);font-size:16.5px}
.terms p{margin:2px 0}
.terms em{color:var(--muted);font-size:14.5px}
.box{display:inline-block;font-size:12px;font-weight:700;padding:1px 7px;border-radius:5px;background:var(--sunk);color:var(--muted);margin-left:6px;vertical-align:1px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;font-family:var(--head);font-weight:600}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px;background:var(--surface)}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line)}
th{font-family:var(--head);font-size:15px}
td.num{font-family:var(--mono);white-space:nowrap}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin:14px 0}
.facts div{background:var(--sunk);border-radius:8px;padding:12px}
.facts b{display:block;font-family:var(--head);font-size:22px}
.facts span{font-size:13.5px;color:var(--muted)}
input[type=date],select{font:inherit;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px}
.welcome{border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.welcome ol{margin:8px 0 12px;padding-left:22px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:9px;font-weight:700;z-index:50;font-size:15px}
.sync{font-size:12px;color:var(--muted)}
p.lead{font-size:18px;max-width:62ch}

/* ===== App layer ===== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 1px 0 rgba(0,0,0,.02)}
.pagetitle{font-size:30px;margin:0 0 14px}
.sect{font-size:18px;margin:26px 0 10px}
.eyebrow{margin:0;font-family:var(--head);font-weight:700;font-size:13px;letter-spacing:.04em;color:var(--muted)}
.center{text-align:center}
.hero .herorow{display:flex;gap:22px;align-items:center}
.herotext h2{font-size:24px;margin:4px 0 6px}.herotext p{margin:0 0 12px}
@media (max-width:560px){.hero .herorow{flex-direction:column;text-align:center}.hero .row{justify-content:center}}
.ring{position:relative;flex:none}.ring svg{display:block}
.rlab{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;text-align:center}
.rlab b{font-family:var(--head);font-size:clamp(13px,26%,42px)}
.ring[style*="164px"] .rlab b{font-size:44px}.ring[style*="120px"] .rlab b{font-size:28px}.ring[style*="58px"] .rlab b{font-size:14px}.ring[style*="48px"] .rlab b,.ring[style*="44px"] .rlab b{font-size:12px}
.rlab span{font-size:12.5px;color:var(--muted);margin-top:3px}
.tiles2{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:14px}
@media (max-width:860px){.tiles2{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{text-align:left;display:flex;flex-direction:column;gap:3px;padding:14px;min-height:118px}
button.tile:hover,button.subj:hover,button.test:hover{border-color:var(--ink)}
.tile b{font-family:var(--head);font-size:17px}.tile .muted{font-size:13.5px}

const blank = () => ({ v: 1, items: {}, obj: {}, xp: 0, streak: 0, lastDay: null, examDate: "", runLen: 20, newPerRun: 10, best: {}, days: {}, exams: [], welcomed: false, theme: "", tracks: [], labs: {}, saved: {}, daily: {}, qmode: "study", branch: "Army", edu: "diploma", updatedAt: 0 });

function migrate(s) { if (!Array.isArray(s.tracks)) s.tracks = []; ["labs", "saved", "daily"].forEach(k => { if (!s[k] || typeof s[k] !== "object") s[k] = {}; }); if (!s.qmode) s.qmode = "study"; return s; }
function load() { try { const r = localStorage.getItem(KEY); if (r) return migrate(Object.assign(blank(), JSON.parse(r))); } catch (e) {} return blank(); }
function mergeState(a, b) {
  if (!b || typeof b !== "object") return a;
  if ((b.updatedAt || 0) < (a.resetAt || 0)) return a;
  if ((a.updatedAt || 0) < (b.resetAt || 0)) a = blank();
  const m = JSON.parse(JSON.stringify(Object.assign(blank(), a)));
  const newer = (b.updatedAt || 0) > (a.updatedAt || 0);
  Object.entries(b.items || {}).forEach(([k, v]) => { const x = m.items[k]; const n = v.r + v.w, nx = x ? x.r + x.w : -1; if (!x || n > nx || (n === nx && v.d > x.d)) m.items[k] = v; });
  Object.entries(b.obj || {}).forEach(([k, v]) => { const x = m.obj[k]; if (!x || v.t > x.t) m.obj[k] = v; });
  Object.entries(b.days || {}).forEach(([k, v]) => { m.days[k] = Math.max(m.days[k] || 0, v); });
  Object.entries(b.best || {}).forEach(([k, v]) => { m.best[k] = Math.max(m.best[k] || 0, v); });
  const seen = new Set(m.exams.map(x => x.at)); (b.exams || []).forEach(x => { if (!seen.has(x.at)) m.exams.push(x); }); m.exams.sort((x, y) => x.at - y.at);
  Object.entries(b.labs || {}).forEach(([k, v]) => { const x = m.labs[k] || { s: [], c: [], done: false };
    m.labs[k] = { s: [...new Set([...(x.s || []), ...(v.s || [])])], c: [...new Set([...(x.c || []), ...(v.c || [])])], done: !!(x.done || v.done) }; });
  Object.keys(b.saved || {}).forEach(k => { m.saved[k] = 1; });

  if (newer) ["examDate", "runLen", "newPerRun", "theme", "tracks", "welcomed", "qmode", "branch", "edu"].forEach(k => { if (b[k] !== undefined && b[k] !== "") m[k] = b[k]; });
  else if (!m.examDate && b.examDate) m.examDate = b.examDate;

}

async function offerFile(filename, data, mime) {

      if (dl) { await dl.save({ filename, data: new Blob([data], { type: mime }) }); return true; }
    } catch (err) { if (err && err.code === "declined") return false; }
  }
  try {
    const url = URL.createObjectURL(new Blob([data], { type: mime }));
    const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000); return true;
  } catch (err) { toast("This browser blocked the download"); return false; }
}
function stamp() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }

// ---------- learning model ----------
function touchDay() { const t = today(); S.days[t] = (S.days[t] || 0) + 1; if (S.lastDay !== t) { S.streak = S.lastDay === t - 1 ? S.streak + 1 : 1; S.lastDay = t; } }
function addXP(n) { S.xp += n; }
function objStat1(k, ok) { const s = S.obj[k] || { r: 0, t: 0 }; s.t++; if (ok) s.r++; S.obj[k] = s; }
function objStat(x, ok) { Object.entries((x && x.x) || {}).forEach(([t, o]) => objStat1(t + ":" + o, ok)); }
function grade(id, ok) {
  const it = S.items[id] || { b: 0, d: 0, r: 0, w: 0 };
  if (ok) { it.b = Math.min(5, it.b + 1); it.d = today() + INTERVALS[it.b]; it.r++; }
  else { it.b = 1; it.d = today(); it.w++; }
  S.items[id] = it; objStat(BYID[id], ok); addXP(ok ? 10 : 2); touchDay();
}
function seenCount(list) { return list.filter(i => S.items[i.id]).length; }
function objMastery(o, tr) {
  tr = tr || DT(); const its = BYOBJ[tr][o] || []; if (!its.length) return 0;
  let m = 0; its.forEach(i => { const st = S.items[i.id]; if (st) m += st.b / 5; }); m /= its.length;
  const a = S.obj[tr + ":" + o]; const cov = seenCount(its) / its.length;
  if (a && a.t >= 3) return Math.min(1, 0.85 * m + 0.15 * (a.r / a.t) * cov);
  return m;
}
function domMastery(d, tr) { const os = OBJ_KEYS[tr].filter(o => dom(o) === d); return os.reduce((s, o) => s + objMastery(o, tr), 0) / os.length; }
function readiness(tr) { tr = tr || DT(); return T(tr).domains.reduce((s, d) => s + d.w * domMastery(d.n, tr), 0) / 100; }
function level() { const l = Math.floor(S.xp / 600); return { n: l + 1, title: LEVELS[Math.min(l, LEVELS.length - 1)], into: S.xp % 600 }; }
function dueCount(filter) { const t = today(); return ITEMS.filter(i => inPool(i) && (!filter || filter(i)) && S.items[i.id] && S.items[i.id].d <= t).length; }
function newCount(filter) { return ITEMS.filter(i => inPool(i) && (!filter || filter(i)) && !S.items[i.id]).length; }

function pickNew(list, n) {
  const groups = {};
  list.forEach(i => { const tr = trShow(i), o = oOf(i, tr), k = tr + ":" + dom(o);
    if (!groups[k]) groups[k] = { w: ((T(tr).domains[dom(o) - 1] || { w: 10 }).w) * (tr === DT() ? 1.5 : 1), a: [] };
    groups[k].a.push(i); });
  Object.values(groups).forEach(g => g.a.sort((x, y) => objCmp(oShow(x), oShow(y)) || (x.kind === y.kind ? 0 : x.kind === "card" ? -1 : 1)));
  const out = [];
  while (out.length < n) {
    const ks = Object.keys(groups).filter(k => groups[k].a.length); if (!ks.length) break;
    const tot = ks.reduce((s, k) => s + groups[k].w, 0); let r = Math.random() * tot, pick = ks[0];
    for (const k of ks) { r -= groups[k].w; if (r <= 0) { pick = k; break; } }
    out.push(groups[pick].a.shift());
  }
  return out;
}
function buildRun(filter, len, newMax) {
  len = len || S.runLen; newMax = newMax == null ? S.newPerRun : newMax;
  const t = today(); const pool = ITEMS.filter(i => inPool(i) && (!filter || filter(i)));
  const due = pool.filter(i => S.items[i.id] && S.items[i.id].d <= t).sort((a, b) => S.items[a.id].d - S.items[b.id].d || S.items[a.id].b - S.items[b.id].b);
  let run = due.slice(0, len);
  run = run.concat(pickNew(pool.filter(i => !S.items[i.id]), Math.min(newMax, len - run.length)));
  if (run.length < len) {
    const extra = shuffle(pool.filter(i => S.items[i.id] && !run.includes(i))).sort((a, b) => S.items[a.id].b - S.items[b.id].b).slice(0, len - run.length);
    run = run.concat(extra);
  }
  return run;
}

// ---------- questions ----------
function distractors(item, n) {
  const pick = new Map();
  const add = arr => shuffle(arr).forEach(c => { if (pick.size < n && c.id !== item.id && c.t !== item.t && !pick.has(c.t)) pick.set(c.t, c); });
  add(CARDS.filter(c => c.f === item.f));
  add(CARDS.filter(c => oShow(c) === oShow(item)));
  add(CARDS.filter(c => dom(oShow(c)) === dom(oShow(item))));
  return [...pick.values()];
}
function makeQ(item, forceDir) {
  if (item.kind === "mcq") {
    const idx = shuffle(item.c.map((_, i) => i));
    return { item, ask: "", prompt: item.q, options: idx.map(i => item.c[i]), ans: idx.indexOf(item.a), explain: item.e, hook: "" };
  }
  const opts = shuffle([item, ...distractors(item, 3)]);
  const fwd = forceDir != null ? forceDir : Math.random() < 0.6;
  if (fwd) return { item, ask: item.f === "port" ? "Which protocol is this?" : "Which term matches this description?", prompt: item.d, options: opts.map(x => x.t), ans: opts.indexOf(item), explain: item.t + ": " + item.d, hook: item.m };
  return { item, ask: item.f === "port" ? "What does this protocol use?" : "What does this term mean?", prompt: item.t, term: true, options: opts.map(x => x.d), ans: opts.indexOf(item), explain: item.t + ": " + item.d, hook: item.m };
}

// ================= COACH: AI TUTOR =================
let TUTOR_OK = null, TUT = null, SAMPLE = null;
(async () => { try { if (!window.claude || !window.claude.use) { TUTOR_OK = false; return; } SAMPLE = await window.claude.use("sample"); TUTOR_OK = !!SAMPLE; } catch (e) { TUTOR_OK = false; } if (!ACT) render(); })();
if (!(window.claude && window.claude.use)) TUTOR_OK = false;
const COACH_RULES = `You are Coach, a patient, encouraging ASVAB tutor. The learner remembers best with short, hands-on steps and repetition.
Rules:
- Plain language. Short paragraphs. At most about 120 words per reply. No tables, no headings.
- For math and mechanics: work one step at a time. Give one step, then ask the learner to do the next small step and wait. Check their answer kindly and correct gently.
- Never use calculator methods; the ASVAB doesn't allow calculators. Show mental-math or pencil methods.
- If the learner has NOT answered the question yet, do not reveal the final answer unless they ask for it directly. Guide them to it.
- End with one short question or next step for the learner.
- Stay on ASVAB study topics. If asked something unrelated, steer back politely.`;
function qContext(q, picked) {
  if (!q) return "No specific question. The learner wants general ASVAB help.";
  const subj = oShow(q.item || q) ? T(DT()).objectives[oShow(q.item || q)][0] : "ASVAB";
  if (q.html) return `Subtest: ${subj}. It's a picture puzzle (Assembling Objects) that you can't see. Explanation available: ${q.explain}. Coach general strategy for this puzzle type.`;
  return `Subtest: ${subj}.\nQuestion: ${q.prompt}\nChoices: ${q.options.map((o, i) => String.fromCharCode(65 + i) + ") " + o).join("  ")}\n` +
    (picked == null ? "The learner has not answered yet." : `The learner chose ${String.fromCharCode(65 + picked)}) ${q.options[picked]}. The correct answer is ${String.fromCharCode(65 + q.ans)}) ${q.options[q.ans]}. Explanation: ${q.explain}`);
}
function openTutor(q, picked, first) {
  TUT = { ctx: qContext(q, picked), turns: [], busy: false, answered: picked != null, q };
  document.body.classList.add("tutoring"); renderTutor();
  tutorSend(first || (picked == null ? "Help me solve this step by step, without giving away the answer yet." : (picked === q.ans ? "I got it right. Show me the fastest way to solve this kind of question." : "I got this wrong. Walk me through it step by step.")));
}
function closeTutor() { if (TUT && TUT.ctrl) try { TUT.ctrl.abort(); } catch (e) {} TUT = null; document.body.classList.remove("tutoring"); $("#tutor").innerHTML = ""; }
function fmtCoach(t) { return esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/^\s*[-*] (.+)$/gm, "• $1").replace(/\n/g, "<br>"); }
function renderTutor() {
  if (!TUT) return;
  const el = $("#tutor");
  el.innerHTML = `<div class="tscrim" data-act="tutorclose"></div><section class="tsheet" role="dialog" aria-label="Coach, AI tutor"><header><b>${icon("profile", 20)} Coach</b><span class="muted">AI tutor</span><button class="x" data-act="tutorclose">Close</button></header>
    <div class="tmsgs" id="tmsgs">${TUT.turns.map(t => `<div class="tm ${t.role}">${t.role === "assistant" ? fmtCoach(t.content || "Thinking...") : esc(t.show || t.content)}</div>`).join("")}${TUT.err ? `<div class="tm err">${esc(TUT.err)}</div>` : ""}</div>
    <div class="tquick">${["Next step", "I'm stuck", "Explain it differently", TUT.answered ? "Give me a similar problem" : "Show me the answer"].map(s => `<button class="chipbtn" data-act="tq" data-t="${esc(s)}" ${TUT.busy ? "disabled" : ""}>${esc(s)}</button>`).join("")}</div>
    <form class="tin" data-act="tform"><input id="tinput" placeholder="Type your answer or question" autocomplete="off" ${TUT.busy ? "disabled" : ""}><button class="btn small" ${TUT.busy ? "disabled" : ""}>Send</button></form></section>`;
  const m = $("#tmsgs"); if (m) m.scrollTop = m.scrollHeight;
}
async function tutorSend(text) {
  if (!TUT || TUT.busy || !text.trim()) return;
  if (!SAMPLE) { TUT.err = "Coach needs an internet connection and the online version of this app."; return renderTutor(); }
  const first = TUT.turns.length === 0;
  TUT.turns.push({ role: "user", content: first ? `${COACH_RULES}\n\nQuestion context:\n${TUT.ctx}\n\nLearner: ${text}` : text, show: text });
  const reply = { role: "assistant", content: "" }; TUT.turns.push(reply); TUT.busy = true; TUT.err = null; renderTutor();
  const turns = TUT.turns.slice(0, -1).map(t => ({ role: t.role, content: t.content }));
  const mine = TUT; mine.ctrl = new AbortController();
  try {
    const r = await SAMPLE(turns, { onText: ({ text }) => { if (TUT !== mine) return; reply.content = text; const m = $("#tmsgs"); if (m && m.lastElementChild) { m.lastElementChild.innerHTML = fmtCoach(text); m.scrollTop = m.scrollHeight; } }, signal: mine.ctrl.signal, cache: false });
    reply.content = r.text;
  } catch (e) {
    if (TUT !== mine) return;
    if (e && e.code === "not_granted") { TUTOR_OK = false; mine.err = "Coach wasn't allowed to run. You can keep studying without it."; }
    else if (e && e.code === "rate_limited") mine.err = "Coach is busy. Give it a minute and try again.";
    else if (e && e.code === "cancelled") return;
    else mine.err = "Coach couldn't answer right now. Try again in a moment.";
    if (e && e.text) reply.content = e.text; else mine.turns.pop();
  }
  if (TUT !== mine) return;
  mine.busy = false; renderTutor(); const inp = $("#tinput"); if (inp) inp.focus();
}

  const tr = DT(); const out = [];

  clearInterval(examTimer);
  examTimer = setInterval(() => { if (!ACT || ACT.type !== "exam") return clearInterval(examTimer); const left = ACT.end - Date.now(); if (left <= 0) { clearInterval(examTimer); submitExam(); } else { const el = $("#et"); if (el) el.textContent = fmtTime(left); } }, 500);
  window.scrollTo(0, 0); render();
}
const fmtTime = ms => { const s = Math.ceil(ms / 1000); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
function renderExamRun() {
  const a = ACT, q = a.list[a.i]; const answered = a.ans.filter(x => x != null).length;
  let h = `<div class="play">${head(answered, a.n, "")}<div class="row" style="justify-content:space-between;margin-bottom:10px"><span class="timer" id="et">${fmtTime(a.end - Date.now())}</span><span class="count">Question ${a.i + 1} of ${a.n}</span></div>
    <div class="qcard">${q.ask ? `<p class="ask" style="margin-top:0">${esc(q.ask)}</p>` : ""}<p class="prompt ${q.term ? "term" : ""}">${esc(q.prompt)}</p><div class="opts">` +
    q.options.map((o, i) => `<button class="opt" style="${a.ans[a.i] === i ? "border-color:var(--ink);background:var(--sunk)" : ""}" data-act="eans" data-i="${i}"><span class="k">${i + 1}</span><span>${esc(o)}</span></button>`).join("") + `</div>
    <div class="next" style="justify-content:space-between;flex-wrap:wrap"><button class="btn ghost small" data-act="eflag">${a.flag[a.i] ? "Unflag" : "Flag for review"}</button><span class="row"><button class="btn ghost small" data-act="emove" data-d="-1" ${a.i === 0 ? "disabled" : ""}>Previous</button><button class="btn small" data-act="emove" data-d="1" ${a.i === a.n - 1 ? "disabled" : ""}>Next</button></span></div></div>
    <div class="qnav">${a.list.map((_, i) => `<button class="${a.ans[i] != null ? "ans" : ""} ${i === a.i ? "cur" : ""} ${a.flag[i] ? "flg" : ""}" data-act="ego" data-i="${i}" aria-label="Question ${i + 1}">${i + 1}</button>`).join("")}</div>
    <div class="next"><button class="btn" data-act="esubmit">Submit exam</button></div></div>`;
  app().innerHTML = h;
}
function submitExam() {
  clearInterval(examTimer); const a = ACT; let right = 0; const byD = {}; const missed = [];
  a.list.forEach((q, i) => { const ok = a.ans[i] === q.ans; if (ok) right++; else missed.push(q.item); grade(q.item.id, ok); const d = dom(oOf(q.item, a.tr)); byD[d] = byD[d] || [0, 0]; byD[d][1]++; if (ok) byD[d][0]++; });
  const p = right / a.n; const scaled = Math.round(100 + 900 * p); const passAt = T(a.tr).pass;
  S.exams.push({ at: Date.now(), tr: a.tr, n: a.n, p: Math.round(p * 100), s: scaled });
  const bars = T(a.tr).domains.map(d => { const v = byD[d.n] || [0, 0]; const r = v[1] ? v[0] / v[1] : 0; return `<div class="dbar d${d.n}"><span>${d.n}. ${esc(d.name)}</span><div class="bar"><i style="width:${r * 100}%"></i></div><b>${v[0]}/${v[1]}</b></div>`; }).join("");
  finish({ title: T(a.tr).short + " " + (scaled >= passAt ? "practice exam: passing range" : "practice exam: keep training"), score: right, of: a.n, xp: S.xp - a.xp0,
    note: `<b style="font-family:var(--head);font-size:22px">Approximate scaled score: ${scaled} / 1,000</b> (${passAt} passes). This is a straight-line estimate; the real exam uses scaled scoring across different exam forms.<div style="margin-top:12px">${bars}</div>`, missed, again: "exam", againArg: [a.n, a.tr] });
}

// ---------- events ----------
const AGAIN = { run: () => startRun(), blitz: x => startBlitz(x), match: x => startMatch(x), sort: x => startSort(x), order: x => startOrder(x), scen: x => startScen(x), log: x => startLog(x), drill: x => startDrill(x), quick: x => startQuick(x), fam: x => startFam(x[0], x[1]), lab: x => startLab(x), daily: () => startDaily(), sub: x => startSub(x), cat: x => startCat(x), exam: x => startExam(x[0], x[1]) };
const ACTIONS = {
  nav: d => { ACT = null; VIEW = d.v; SUB.train = null; SUB.subj = null; SUB.quick = null; window.scrollTo(0, 0); render(); },
  welcomed: () => { S.welcomed = true; save(); render(); },
  dloffline: () => downloadOffline(),
  dlbackup: () => downloadBackup(),
  run: d => startRun(d.d),
  track: d => { let s = SEL().slice(); if (s.includes(d.t)) { if (s.length < 2) return toast("Keep at least one exam selected"); s = s.filter(t => t !== d.t); } else s.push(d.t); S.tracks = TRACKS.filter(t => s.includes(t)); save(); render(); },
  maptr: d => { SUB.map = d.t; render(); },
  room: d => { VIEW = "library"; SUB.lib = "obj"; ACT_OPEN = d.o; render(); const el = document.querySelector("details[open]"); if (el) el.scrollIntoView({ block: "start" }); },
  drill1: d => { const dt = DT(); const items = buildRun(i => oOf(i, dt) === d.o, 15, 15); startQuiz("Objective " + d.o + " drill", items); },
  mode: d => { SUB.train = d.m || null; window.scrollTo(0, 0); render(); },
  libtab: d => { SUB.lib = d.t; render(); },
  reset: () => { if (confirm("Erase all progress, XP, and history? This can't be undone.")) { const th = S.theme; S = blank(); S.theme = th; S.resetAt = Date.now(); save(); render(); toast("Progress reset"); } },
  quit: () => { if (ACT && ACT.type === "cat" && !confirm("Leave the simulation? Your answers will be lost.")) return; if (ACT && ACT.type === "exam" && !confirm("Leave the exam? Your answers will be lost.")) return; clearInterval(examTimer); ACT = null; render(); },
  again: () => { const a = ACT; AGAIN[a.again](a.againArg); },
  qans: d => quizAnswer(+d.i), qnext: () => quizNext(),
  blitz: d => startBlitz(d.d), bans: d => blitzAnswer(+d.i),
  match: d => startMatch(+d.i), ml: d => { ACT.sel = d.id; render(); }, mr: d => matchRight(d.id),
  sort: d => startSort(+d.i), si: d => { ACT.sel = +d.i; render(); }, sb: d => sortBucket(+d.i),
  order: d => startOrder(+d.i), op: d => orderPick(d.v),
  scen: d => startScen(+d.i), sc: d => scenPick(+d.k), scnext: () => scenNext(),
  log: d => startLog(+d.i), lg: d => { const i = +d.i; ACT.flags.has(i) ? ACT.flags.delete(i) : ACT.flags.add(i); render(); }, logcheck: () => logCheck(), logdone: () => logDone(),
  lab: d => startLab(+d.i), labstep: d => labToggle("s", +d.i), labclean: d => labToggle("c", +d.i), copy: d => labCopy(+d.i),
  labquiz: () => { const l = ACT.l; startQuiz(l.title + ": quiz", ITEMS.filter(q => q.lab === l.id), { learn: false }); ACT.labIdx = PACK.labs.indexOf(l); },
  hint: () => { ACT.showHint = true; render(); }, dhint: () => { ACT.showHint = true; render(); },
  save: () => { const id = ACT.list[ACT.i].item.id; if (S.saved[id]) delete S.saved[id]; else S.saved[id] = 1; save(); render(); },
  dailygo: () => startDaily(),
  subj: d => { VIEW = "practice"; SUB.train = null; SUB.quick = null; SUB.subj = d.o; window.scrollTo(0, 0); render(); },
  subjback: () => { SUB.subj = null; render(); }, fam: d => startFam(d.o, d.f),
  quick: d => { VIEW = "practice"; SUB.quick = String(+d.i); SUB.quickBack = SUB.subj; render(); window.scrollTo(0, 0); }, quickback: () => { SUB.quick = null; render(); }, quickgo: d => startQuick(+d.i),
  libgo: () => { VIEW = "library"; SUB.lib = "obj"; render(); },
  ctog: d => { const c = SUB.custom; c.secs = c.secs.includes(d.o) ? c.secs.filter(x => x !== d.o) : c.secs.concat(d.o); render(); }, customgo: () => startCustom(), catprev: () => catPrev(),
  tutor: () => openTutor(null, null, "Hi Coach. What should I focus on first to raise my AFQT?"),
  tutorq: () => { const a = ACT, q = a.list[a.i]; openTutor(q, a.picked); }, tutorhelp: () => { const a = ACT, q = a.list[a.i]; openTutor(q, null); },
  tutord: () => { const a = ACT; openTutor(Object.assign({ item: a.d }, a.q), a.picked); },
  tutorclose: () => closeTutor(), tq: d => tutorSend(d.t), subpr: d => startSub(d.o), qmode: d => { S.qmode = d.v; save(); render(); }, cat: d => startCat(d.m), catgo: () => catGo(), catans: d => { ACT.pick = +d.i; render(); }, catnext: () => catNext(),
  drill: d => startDrill(+d.i), dans: d => drillAnswer(+d.i), dnext: () => drillNext(),
  exam: d => startExam(+d.n, d.tr), eans: d => { ACT.ans[ACT.i] = +d.i; render(); }, eflag: () => { ACT.flag[ACT.i] = !ACT.flag[ACT.i]; render(); },
  emove: d => { ACT.i = Math.max(0, Math.min(ACT.n - 1, ACT.i + +d.d)); render(); }, ego: d => { ACT.i = +d.i; render(); },
  esubmit: () => { const un = ACT.ans.filter(x => x == null).length; if (un && !confirm(un + " question(s) unanswered. Submit anyway?")) return; submitExam(); }
};
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.tagName === "SELECT" || b.tagName === "INPUT") return;
  const f = ACTIONS[b.dataset.act]; if (f) { e.preventDefault(); f(b.dataset, b); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.act === "set") { const k = t.dataset.k; S[k] = k === "theme" ? t.value : +t.value; save(); render(); }
  if (t.dataset.act === "examdate") { S.examDate = t.value; save(); render(); }
  if (t.dataset.act === "setp") { S[t.dataset.k] = t.value; save(); render(); }
  if (t.dataset.act === "cset") { const k = t.dataset.k; SUB.custom[k] = k === "n" ? +t.value : t.value === "1"; render(); }

});
document.addEventListener("submit", e => { const f = e.target.closest("[data-act=tform]"); if (!f) return; e.preventDefault(); const inp = $("#tinput"); const v = inp ? inp.value : ""; if (v.trim()) tutorSend(v); });
document.addEventListener("keydown", e => {
  if (TUT) { if (e.key === "Escape") closeTutor(); return; }
  if (!ACT || ["INPUT","SELECT","BUTTON","SUMMARY"].includes(e.target.tagName) && (e.key === "Enter" || e.key === " ")) return;
  if (["INPUT","SELECT"].includes(e.target.tagName)) return;
  const n = parseInt(e.key, 10);
  const t = ACT.type;
  if (n >= 1 && n <= 6) {
    if (t === "quiz" && !ACT.list[ACT.i].learn && !ACT.answered && n <= ACT.list[ACT.i].options.length) return quizAnswer(n - 1);
    if (t === "blitz" && n <= ACT.q.options.length) return blitzAnswer(n - 1);
    if (t === "drill" && !ACT.answered && n <= 4) return drillAnswer(n - 1);
    if (t === "cat" && ACT.phase === "q" && n <= ACT.secs[ACT.si].qs[ACT.qi].options.length) { ACT.pick = n - 1; return render(); }
    if (t === "exam" && n <= ACT.list[ACT.i].options.length) { ACT.ans[ACT.i] = n - 1; return render(); }
    if (t === "scen" && !ACT.solved && n <= ACT.choices.length) return scenPick(ACT.choices[n - 1]);
  }
  if (e.key === "Enter" || e.key === " ") {
    if (t === "quiz" && (ACT.answered || ACT.list[ACT.i].learn)) { e.preventDefault(); return quizNext(); }
    if (t === "drill" && ACT.answered) { e.preventDefault(); return drillNext(); }
    if (t === "cat") { e.preventDefault(); return ACT.phase === "intro" ? catGo() : catNext(); }
    if (t === "scen" && ACT.solved) { e.preventDefault(); return scenNext(); }
  }
});

render();
if (!HOSTED_EMBED && /^https?:$/.test(location.protocol) && "serviceWorker" in navigator && window.top === window) {
  fetch("manifest.webmanifest", { method: "HEAD" }).then(r => {

    add("manifest", "manifest.webmanifest"); add("apple-touch-icon", "icon-192.png");
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }).catch(() => {});
}
window.__game = { ITEMS, S: () => S, PACK }; // for debugging
})();

</script>
