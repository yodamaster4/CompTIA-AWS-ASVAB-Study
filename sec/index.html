SCN("ransom", "4.8", "Ransomware at the clinic",
"Monday, 7:40 AM. Front desk staff at a medical clinic report that files on the shared drive now end in .locked, and a ransom note is on the desktop of PC-FRONT2.",
[
 ["Ransomware is confirmed. What is your first move?", [
  ["Disconnect PC-FRONT2 and the file server from the network", true, "Containment first. Isolating infected hosts stops the encryption from spreading."],
  ["Pay the ransom to get files back quickly", false, "Paying funds criminals and does not guarantee recovery. It's never the first step."],
  ["Reimage PC-FRONT2 right away", false, "Too early. You would destroy evidence and still not stop spread from other infected hosts."],
  ["Email all staff instructions as an attachment", false, "Slow, and attachments are exactly what staff should distrust right now."]]],
 ["Before anyone powers down PC-FRONT2, forensics wants to preserve evidence. What should they capture first?", [
  ["The contents of RAM", true, "Order of volatility: memory is lost at power-off and may hold encryption keys and malware."],
  ["A full image of the hard drive", false, "Important, but the disk survives power-off. RAM does not, so it goes first."],
  ["Last week's backup tapes", false, "Backups are the least volatile evidence."],
  ["A photo of the ransom note", false, "Useful, but it does not disappear when power is cut."]]],
 ["You hand the memory capture to the forensics lab. What must be documented at the handoff?", [
  ["Chain of custody", true, "Every person who handles evidence, when, and why, must be recorded to keep it admissible."],
  ["Legal hold", false, "A legal hold preserves data for litigation; it does not track who handled evidence."],
  ["Root cause analysis", false, "That comes later, in lessons learned."],
  ["Service level agreement", false, "An SLA is a vendor performance contract."]]],
 ["Malware is removed. You restore patient files from last night's offline backup and bring systems back online while watching them closely. Which phase is this?", [
  ["Recovery", true, "Restoring systems to normal operation and monitoring them is recovery."],
  ["Eradication", false, "Eradication is removing the malware and attacker access, which already happened."],
  ["Containment", false, "Containment was isolating the hosts."],
  ["Preparation", false, "Preparation happens before incidents."]]],
 ["Two weeks later, the team finds a user opened a fake invoice attachment. What is the best improvement from lessons learned?", [
  ["Add email attachment filtering and run phishing awareness campaigns", true, "Fix the root cause: better filtering (technical) plus training (operational)."],
  ["Fire the user", false, "Punishment does not fix the underlying weakness and discourages reporting."],
  ["Disable email for the clinic", false, "Not realistic for business operations."],
  ["Do nothing, since systems are restored", false, "Skipping lessons learned means it will happen again."]]]
]);

SCN("bec", "2.2", "The urgent wire transfer",
"Accounts payable receives an email from 'CEO <ceo@examp1e-corp.com>': 'Wire $48,000 to our new vendor today. I'm in meetings all day, don't call, just handle it.'",
[
 ["What is this most likely?", [
  ["Business email compromise", true, "Impersonating an executive to redirect money is BEC. Urgency plus 'don't call' are classic signs."],
  ["Watering hole attack", false, "That compromises a website the victims visit."],
  ["Vishing", false, "Vishing uses phone calls."],
  ["Smishing", false, "Smishing uses SMS."]]],
 ["What should the clerk do?", [
  ["Verify by calling the CEO at a known phone number", true, "Out-of-band verification through a trusted channel defeats BEC."],
  ["Reply to the email asking if it's real", false, "The attacker controls that mailbox and will say yes."],
  ["Send the wire, it's the CEO", false, "This is exactly what the attacker wants."],
  ["Forward it to a personal account to review later", false, "That moves company data to an unmanaged account."]]],
 ["The sender domain uses a 1 instead of an l. What technique is that?", [
  ["Typosquatting", true, "Registering look-alike domains is typosquatting."],
  ["DNS poisoning", false, "That corrupts DNS resolution; here the domain is simply different."],
  ["Pretexting", false, "Pretexting is the cover story (in meetings), not the domain trick."],
  ["Brand impersonation", false, "Close, but the specific look-alike domain trick is typosquatting."]]],
 ["Which control helps other mail servers reject email that spoofs your real domain?", [
  ["DMARC with SPF and DKIM", true, "SPF and DKIM authenticate mail; DMARC tells receivers to reject failures."],
  ["WPA3", false, "That secures Wi-Fi."],
  ["802.1X", false, "That authenticates devices on network ports."],
  ["Tokenization", false, "That protects stored data."]]],
 ["What should the company do long-term to reduce this risk?", [
  ["Run simulated phishing campaigns and require payment verification procedures", true, "Awareness training plus a mandatory call-back procedure address both people and process."],
  ["Block all external email", false, "Not practical for business."],
  ["Only allow the CEO to send email", false, "Doesn't address the attack."],
  ["Change the CEO's password monthly", false, "The CEO's account was never compromised here; the domain was faked."]]]
]);

SCN("travel", "2.4", "Two cities, nine minutes",
"SIEM alert: user dana.k signed in to webmail from Pittsburgh at 9:02 AM and from Sao Paulo at 9:11 AM. There's no travel on file.",
[
 ["What indicator did the SIEM detect?", [
  ["Impossible travel", true, "Nobody can be in both places nine minutes apart. Credentials are likely stolen."],
  ["Out-of-cycle logging", false, "That's logging at unusual times."],
  ["Resource consumption", false, "That's CPU, memory, or bandwidth spikes."],
  ["Account lockout", false, "The account wasn't locked; both logins succeeded."]]],
 ["What's the best immediate action?", [
  ["Revoke active sessions and force a password reset", true, "Cut off the attacker's access right away, then investigate."],
  ["Wait to see if it happens again", false, "Waiting gives the attacker time to do damage."],
  ["Permanently delete Dana's account", false, "Destroys evidence and disrupts the real user."],
  ["Email Dana a new password", false, "If the mailbox is compromised, the attacker reads it."]]],
 ["Dana admits she typed her password into a fake login page yesterday. Which MFA method best resists this?", [
  ["A FIDO2 hardware security key", true, "Security keys are bound to the real site, so a fake page cannot capture a reusable code."],
  ["SMS codes", false, "SMS codes can be phished or intercepted by SIM swapping."],
  ["Security questions", false, "Those are just more 'something you know'."],
  ["A longer password", false, "Still something you know, still phishable."]]],
 ["The company wants logins from unusual locations to require extra verification automatically. What concept is this?", [
  ["Adaptive identity (conditional access)", true, "Evaluating context like location and device before granting access."],
  ["Discretionary access control", false, "DAC lets data owners grant access."],
  ["Mandatory access control", false, "MAC uses classification labels."],
  ["Password complexity rules", false, "Those don't consider context."]]]
]);

SCN("dmz", "3.2", "Build the firewall rules",
"You're setting up a public web store. There's a web server, a database server, and an internal LAN. Customers must reach the store over HTTPS only.",
[
 ["Where should the web server live?", [
  ["In the screened subnet (DMZ)", true, "Public-facing servers go in the screened subnet, separated from internal systems."],
  ["On the internal LAN", false, "A compromise would give attackers a foothold inside."],
  ["On the same VLAN as the database", false, "Removes the separation that protects the database."],
  ["Outside the firewall entirely", false, "No protection at all."]]],
 ["Which inbound rule should allow customers to the store?", [
  ["ALLOW TCP any -> web:443", true, "Only HTTPS to only the web server. Minimum needed."],
  ["ALLOW any any -> web:any", false, "Opens every port. Violates least privilege."],
  ["ALLOW TCP any -> web:23", false, "Port 23 is Telnet, unencrypted remote shell."],
  ["ALLOW TCP any -> db:1433", false, "The database must never be reachable from the internet."]]],
 ["The database (on the internal network) should accept connections from:", [
  ["Only the web server's IP, on the database port", true, "Tightly scoped rule: one source, one port."],
  ["Anyone on port 1433", false, "Far too broad."],
  ["All DMZ hosts on all ports", false, "Still too broad; only the web server needs it."],
  ["The internet on port 3306", false, "Never expose the database to the internet."]]],
 ["What rule belongs at the very bottom of the ACL?", [
  ["DENY any any (deny all)", true, "Anything not explicitly allowed is blocked. Most firewalls have an implicit deny."],
  ["ALLOW any any", false, "That would override all your careful rules."],
  ["ALLOW ICMP any", false, "Not needed for the store and not a catch-all."],
  ["No rule is needed", false, "The deny-all (explicit or implicit) is essential."]]],
 ["Admins need SSH to the web server. What's the best approach?", [
  ["Allow TCP 22 only from a hardened jump server", true, "A jump server limits admin access to one controlled, monitored path."],
  ["Allow TCP 22 from anywhere", false, "Exposes SSH to the whole internet."],
  ["Use Telnet on port 23 instead", false, "Telnet sends credentials in plaintext."],
  ["Open RDP 3389 to the internet", false, "Exposed RDP is a top ransomware entry point."]]]
]);

SCN("vendor", "5.3", "Choosing a payroll vendor",
"HR wants to move payroll to a SaaS vendor. The vendor will store employee names, addresses, bank details, and Social Security numbers.",
[
 ["Before signing, what should you do first?", [
  ["Perform due diligence: questionnaire plus evidence of independent audits", true, "Assess the vendor's security posture before trusting them with sensitive data."],
  ["Sign now and review later", false, "Once data is shared, it's too late."],
  ["Run a penetration test against the vendor without permission", false, "Unauthorized testing is illegal."],
  ["Ask HR if they like the vendor", false, "Preference isn't a security assessment."]]],
 ["You want the contract to let you verify their security in the future. What clause?", [
  ["Right-to-audit clause", true, "It gives you the right to inspect their controls."],
  ["Non-compete clause", false, "Unrelated to security verification."],
  ["Force majeure clause", false, "Covers unforeseeable events."],
  ["NDA", false, "Covers confidentiality, not audits."]]],
 ["Which document should specify 99.9% uptime and penalties if missed?", [
  ["SLA", true, "The service level agreement defines measurable performance."],
  ["MOU", false, "Non-binding intent only."],
  ["BPA", false, "Partner profit and responsibility sharing."],
  ["SOW", false, "Specific project deliverables."]]],
 ["In this SaaS model, who is responsible for managing which of your employees can log in and what they can see?", [
  ["Your company (the customer)", true, "In SaaS the provider runs the app, but the customer manages its users, access, and data."],
  ["The SaaS vendor", false, "The vendor secures the platform, not your user permissions."],
  ["The cloud hosting provider", false, "They're even further removed."],
  ["Nobody", false, "Access management is always someone's job."]]],
 ["The vendor stores data in another country. What concern should you raise?", [
  ["Data sovereignty", true, "Data stored abroad falls under that country's laws."],
  ["Data masking", false, "A protection technique, not a legal concern."],
  ["Key escrow", false, "Not related to where data is stored."],
  ["Load balancing", false, "Availability, not legal jurisdiction."]]]
]);

SCN("wifi", "4.1", "Wi-Fi for the new branch",
"You're setting up wireless for a new 40-person branch office. Employees need secure access, and visitors need internet.",
[
 ["What should happen before mounting any access points?", [
  ["A site survey with a heat map", true, "Plan placement, coverage, and interference first."],
  ["Buy the cheapest APs", false, "Planning comes first."],
  ["Enable WEP for compatibility", false, "WEP is broken and should never be used."],
  ["Disable the building's firewall", false, "Never."]]],
 ["Which setup is most secure for employees?", [
  ["WPA3-Enterprise with 802.1X and RADIUS", true, "Each user authenticates individually; no shared password."],
  ["WPA2-Personal with one password on a sticky note", false, "A shared, visible password is weak."],
  ["WEP", false, "Easily cracked."],
  ["Open network with a captive portal", false, "No encryption over the air."]]],
 ["Someone sets up an AP in the parking lot broadcasting your SSID. What is it?", [
  ["Evil twin", true, "A rogue AP impersonating a legitimate SSID."],
  ["Jamming", false, "Jamming disrupts signals; it doesn't impersonate."],
  ["Bluesnarfing", false, "That's Bluetooth data theft."],
  ["Replay attack", false, "Reusing captured traffic."]]],
 ["How should visitor internet access be handled?", [
  ["A separate guest network isolated from the corporate network", true, "Segmentation keeps visitors away from internal systems."],
  ["Give visitors the employee credentials", false, "Shares access to internal resources."],
  ["Plug visitors into the server VLAN", false, "The worst possible place."],
  ["Turn off Wi-Fi when visitors arrive", false, "Not practical."]]]
]);

SCN("flood", "5.2", "Should we buy the flood wall?",
"A warehouse server and its equipment are valued at $120,000. A flood would destroy 50% of it. Floods are expected about once every 4 years.",
[
 ["What is the single loss expectancy (SLE)?", [
  ["$60,000", true, "SLE = asset value x exposure factor = 120,000 x 0.50."],
  ["$120,000", false, "That's the full asset value; only 50% would be lost."],
  ["$30,000", false, "That's SLE x 0.5 again. Check your math."],
  ["$15,000", false, "That's the ALE."]]],
 ["What is the annualized rate of occurrence (ARO)?", [
  ["0.25", true, "Once every 4 years = 1 / 4 = 0.25 per year."],
  ["4", false, "That's the number of years, not the yearly rate."],
  ["0.5", false, "That would be once every 2 years."],
  ["1", false, "That would be every year."]]],
 ["What is the annualized loss expectancy (ALE)?", [
  ["$15,000", true, "ALE = SLE x ARO = 60,000 x 0.25."],
  ["$60,000", false, "That's the SLE."],
  ["$240,000", false, "You multiplied by 4 instead of 0.25."],
  ["$30,000", false, "Check the ARO."]]],
 ["A flood barrier costs $40,000 per year. What's the most sensible decision?", [
  ["Don't buy it; consider insurance (transfer) or accepting the risk", true, "Spending $40,000 a year to prevent $15,000 a year in expected loss isn't cost-justified."],
  ["Buy it; any protection is worth it", false, "Controls should cost less than the risk they reduce."],
  ["Move the whole company to avoid floods", false, "Avoidance at a cost far beyond the risk."],
  ["Ignore it without documenting anything", false, "Acceptance must be a documented decision."]]]
]);

// risk math
const money = n => "$" + Math.round(n).toLocaleString("en-US");
function riskRound() {
  const AV = shuffle([40000, 60000, 80000, 100000, 120000, 150000, 200000, 250000, 400000, 500000])[0];
  const EF = shuffle([10, 20, 25, 40, 50, 75, 100])[0];
  const freq = shuffle([[0.1, "once every 10 years"], [0.2, "once every 5 years"], [0.25, "once every 4 years"], [0.5, "once every 2 years"], [1, "once a year"], [2, "twice a year"], [3, "three times a year"]])[0];
  const SLE = AV * EF / 100, ALE = SLE * freq[0];
  const kind = shuffle(["SLE", "ARO", "ALE", "ALE"])[0];
  const stem = `An asset is worth ${money(AV)}. A threat would destroy ${EF}% of its value. The threat is expected ${freq[1]}.`;
  let prompt, right, wrongs;
  if (kind === "SLE") { prompt = "What is the SLE?"; right = money(SLE); wrongs = [money(AV), money(ALE), money(AV * freq[0])]; }
  if (kind === "ARO") { prompt = "What is the ARO?"; right = String(freq[0]); wrongs = ["" + (1 / freq[0]), "" + (freq[0] * 2), "" + EF / 100]; }
  if (kind === "ALE") { prompt = "What is the ALE?"; right = money(ALE); wrongs = [money(SLE), money(AV * freq[0]), money(SLE / Math.max(freq[0], 0.01))]; }
  const opts = [right]; const fillers = [money(ALE * 2 + 1000), money(SLE * 1.5), "0.75", money(AV * 0.1)];
  [...wrongs, ...fillers].forEach(w => { if (opts.length < 4 && !opts.includes(w)) opts.push(w); });
  const sh = shuffle(opts);
  return { stem, prompt, options: sh, ans: sh.indexOf(right), explain: `SLE = ${money(AV)} x ${EF}% = ${money(SLE)}. ARO = ${freq[0]} (${freq[1]}). ALE = ${money(SLE)} x ${freq[0]} = ${money(ALE)}.` };
}
function startRisk() { ACT = { type: "risk", n: 0, total: 5, score: 0, q: riskRound(), answered: false, xp0: S.xp }; render(); }
function renderRisk() {
  const a = ACT, q = a.q;
  let h = `<div class="play">${head(a.n, a.total)}<div class="qcard"><div class="row">${chip("5.2","5.2")}</div><p style="margin:14px 0 6px;font-size:19px">${esc(q.stem)}</p><p class="prompt"><b>${esc(q.prompt)}</b></p>${optsHtml(q, a.answered ? a.picked : null, "rans")}`;
  if (a.answered) h += `<div class="feedback ${a.picked === q.ans ? "" : "no"}"><h4>${a.picked === q.ans ? "Correct" : "Not quite"}</h4><p>${esc(q.explain)}</p><div class="hook"><b>Memory hook:</b> Single = one hit (AV x EF). Annual = single x how often per year.</div></div><div class="next"><button class="btn" data-act="rnext">Next</button></div>`;
  app().innerHTML = h + `</div></div>`;
}
function riskAnswer(i) { const a = ACT; if (a.answered) return; a.answered = true; a.picked = i; const ok = i === a.q.ans; if (ok) a.score++; objStat({ o: "5.2", o8: "5.2" }, ok); addXP(ok ? 8 : 1); touchDay(); save(); render(); }
function riskNext() { const a = ACT; a.n++; if (a.n >= a.total) { S.best.risk = Math.max(S.best.risk || 0, a.score); return finish({ title: "Risk math drill", score: a.score, of: a.total, xp: S.xp - a.xp0, tip: "SLE = AV x EF. ALE = SLE x ARO. Once every N years means ARO = 1/N.", again: "risk" }); } a.answered = false; a.q = riskRound(); render(); }

// practice exam
function startExam(n, tr) {
  tr = tr || (TRK() === "both" ? "v7" : TRK());
  const qs = [];
  T(tr).domains.forEach(d => {
    const k = Math.round(n * d.w / 100);
    const mc = shuffle(ITEMS.filter(i => i.kind === "mcq" && oOf(i, tr) && dom(oOf(i, tr)) === d.n));
    const cd = shuffle(CARDS.filter(i => oOf(i, tr) && dom(oOf(i, tr)) === d.n));
    qs.push(...mc.slice(0, Math.ceil(k * 0.7)).concat(cd).slice(0, k));
  });
  const list = shuffle(qs).map(it => makeQ(it, it.kind === "card" ? Math.random() < 0.7 : null));
  ACT = { type: "exam", tr, n: list.length, list, ans: Array(list.length).fill(null), flag: Array(list.length).fill(false), i: 0, end: Date.now() + list.length * 60000, xp0: S.xp };
  clearInterval(examTimer);
  examTimer = setInterval(() => { if (!ACT || ACT.type !== "exam") return clearInterval(examTimer); const left = ACT.end - Date.now(); if (left <= 0) { clearInterval(examTimer); submitExam(); } else { const el = $("#et"); if (el) el.textContent = fmtTime(left); } }, 500);
  window.scrollTo(0, 0); render();
}
const fmtTime = ms => { const s = Math.ceil(ms / 1000); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
function renderExamRun() {
  const a = ACT, q = a.list[a.i]; const answered = a.ans.filter(x => x != null).length;
  let h = `<div class="play">${head(answered, a.n, "")}<div class="row" style="justify-content:space-between;margin-bottom:10px"><span class="timer" id="et">${fmtTime(a.end - Date.now())}</span><span class="count">Question ${a.i + 1} of ${a.n}</span></div>
    <div class="qcard">${q.ask ? `<p class="ask" style="margin-top:0">${esc(q.ask)}</p>` : ""}<p class="prompt ${q.term ? "term" : ""}">${esc(q.prompt)}</p><div class="opts">` +
    q.options.map((o, i) => `<button class="opt" style="${a.ans[a.i] === i ? "border-color:var(--ink);background:var(--sunk)" : ""}" data-act="eans" data-i="${i}"><span class="k">${i + 1}</span><span>${esc(o)}</span></button>`).join("") + `</div>
    <div class="next" style="justify-content:space-between;flex-wrap:wrap"><button class="btn ghost small" data-act="eflag">${a.flag[a.i] ? "Unflag" : "Flag for review"}</button><span class="row"><button class="btn ghost small" data-act="emove" data-d="-1" ${a.i === 0 ? "disabled" : ""}>Previous</button><button class="btn small" data-act="emove" data-d="1" ${a.i === a.n - 1 ? "disabled" : ""}>Next</button></span></div></div>
    <div class="qnav">${a.list.map((_, i) => `<button class="${a.ans[i] != null ? "ans" : ""} ${i === a.i ? "cur" : ""} ${a.flag[i] ? "flg" : ""}" data-act="ego" data-i="${i}" aria-label="Question ${i + 1}">${i + 1}</button>`).join("")}</div>
    <div class="next"><button class="btn" data-act="esubmit">Submit exam</button></div></div>`;
  app().innerHTML = h;
}
function submitExam() {
  clearInterval(examTimer); const a = ACT; let right = 0; const byD = {}; const missed = [];
  a.list.forEach((q, i) => { const ok = a.ans[i] === q.ans; if (ok) right++; else missed.push(q.item); grade(q.item.id, ok); const d = dom(oOf(q.item, a.tr)); byD[d] = byD[d] || [0, 0]; byD[d][1]++; if (ok) byD[d][0]++; });
  const p = right / a.n; const scaled = Math.round(100 + 800 * p);
  S.exams.push({ at: Date.now(), tr: a.tr, n: a.n, p: Math.round(p * 100), s: scaled });
  const bars = T(a.tr).domains.map(d => { const v = byD[d.n] || [0, 0]; const r = v[1] ? v[0] / v[1] : 0; return `<div class="dbar d${d.n}"><span>${d.n}. ${esc(d.name)}</span><div class="bar"><i style="width:${r * 100}%"></i></div><b>${v[0]}/${v[1]}</b></div>`; }).join("");
  finish({ title: (a.tr === "v8" ? "V8 " : "V7 ") + (scaled >= 750 ? "practice exam: passing range" : "practice exam: keep training"), score: right, of: a.n, xp: S.xp - a.xp0,
    note: `<b style="font-family:var(--head);font-size:22px">Approximate scaled score: ${scaled} / 900</b> (750 passes). This is a straight-line estimate; the real exam weights questions by difficulty.<div style="margin-top:12px">${bars}</div>`, missed, again: "exam", againArg: [a.n, a.tr] });
}

// ---------- events ----------
const AGAIN = { run: () => startRun(), blitz: x => startBlitz(x), match: x => startMatch(x), sort: x => startSort(x), order: x => startOrder(x), scen: x => startScen(x), log: x => startLog(x), risk: () => startRisk(), exam: x => startExam(x[0], x[1]) };
const ACTIONS = {
  nav: d => { ACT = null; VIEW = d.v; SUB.train = null; window.scrollTo(0, 0); render(); },
  welcomed: () => { S.welcomed = true; save(); render(); },
  dloffline: () => downloadOffline(),
  dlbackup: () => downloadBackup(),
  run: d => startRun(d.d),
  v8new: () => startRun("v8new"),
  track: d => { S.track = d.t; if (d.t !== "both") SUB.map = d.t; save(); render(); },
  maptr: d => { SUB.map = d.t; render(); },
  room: d => { VIEW = "library"; SUB.lib = "obj"; ACT_OPEN = d.o; render(); const el = document.querySelector("details[open]"); if (el) el.scrollIntoView({ block: "start" }); },
  drill: d => { const dt = DT(); const items = buildRun(i => oOf(i, dt) === d.o, 15, 15); startQuiz("Objective " + d.o + " drill", items); },
  mode: d => { SUB.train = d.m || null; window.scrollTo(0, 0); render(); },
  libtab: d => { SUB.lib = d.t; render(); },
  reset: () => { if (confirm("Erase all progress, XP, and history? This can't be undone.")) { const th = S.theme; S = blank(); S.theme = th; S.resetAt = Date.now(); save(); render(); toast("Progress reset"); } },
  quit: () => { if (ACT && ACT.type === "exam" && !confirm("Leave the exam? Your answers will be lost.")) return; clearInterval(examTimer); ACT = null; render(); },
  again: () => { const a = ACT; AGAIN[a.again](a.againArg); },
  qans: d => quizAnswer(+d.i), qnext: () => quizNext(),
  blitz: d => startBlitz(d.d), bans: d => blitzAnswer(+d.i),
  match: d => startMatch(+d.i), ml: d => { ACT.sel = d.id; render(); }, mr: d => matchRight(d.id),
  sort: d => startSort(+d.i), si: d => { ACT.sel = +d.i; render(); }, sb: d => sortBucket(+d.i),
  order: d => startOrder(+d.i), op: d => orderPick(d.v),
  scen: d => startScen(+d.i), sc: d => scenPick(+d.k), scnext: () => scenNext(),
  log: d => startLog(+d.i), lg: d => { const i = +d.i; ACT.flags.has(i) ? ACT.flags.delete(i) : ACT.flags.add(i); render(); }, logcheck: () => logCheck(), logdone: () => logDone(),
  risk: () => startRisk(), rans: d => riskAnswer(+d.i), rnext: () => riskNext(),
  exam: d => startExam(+d.n, d.tr), eans: d => { ACT.ans[ACT.i] = +d.i; render(); }, eflag: () => { ACT.flag[ACT.i] = !ACT.flag[ACT.i]; render(); },
  emove: d => { ACT.i = Math.max(0, Math.min(ACT.n - 1, ACT.i + +d.d)); render(); }, ego: d => { ACT.i = +d.i; render(); },
  esubmit: () => { const un = ACT.ans.filter(x => x == null).length; if (un && !confirm(un + " question(s) unanswered. Submit anyway?")) return; submitExam(); }
};
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.tagName === "SELECT" || b.tagName === "INPUT") return;
  const f = ACTIONS[b.dataset.act]; if (f) { e.preventDefault(); f(b.dataset, b); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.act === "set") { const k = t.dataset.k; S[k] = k === "theme" ? t.value : +t.value; save(); render(); }
  if (t.dataset.act === "examdate") { S.examDate = t.value; save(); render(); }
  if (t.dataset.act === "importfile" && t.files && t.files[0]) { importBackup(t.files[0]); t.value = ""; }
});
document.addEventListener("keydown", e => {
  if (!ACT || ["INPUT","SELECT","BUTTON","SUMMARY"].includes(e.target.tagName) && (e.key === "Enter" || e.key === " ")) return;
  if (["INPUT","SELECT"].includes(e.target.tagName)) return;
  const n = parseInt(e.key, 10);
  const t = ACT.type;
  if (n >= 1 && n <= 6) {
    if (t === "quiz" && !ACT.list[ACT.i].learn && !ACT.answered && n <= ACT.list[ACT.i].options.length) return quizAnswer(n - 1);
    if (t === "blitz" && n <= ACT.q.options.length) return blitzAnswer(n - 1);
    if (t === "risk" && !ACT.answered && n <= 4) return riskAnswer(n - 1);
    if (t === "exam" && n <= ACT.list[ACT.i].options.length) { ACT.ans[ACT.i] = n - 1; return render(); }
    if (t === "scen" && !ACT.solved && n <= ACT.choices.length) return scenPick(ACT.choices[n - 1]);
  }
  if (e.key === "Enter" || e.key === " ") {
    if (t === "quiz" && (ACT.answered || ACT.list[ACT.i].learn)) { e.preventDefault(); return quizNext(); }
    if (t === "risk" && ACT.answered) { e.preventDefault(); return riskNext(); }
    if (t === "scen" && ACT.solved) { e.preventDefault(); return scenNext(); }
  }
});

render();
if (!HOSTED_EMBED && /^https?:$/.test(location.protocol) && "serviceWorker" in navigator && window.top === window) {
  fetch("manifest.webmanifest", { method: "HEAD" }).then(r => {
    if (!r.ok) return;
    const add = (rel, href) => { const l = document.createElement("link"); l.rel = rel; l.href = href; document.head.appendChild(l); };
    add("manifest", "manifest.webmanifest"); add("apple-touch-icon", "icon-192.png");
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }).catch(() => {});
}
window.__secplus = { ITEMS, S: () => S, PACK }; // for debugging
})();
