<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#13223B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sec+ Ops">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sec+ Ops: Security+ SY0-701 and SY0-801 training game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --sunk:#E3E8EF; --ink:#13223B; --muted:#56657C; --line:#CDD5E0;
  --accent:#F2B233; --accent-ink:#13223B; --ok:#1C7F52; --ok-bg:#DDF2E7; --bad:#B83434; --bad-bg:#F8E1E1;
  --d1:#3566AE; --d2:#BC4E32; --d3:#6650A6; --d4:#177F72; --d5:#86741A;
  --head:"Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono:ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:10px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0E1827; --surface:#162438; --sunk:#1D2E46; --ink:#E6ECF4; --muted:#9BAAC0; --line:#2B3D57;
  --accent:#F5BC4A; --accent-ink:#13223B; --ok:#4CC58A; --ok-bg:#153A2B; --bad:#F07A7A; --bad-bg:#43202A;
  --d1:#6F9FE6; --d2:#E88468; --d3:#A08CDD; --d4:#49C1B0; --d5:#D2BE58;
}}
:root[data-theme="dark"]{
  --bg:#0E1827; --surface:#162438; --sunk:#1D2E46; --ink:#E6ECF4; --muted:#9BAAC0; --line:#2B3D57;
  --accent:#F5BC4A; --accent-ink:#13223B; --ok:#4CC58A; --ok-bg:#153A2B; --bad:#F07A7A; --bad-bg:#43202A;
  --d1:#6F9FE6; --d2:#E88468; --d3:#A08CDD; --d4:#49C1B0; --d5:#D2BE58;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,label.btn{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overflow-wrap:anywhere}
button:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--head);line-height:1.15;margin:0}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:18px;min-height:62px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--head);font-weight:700;font-size:21px;letter-spacing:.01em;background:none;border:0;padding:0}
.badge{width:34px;height:34px;border-radius:8px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:14px;font-weight:700}
.nav{display:flex;gap:4px;margin-left:8px}
.nav button{background:none;border:0;padding:8px 14px;border-radius:8px;font-family:var(--head);font-weight:600;font-size:16px;color:var(--muted)}
.nav button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:inset 0 -3px 0 var(--accent)}
.stats{margin-left:auto;display:flex;gap:16px;align-items:center;font-size:14px;color:var(--muted)}
.stats b{font-family:var(--head);font-size:18px;color:var(--ink);font-weight:700}
.stat{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}
.bnav{display:none}
@media (max-width:760px){
  .nav{display:none}
  .stats .hide-sm{display:none}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .bnav button{flex:1;background:none;border:0;padding:10px 4px;font-family:var(--head);font-weight:600;font-size:15px;color:var(--muted);border-radius:8px}
  .bnav button[aria-current="page"]{color:var(--ink);background:var(--sunk)}
  main{padding-bottom:84px}
  body.playing .bnav{display:none}
}
main{padding:26px 0 60px}
.brand,.stat{white-space:nowrap}
@media (max-width:760px){.top .wrap{gap:10px;min-height:56px}.brand{font-size:18px;gap:8px}.badge{width:30px;height:30px;font-size:13px}.stats{gap:12px;font-size:11.5px}.stats b{font-size:15px}.wrap{padding:0 14px}.qcard{padding:18px}.qcard .prompt{font-size:19px}.qcard .prompt.term{font-size:26px}.today h1{font-size:28px}}
@media (max-width:360px){.brand{font-size:0;gap:0}.brand .badge{font-size:13px}}
@media (hover:none){.keyhint{display:none}}

/* generic */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--ink);background:var(--accent);color:var(--accent-ink);font-family:var(--head);font-weight:700;font-size:17px;padding:11px 20px;border-radius:9px;min-height:46px}
.btn:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.small{font-size:15px;padding:7px 14px;min-height:38px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.muted{color:var(--muted)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:3px 9px;border-radius:99px;background:color-mix(in srgb,var(--dc,var(--muted)) 16%,transparent);color:var(--dc,var(--muted));max-width:100%;line-height:1.3}
.d1{--dc:var(--d1)}.d2{--dc:var(--d2)}.d3{--dc:var(--d3)}.d4{--dc:var(--d4)}.d5{--dc:var(--d5)}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:34px 0 14px}
.sechead h2{font-size:24px}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:18px}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--dc,var(--accent));border-radius:99px;transition:width .4s}

/* HQ */
.today h1{font-size:32px;margin-bottom:6px}
.today .counts{display:flex;gap:22px;margin:14px 0 18px}
.today .counts div{font-size:14px;color:var(--muted)}
.today .counts b{display:block;font-family:var(--head);font-size:30px;color:var(--ink)}
.focus{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.focus button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:14px;font-weight:700;color:var(--dc,var(--ink))}
.focus button:hover{border-color:var(--dc,var(--ink))}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi b{display:block;font-family:var(--head);font-size:28px;font-weight:700}
.kpi span{font-size:14px;color:var(--muted)}
.spark{display:flex;gap:4px;align-items:flex-end;height:44px;margin-top:10px}
.spark i{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:3px;opacity:.9}
.spark i.zero{background:var(--line)}

/* floor plan: the facility map */
.plan{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;padding:16px;background:var(--surface);border:2px solid var(--ink);border-radius:4px;position:relative;
  background-image:linear-gradient(var(--sunk) 1px,transparent 1px),linear-gradient(90deg,var(--sunk) 1px,transparent 1px);background-size:22px 22px}
.wing{border:2px solid var(--dc);background:var(--surface);border-radius:3px;padding:12px;display:flex;flex-direction:column;gap:10px}
.wing.w1{grid-column:span 4}.wing.w2{grid-column:span 8}.wing.w3{grid-column:span 4}.wing.w4{grid-column:span 8}.wing.w5{grid-column:span 12}
@media (max-width:860px){.plan{grid-template-columns:1fr}.wing.w1,.wing.w2,.wing.w3,.wing.w4,.wing.w5{grid-column:auto;grid-row:auto}}
.wing header{display:flex;align-items:baseline;gap:10px}
.wing header .num{font-family:var(--head);font-weight:700;font-size:26px;color:var(--dc);line-height:1}
.wing header h3{font-size:16px}
.wing header .w{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.room{--m:0;position:relative;text-align:left;border:1.5px solid color-mix(in srgb,var(--dc) 55%,var(--line));border-radius:3px;padding:8px 9px 9px;min-height:74px;
  background:linear-gradient(to top,color-mix(in srgb,var(--dc) 32%,transparent) calc(var(--m) * 100%),var(--surface) calc(var(--m) * 100%));display:flex;flex-direction:column;gap:2px}
.room:hover{border-color:var(--dc)}
.room .rn{font-family:var(--head);font-weight:700;font-size:15px;color:var(--dc)}
.room .rt{font-size:13.5px;line-height:1.25}
.room .rp{margin-top:auto;font-size:12px;color:var(--muted)}
.room.secured{border-color:var(--dc);border-width:2.5px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:14px;height:14px;border:1.5px solid var(--muted);vertical-align:-2px;margin-right:6px;border-radius:2px}

/* train */
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.mode{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:6px;min-height:150px}
.mode:hover{border-color:var(--ink)}
.mode h3{font-size:20px}
.mode p{margin:0;color:var(--muted);font-size:15px}
.mode .tag{margin-top:auto;font-size:13px;font-weight:700;color:var(--muted)}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.pick{text-align:left;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--dc);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.pick:hover{border-color:var(--dc)}
.pick b{font-family:var(--head);font-size:17px}
.pick small{color:var(--muted);font-size:13px}

/* play area */
.play{max-width:760px;margin:0 auto}
.playhead{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.playhead .bar{flex:1}
.x{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-weight:700;font-size:14px}
.count{font-family:var(--head);font-weight:600;font-size:15px;color:var(--muted);white-space:nowrap}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px}
.qcard .ask{font-size:14px;color:var(--muted);margin:12px 0 4px}
.qcard .prompt{font-size:21px;line-height:1.4;margin:0 0 18px}
.qcard .prompt.term{font-family:var(--head);font-size:30px;font-weight:700}
.opts{display:grid;gap:10px}
.opt{text-align:left;display:flex;gap:12px;align-items:flex-start;background:var(--bg);border:2px solid var(--line);border-radius:9px;padding:12px 14px;font-size:17px}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt .k{flex:none;width:26px;height:26px;border-radius:6px;border:1.5px solid var(--muted);display:grid;place-items:center;font-family:var(--head);font-weight:700;font-size:14px;color:var(--muted)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt[disabled]{cursor:default}
.feedback{margin-top:16px;border-radius:9px;padding:14px 16px;border-left:5px solid var(--ok);background:var(--ok-bg)}
.feedback.no{border-left-color:var(--bad);background:var(--bad-bg)}
.feedback h4{margin:0 0 4px;font-family:var(--head);font-size:18px}
.feedback p{margin:4px 0}
.hook{margin-top:8px;padding:10px 12px;border:1.5px dashed var(--accent);border-radius:8px;background:color-mix(in srgb,var(--accent) 12%,transparent)}
.hook b{font-family:var(--head)}
.next{margin-top:16px;display:flex;justify-content:flex-end;gap:10px}
.learn .term{font-family:var(--head);font-size:34px;font-weight:700;margin:10px 0}
.learn .def{font-size:20px;line-height:1.45}
.newtag{font-family:var(--head);font-weight:700;font-size:13px;background:var(--accent);color:var(--accent-ink);padding:2px 8px;border-radius:5px}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .25s 2}
@media (prefers-reduced-motion:reduce){.shake{animation:none}.bar>i{transition:none}}
.kbd{font-size:13px;color:var(--muted);margin-top:14px}

/* match / sort / order */
.match{display:grid;grid-template-columns:1fr 1.5fr;gap:12px}
.match .col{display:grid;gap:8px;align-content:start}
.tile{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:8px;padding:10px 12px;font-size:15px;min-height:52px}
.tile.term{font-family:var(--head);font-weight:600;font-size:16px}
.tile.sel{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.tile.done{border-color:var(--ok);background:var(--ok-bg);opacity:.75}
.tile.bad{border-color:var(--bad);background:var(--bad-bg)}
@media (max-width:560px){.match{grid-template-columns:1fr 1.3fr}.tile{font-size:14px;padding:8px}}
.tray{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;min-height:50px}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.bucket{text-align:left;background:var(--surface);border:2px dashed var(--line);border-radius:10px;padding:10px;min-height:120px;display:flex;flex-direction:column;gap:6px}
.bucket:hover{border-color:var(--ink)}
.bucket h4{margin:0;font-family:var(--head);font-size:16px}
.bucket .in{font-size:13.5px;background:var(--ok-bg);border-radius:6px;padding:4px 7px}
.hint{font-size:14px;color:var(--bad);margin-top:6px}
.seq{display:grid;gap:8px;margin-bottom:16px;counter-reset:s}
.seq div{background:var(--ok-bg);border:2px solid var(--ok);border-radius:8px;padding:9px 12px;font-weight:700;counter-increment:s}
.seq div::before{content:counter(s) ". ";font-family:var(--head)}

/* logs */
.logbox{background:#0F1A2A;color:#D8E2F0;border-radius:10px;padding:10px;overflow-x:auto}
.logline{display:block;width:100%;text-align:left;background:none;border:0;border-left:4px solid transparent;color:inherit;font-family:var(--mono);font-size:13.5px;padding:8px 10px;white-space:pre;border-radius:4px}
.logline:hover{background:#1B2A40}
.logline.flag{border-left-color:#F5BC4A;background:#2A2A1E}
.logline.tp{border-left-color:#4CC58A;background:#153A2B}
.logline.fp{border-left-color:#F07A7A;background:#43202A}
.logline.fn{border-left-color:#F07A7A;background:#2B1F2A;outline:1px dashed #F07A7A}
.why{font-size:14px;margin:4px 0 10px 14px;color:var(--muted)}

/* results */
.result h2{font-size:30px}
.big{font-family:var(--head);font-size:56px;font-weight:700;line-height:1}
.dbar{display:grid;grid-template-columns:190px 1fr 50px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
@media (max-width:560px){.dbar{grid-template-columns:120px 1fr 44px}}
.missed{margin-top:18px;display:grid;gap:10px}
.missed div{border-left:4px solid var(--bad);padding:6px 12px;background:var(--surface);border-radius:4px}

/* exam */
.qnav{display:flex;flex-wrap:wrap;gap:5px;margin-top:16px}
.qnav button{width:34px;height:34px;border:1.5px solid var(--line);background:var(--surface);border-radius:6px;font-size:13px;font-weight:700}
.qnav button.ans{background:var(--sunk)}
.qnav button.cur{border-color:var(--ink);border-width:2.5px}
.qnav button.flg{box-shadow:inset 0 -4px 0 var(--accent)}
.timer{font-family:var(--head);font-weight:700;font-size:18px}

/* library */
details.obj{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--dc);border-radius:6px;margin-bottom:8px}
details.obj summary{cursor:pointer;padding:12px 16px;display:flex;gap:12px;align-items:baseline;list-style:none}
details.obj summary::-webkit-details-marker{display:none}
details.obj summary .rn{font-family:var(--head);font-weight:700;color:var(--dc);min-width:32px}
details.obj summary .pct{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}
.objbody{padding:0 16px 16px}
.terms{display:grid;gap:10px;margin:10px 0 14px}
.terms div{border-top:1px solid var(--line);padding-top:10px}
.terms b{font-family:var(--head);font-size:16.5px}
.terms p{margin:2px 0}
.terms em{color:var(--muted);font-size:14.5px}
.box{display:inline-block;font-size:12px;font-weight:700;padding:1px 7px;border-radius:5px;background:var(--sunk);color:var(--muted);margin-left:6px;vertical-align:1px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;font-family:var(--head);font-weight:600}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px;background:var(--surface)}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line)}
th{font-family:var(--head);font-size:15px}
td.num{font-family:var(--mono);white-space:nowrap}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin:14px 0}
.facts div{background:var(--sunk);border-radius:8px;padding:12px}
.facts b{display:block;font-family:var(--head);font-size:22px}
.facts span{font-size:13.5px;color:var(--muted)}
input[type=date],select{font:inherit;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px}
.welcome{border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.welcome ol{margin:8px 0 12px;padding-left:22px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:9px;font-weight:700;z-index:50;font-size:15px}
.sync{font-size:12px;color:var(--muted)}
p.lead{font-size:18px;max-width:62ch}
.trackbar{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.seg button{text-align:left;border:2px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 13px;display:flex;flex-direction:column;max-width:230px}
.seg button b{font-family:var(--head);font-size:16px}
.seg button small{font-size:12.5px;color:var(--muted);line-height:1.3}
.seg button[aria-checked="true"]{border-color:var(--ink);background:var(--surface);box-shadow:inset 0 -4px 0 var(--accent)}
@media (max-width:760px){.seg{margin-left:0}.seg button{max-width:none;flex:1 1 100%}}

</style>
</head>
<body>
<header class="top"><div class="wrap">
  <button class="brand" data-act="nav" data-v="hq" aria-label="Sec+ Ops home"><span class="badge">S+</span>Sec+ Ops</button>
  <nav class="nav" id="nav"></nav>
  <div class="stats" id="stats"></div>
</div></header>
<main><div class="wrap" id="app"></div></main>
<nav class="bnav" id="bnav"></nav>
<script id="pack">
// ===== CONTENT PACK: CompTIA Security+ SY0-701 (V7) =====
// Swap this whole file for another cert to reuse the engine.
const PACK = {
  id: "secplus-701",
  name: "Security+",
  code: "SY0-701",
  domains: [
    { n: 1, name: "General Security Concepts", w: 12, short: "General" },

function C(o, f, t, d, m) { PACK.cards.push({ o, f, t, d, m: m || "" }); }

// ---------- 1.1 Security controls ----------
C("1.1","ctrlcat","Technical control","A control carried out by technology or systems, such as firewalls, encryption, and antivirus.","Technical = the machine does it.");
C("1.1","ctrlcat","Managerial control","An administrative control focused on planning and oversight, such as risk assessments and security policies.","Managerial = the paperwork and decisions of managers.");
C("1.1","ctrlcat","Operational control","A control carried out by people day to day, such as awareness training or an analyst reviewing logs.","Operational = people doing the operations.");
C("1.1","ctrlcat","Physical control","A control that limits physical access, such as fences, locks, bollards, and badge readers.","Physical = you could bump into it.");
C("1.1","ctrltype","Preventive control","Stops an incident before it happens, such as a firewall rule or a locked door.","Every control has a job: preventive STOPS it.");
C("1.1","ctrltype","Deterrent control","Discourages an attacker without physically stopping them, such as warning signs or bright lighting.","Deterrent SCARES it off.");
C("1.1","ctrltype","Detective control","Identifies or records an incident during or after it occurs, such as an IDS, log review, or motion sensor.","Detective SPOTS it.");
C("1.1","ctrltype","Corrective control","Reduces damage and restores normal operation after an incident, such as restoring from backup.","Corrective FIXES it.");
C("1.1","ctrltype","Compensating control","An alternative control used when the primary control is not possible, such as isolating a system that cannot be patched.","Compensating SWAPS in for it.");
C("1.1","ctrltype","Directive control","Tells people what to do, such as a policy or an acceptable use agreement.","Directive SAYS it.");

// ---------- 1.2 Fundamental concepts ----------
C("1.2","cia","Confidentiality","Preventing disclosure of information to unauthorized people, usually through encryption and access controls.","C = Closed to outsiders.");
C("1.2","cia","Integrity","Making sure data is not changed without authorization; verified with hashing and digital signatures.","I = It has not been Interfered with.");
C("1.2","cia","Availability","Making sure systems and data are accessible when needed, through redundancy, backups, and patching.","A = Always there when you need it.");
C("1.2","cia","Non-repudiation","Proof that a specific party performed an action, so they cannot deny it later; provided by digital signatures.","You cannot say 'it wasn't me'.");
C("1.2","aaa","Authentication","Proving you are who you claim to be, such as with a password, token, or fingerprint.","Authentication = Are you who you say?");
C("1.2","aaa","Authorization","Deciding what an authenticated identity is allowed to access or do.","Authorization = Allowed to do what?");
C("1.2","aaa","Accounting","Tracking and logging what users do, such as login times and data accessed.","Accounting = keeping the receipts.");
C("1.2","aaa","Gap analysis","Comparing the current security posture to a desired standard or framework to find what is missing.","Where you are vs where you should be = the gap.");
C("1.2","zt","Zero trust","A model that never trusts by network location; every request is verified every time.","Never trust, always verify.");
C("1.2","zt","Policy engine","The zero trust control plane component that decides whether to grant, deny, or revoke access.","The engine DECIDES.");
C("1.2","zt","Policy administrator","The zero trust control plane component that carries out the decision by telling the enforcement point to open or close a session.","The administrator COMMUNICATES the decision.");
C("1.2","zt","Policy enforcement point","The zero trust data plane gatekeeper that allows, monitors, and ends connections.","The enforcement point is the bouncer at the door.");
C("1.2","zt","Control plane","In zero trust, the part that makes and manages access decisions (policy engine and administrator).","Control plane = the brain.");
C("1.2","zt","Data plane","In zero trust, the part where actual traffic flows and is enforced (subjects, systems, enforcement point).","Data plane = the muscles.");
C("1.2","zt","Adaptive identity","Authentication that considers context, such as location, device health, and behavior, before granting access.","Adapts to the situation.");
C("1.2","decoy","Honeypot","A decoy system that attracts attackers so their methods can be observed.","Bears go for the honey pot.");
C("1.2","decoy","Honeynet","A network of multiple honeypots simulating a larger environment.","Many pots = a net.");
C("1.2","decoy","Honeyfile","A decoy file, such as passwords.xlsx, that raises an alert when opened.","A file baited with honey.");
C("1.2","decoy","Honeytoken","Fake data, such as a fake credential or record, whose use signals a breach.","A token that should never be touched.");
C("1.2","phys","Access control vestibule","A small space with two doors where only one can open at a time, preventing tailgating (formerly called a mantrap).","Two doors, one person at a time.");
C("1.2","phys","Bollards","Short, sturdy posts that stop vehicles from reaching a building or entrance.","Stops cars, not people.");

// ---------- 1.3 Change management ----------
C("1.3","change","Backout plan","Documented steps to undo a change and return to the previous state if the change fails.","Your undo button.");
C("1.3","change","Impact analysis","Evaluating the risks and effects of a proposed change before it is approved.","What could this break?");
C("1.3","change","Maintenance window","A scheduled time for changes when disruption to the business is lowest.","Change at 2 AM Sunday, not noon Monday.");
C("1.3","change","Change advisory board","The group that reviews and approves or rejects proposed changes.","CAB = the committee that says yes or no.");
C("1.3","change","Standard operating procedure","A documented step-by-step routine for performing a common task consistently.","SOP = same steps every time.");
C("1.3","change","Dependencies","Other systems, services, or applications that rely on the component being changed.","Pull one thread, what else unravels?");
C("1.3","change","Version control","Tracking changes to code, configurations, and documents so earlier versions can be restored.","Every edit has a history.");
C("1.3","change","Allow list / deny list","Lists that explicitly permit or block applications or connections; changes may need them updated.","Allow list = only these in. Deny list = everyone but these.");

// ---------- 1.4 Cryptography ----------
C("1.4","crypto","Symmetric encryption","Encryption that uses the same shared key to encrypt and decrypt; fast and used for bulk data (for example AES).","One key, like a house key both people copy.");
C("1.4","crypto","Asymmetric encryption","Encryption using a mathematically linked public and private key pair (for example RSA, ECC).","Like a mailbox: anyone can drop mail in (public key), only the owner opens it (private key).");
C("1.4","crypto","AES","The Advanced Encryption Standard, a symmetric block cipher with 128, 192, or 256-bit keys.","AES = the go-to symmetric algorithm.");
C("1.4","crypto","RSA","An asymmetric algorithm based on the difficulty of factoring large prime numbers.","RSA = big primes, key pairs.");
C("1.4","crypto","ECC","Elliptic curve cryptography: asymmetric encryption with small keys, ideal for mobile and IoT.","Elliptic = efficient.");
C("1.4","crypto","Diffie-Hellman","A key exchange method that lets two parties create a shared secret over an insecure channel.","DH = agreeing on a secret in public.");
C("1.4","hash","Hashing","A one-way function that produces a fixed-length digest; used to verify integrity.","A fingerprint of data. You cannot turn a fingerprint back into a person.");
C("1.4","hash","Salting","Adding random data to a password before hashing so identical passwords get different hashes and rainbow tables fail.","Salt makes every dish taste different.");
C("1.4","hash","Key stretching","Repeatedly hashing a password or key to make brute-force attacks slower (for example PBKDF2, bcrypt).","Stretching makes it take longer to crack.");
C("1.4","hash","Digital signature","A hash encrypted with the sender's private key; proves integrity, authenticity, and non-repudiation.","Sign with your private key, others verify with your public key.");
C("1.4","hash","Collision","When two different inputs produce the same hash; a weakness of older algorithms like MD5.","Two people with the same fingerprint.");
C("1.4","pki","Certificate authority","A trusted organization that issues and signs digital certificates.","The CA is the passport office.");
C("1.4","pki","CRL","A certificate revocation list published by a CA listing certificates that are no longer valid.","CRL = download the whole list.");
C("1.4","pki","OCSP","Online Certificate Status Protocol: checks a single certificate's revocation status in real time.","OCSP = ask online right now.");
C("1.4","pki","OCSP stapling","The web server attaches a recent, CA-signed OCSP response to the TLS handshake so clients do not have to ask.","The server staples its proof to the handshake.");
C("1.4","pki","CSR","A certificate signing request sent to a CA; contains the public key and identifying details.","The application form for a certificate.");
C("1.4","pki","Wildcard certificate","A certificate that covers all subdomains of a domain, such as *.example.com.","The star covers every subdomain.");
C("1.4","pki","Self-signed certificate","A certificate signed by its own key rather than a trusted CA; not trusted by browsers by default.","Writing your own reference letter.");
C("1.4","pki","Key escrow","A trusted third party holds a copy of encryption keys so they can be recovered.","Keys held in escrow, like a deposit.");
C("1.4","hwcrypto","TPM","Trusted Platform Module: a chip on the motherboard that stores keys and supports secure boot and disk encryption.","TPM = inside the one computer.");
C("1.4","hwcrypto","HSM","Hardware security module: a dedicated, tamper-resistant appliance for generating and storing keys at scale.","HSM = a server-room vault for many keys.");
C("1.4","hwcrypto","Secure enclave","A protected, isolated area of a processor that keeps sensitive data safe while in use.","A vault inside the CPU.");
C("1.4","hwcrypto","Key management system","Centralized software for creating, storing, rotating, and retiring keys across an organization.","KMS = the key librarian.");
C("1.4","obfus","Steganography","Hiding data inside other data, such as a message inside an image file.","Stego = hidden in plain sight.");
C("1.4","obfus","Tokenization","Replacing sensitive data with a random token; the real value is kept in a secure vault.","A casino chip stands in for real cash.");
C("1.4","obfus","Data masking","Hiding part of the data, such as showing only the last 4 digits of a card number.","A mask covers part of the face.");
C("1.4","obfus","Blockchain","A distributed, tamper-evident public ledger where each block links to the previous one by hash.","Chain of blocks nobody can quietly edit.");
C("1.4","obfus","Full-disk encryption","Encrypting an entire storage drive so all data at rest is protected (for example BitLocker).","Lose the laptop, not the data.");

// ---------- 2.1 Threat actors ----------
C("2.1","actor","Nation-state","A government-sponsored attacker with vast resources and high sophistication, often behind APTs.","Biggest budget, longest patience.");
C("2.1","actor","Unskilled attacker","Someone with little skill who runs tools and scripts written by others.","Point-and-click hacking.");
C("2.1","actor","Hacktivist","An attacker motivated by a political or social cause, often defacing sites or leaking data.","Hacker + activist.");
C("2.1","actor","Insider threat","A current or former employee or partner who misuses authorized access.","The threat already has a badge.");
C("2.1","actor","Organized crime","Professional criminal groups motivated by money, often running ransomware.","It's a business; they want to get paid.");
C("2.1","actor","Shadow IT","Systems or services employees use without IT approval, creating unmanaged risk.","IT working in the shadows.");
C("2.1","actor","Advanced persistent threat","A long-term, stealthy, targeted intrusion, usually by a well-funded group.","Advanced skills, Persistent access.");

// ---------- 2.2 Threat vectors ----------
C("2.2","se","Phishing","Fraudulent email that tricks people into clicking links, opening attachments, or giving up credentials.","Fishing for your info with bait.");
C("2.2","se","Vishing","Voice phishing over phone calls.","V = Voice.");
C("2.2","se","Smishing","Phishing via SMS text messages.","S = SMS.");
C("2.2","se","Pretexting","Inventing a believable scenario to convince a victim to give up information.","The pretext is the cover story.");
C("2.2","se","Business email compromise","An attacker uses or impersonates a trusted business email account, often to redirect payments.","BEC = the fake CEO wire request.");
C("2.2","se","Watering hole attack","Compromising a website the target group regularly visits to infect them.","Poison the watering hole the animals drink from.");
C("2.2","se","Typosquatting","Registering misspelled domains, such as examp1e.com, to catch users who mistype.","A typo leads you to the squatter.");
C("2.2","se","Brand impersonation","Copying a known company's look and logos to make scams believable.","Dressed up as a trusted brand.");
C("2.2","se","Disinformation","False information spread deliberately to mislead; misinformation is false but not necessarily intentional.","DISinformation = DISHonest on purpose.");
C("2.2","vector","Supply chain attack","Compromising a target through a trusted vendor, software provider, or managed service provider.","Attack the supplier to reach the customer.");
C("2.2","vector","Removable device vector","Delivering malware through USB drives or other removable media, sometimes by leaving drives as bait.","Free USB in the parking lot = bait.");
C("2.2","vector","Default credentials","Factory usernames and passwords left unchanged, easily found online by attackers.","admin/admin is not a password.");
C("2.2","vector","Open service ports","Unneeded listening services that widen the attack surface.","Every open port is an open door.");
C("2.2","vector","Unsupported systems","Systems past end of life that no longer receive security patches.","No patches ever again.");

// ---------- 2.3 Vulnerabilities ----------
C("2.3","vuln","Buffer overflow","Writing more data than a memory buffer holds, overwriting adjacent memory and possibly running attacker code.","Pouring too much water into a glass.");
C("2.3","vuln","Memory injection","Inserting malicious code into the memory space of a running process.","Hiding inside another program's memory.");
C("2.3","vuln","Race condition","A flaw where the result depends on the timing of events that happen at nearly the same time.","Two runners reach the finish at once.");
C("2.3","vuln","TOC/TOU","Time-of-check to time-of-use: a resource changes between when it is checked and when it is used.","Checked it, then someone swapped it.");
C("2.3","vuln","Malicious update","A legitimate update channel is abused to deliver malware.","The trusted delivery truck carries a bomb.");
C("2.3","vuln","SQL injection","Inserting SQL commands into input fields to manipulate database queries, such as ' OR 1=1.","SQL in the input box = SQLi.");
C("2.3","vuln","Cross-site scripting","Injecting malicious script into a web page that runs in other users' browsers.","XSS = script in someone else's browser.");
C("2.3","vuln","VM escape","An attacker breaks out of a virtual machine to reach the hypervisor or other VMs.","Escaping the VM jail.");
C("2.3","vuln","Resource reuse","Leftover data in reused virtual resources, such as memory or disk, exposed to another tenant.","The last guest left things in the hotel room.");
C("2.3","vuln","Side loading","Installing apps from outside the official app store, bypassing its security checks.","Coming in through the side door.");
C("2.3","vuln","Jailbreaking","Removing manufacturer restrictions on a mobile OS (called rooting on Android).","Breaking out of the phone's jail.");
C("2.3","vuln","Zero-day","A vulnerability unknown to the vendor with no patch available yet.","Zero days to prepare.");
C("2.3","vuln","End-of-life hardware","Hardware the vendor no longer supports with firmware updates or patches.","Past its expiration date.");
C("2.3","vuln","Misconfiguration","Insecure settings, such as open cloud storage or unneeded services left enabled.","The door was built right but left unlocked.");

// ---------- 2.4 Malicious activity ----------
C("2.4","malware","Ransomware","Malware that encrypts files and demands payment for the key.","Your data held for ransom.");
C("2.4","malware","Trojan","Malware disguised as legitimate software.","The gift horse hiding soldiers.");
C("2.4","malware","Worm","Malware that spreads across networks by itself, with no user action.","Worms wander on their own.");
C("2.4","malware","Virus","Malware that attaches to files or programs and needs a user action to spread.","A virus needs a host to catch a ride.");
C("2.4","malware","Keylogger","Malware or hardware that records keystrokes to capture passwords and data.","Logs every key.");
C("2.4","malware","Rootkit","Malware that hides deep in the OS or kernel to keep privileged, hidden access.","Root access, kit to hide it.");
C("2.4","malware","Logic bomb","Malicious code that runs when a specific condition or date is met.","Ticking until the trigger.");
C("2.4","malware","Spyware","Malware that secretly collects information about the user's activity.","Spies on you.");
C("2.4","malware","Bloatware","Unwanted software preinstalled on a device that wastes resources and adds attack surface.","Bloats the new device.");
C("2.4","netatk","DDoS","A distributed denial of service floods a target with traffic from many sources.","Many sources, one victim.");
C("2.4","netatk","Amplified DDoS","Small requests trigger much larger responses (for example DNS or NTP) aimed at the victim.","A whisper turned into a shout.");
C("2.4","netatk","Reflected DDoS","Attacker spoofs the victim's IP so third-party servers send their replies to the victim.","Bouncing traffic off a mirror.");
C("2.4","netatk","On-path attack","An attacker secretly sits between two parties to intercept or alter traffic (formerly man-in-the-middle).","Sitting on the path between you and them.");
C("2.4","netatk","Credential replay","Capturing authentication data and reusing it to impersonate the user.","Hit replay on the login.");
C("2.4","netatk","DNS poisoning","Corrupting DNS records or cache so users are sent to malicious IP addresses.","Poisoned phone book.");
C("2.4","netatk","Evil twin","A rogue access point broadcasting the same SSID as a legitimate network.","Looks identical, is evil.");
C("2.4","appatk","Privilege escalation","Gaining more permissions than originally granted, such as user to admin.","Climbing the ladder you were not given.");
C("2.4","appatk","Directory traversal","Using ../ sequences to read files outside the web root, such as /etc/passwd.","Dot-dot-slash climbing out of the folder.");
C("2.4","appatk","Cross-site request forgery","Tricking a logged-in user's browser into sending an unwanted request to a trusted site.","Forging a request in your name.");
C("2.4","appatk","Server-side request forgery","Tricking a server into making requests to internal resources on the attacker's behalf.","Making the server fetch it for you.");
C("2.4","pwatk","Password spraying","Trying a few common passwords against many accounts to avoid lockouts.","Spray one password across the crowd.");
C("2.4","pwatk","Brute force","Trying every possible combination until the right password is found.","Pure force, no finesse.");
C("2.4","pwatk","Downgrade attack","Forcing a connection to use an older, weaker protocol or cipher.","Downgrade to the weak version.");
C("2.4","pwatk","Birthday attack","Exploiting probability to find hash collisions faster than expected.","In a room of 23 people, two likely share a birthday.");
C("2.4","indic","Impossible travel","Logins from locations too far apart for the time between them.","Pittsburgh and Tokyo in ten minutes? Impossible.");
C("2.4","indic","Missing logs","Gaps in log data, often a sign an attacker deleted records to hide activity.","Silence in the logs is suspicious.");
C("2.4","indic","Out-of-cycle logging","Log activity at unusual times, such as a batch job running at 3 AM that never runs then.","Activity when nothing should happen.");
C("2.4","indic","Resource consumption","Unexpected spikes in CPU, memory, disk, or bandwidth that may signal malware or exfiltration.","Why is the fan so loud?");
C("2.4","indic","Concurrent session usage","The same account logged in from multiple places at once when that should not happen.","One person, two places at once.");
C("2.4","indic","RFID cloning","Copying the data from an access badge to create a duplicate.","Photocopying a badge.");

// ---------- 2.5 Mitigations ----------
C("2.5","mitig","Segmentation","Dividing a network into zones so a compromise in one area cannot easily spread.","Watertight compartments on a ship.");
C("2.5","mitig","Isolation","Completely separating a system, such as moving an infected host to a quarantine network.","Put it in quarantine.");
C("2.5","mitig","Application allow list","Only approved applications may run; everything else is blocked.","Guest list only.");
C("2.5","mitig","Least privilege","Giving users and systems only the minimum access needed to do their job.","Need it? You get it. Otherwise no.");
C("2.5","mitig","Patching","Applying vendor updates that fix known vulnerabilities.","Patch the hole in the boat.");
C("2.5","mitig","Decommissioning","Properly retiring a system: removing data, access, DNS entries, and firewall rules.","Leave nothing behind when it is retired.");
C("2.5","mitig","Configuration enforcement","Automatically keeping systems aligned with an approved secure configuration.","Drift gets pulled back in line.");
C("2.5","mitig","Host-based firewall","A software firewall running on an individual device.","A firewall that travels with the laptop.");
C("2.5","mitig","HIPS","Host-based intrusion prevention system: watches a single host and blocks malicious activity.","IPS living on the host.");

// ---------- 3.1 Architecture ----------
C("3.1","arch","Shared responsibility model","Defines which security duties belong to the cloud provider and which belong to the customer.","Provider secures OF the cloud; you secure IN the cloud.");
C("3.1","arch","IaaS","Infrastructure as a Service: provider gives VMs, storage, and networks; customer manages OS, apps, and data.","You rent the raw hardware.");
C("3.1","arch","SaaS","Software as a Service: provider runs the whole application; customer manages users and data.","You just use the app.");
C("3.1","arch","Infrastructure as code","Defining and deploying infrastructure through version-controlled configuration files.","Build servers from a recipe file.");
C("3.1","arch","Serverless","Running code as functions without managing servers; the provider handles the infrastructure.","There are servers, you just never see them.");
C("3.1","arch","Microservices","An application built as many small, independent services that talk through APIs.","Many small shops instead of one big store.");
C("3.1","arch","Air gap","Physically isolating a system or network from all other networks.","A gap of air: no cable, no connection.");
C("3.1","arch","Software-defined networking","Separates the network control plane from the data plane so the network is centrally programmable.","The network is controlled by software.");
C("3.1","arch","Containerization","Packaging an app with its dependencies to run in isolation while sharing the host OS kernel.","Shipping containers for software.");
C("3.1","arch","ICS/SCADA","Industrial control systems that monitor and control physical processes like power, water, and manufacturing.","The computers that run the physical world.");
C("3.1","arch","RTOS","A real-time operating system that guarantees processing within strict time limits, common in embedded devices.","Real time, every time.");
C("3.1","arch","Hybrid cloud","A combination of on-premises infrastructure and public cloud services working together.","Part yours, part theirs.");

// ---------- 3.2 Secure infrastructure ----------
C("3.2","infra","Fail-open","When a device fails, traffic or access is allowed, prioritizing availability.","Fire exit doors unlock when power fails.");
C("3.2","infra","Fail-closed","When a device fails, traffic or access is blocked, prioritizing security.","A bank vault stays locked when power fails.");
C("3.2","infra","Inline device","A device placed directly in the traffic path that can block traffic, such as an IPS.","Standing in the doorway.");
C("3.2","infra","Tap / monitor mode","A device receives a copy of traffic and can only watch and alert, such as an IDS.","Watching the doorway on camera.");
C("3.2","infra","Jump server","A hardened host admins connect through to reach systems in a secure zone.","The one bridge into the castle.");
C("3.2","infra","Proxy server","An intermediary that makes requests on behalf of clients; can filter and cache content.","A go-between.");
C("3.2","infra","WAF","Web application firewall: inspects HTTP traffic to block attacks like SQL injection and XSS.","A firewall that speaks web.");
C("3.2","infra","NGFW","Next-generation firewall: application-aware firewall that can inspect traffic by app and user.","A firewall that knows apps, not just ports.");
C("3.2","infra","UTM","Unified threat management: an all-in-one appliance combining firewall, IPS, antivirus, and filtering.","Swiss army knife appliance.");
C("3.2","infra","802.1X","Port-based network access control that requires devices to authenticate (via EAP and RADIUS) before connecting.","No login, no network port.");
C("3.2","infra","IPsec","A suite that secures IP traffic at layer 3 with AH (integrity) and ESP (encryption); used for VPNs.","IP + security.");
C("3.2","infra","Screened subnet","A network zone (formerly DMZ) that holds public-facing servers, separated from the internal network.","The lobby between the street and the offices.");
C("3.2","infra","SASE","Secure access service edge: combines networking and security services delivered from the cloud.","Security delivered at the cloud edge.");
C("3.2","infra","SD-WAN","Software-defined WAN: intelligently routes traffic between sites over multiple connection types.","Smart routing across the wide area.");

// ---------- 3.3 Protecting data ----------
C("3.3","data","Data at rest","Data stored on disk, in databases, or on backup media.","Resting on the drive.");
C("3.3","data","Data in transit","Data moving across a network.","Traveling on the wire.");
C("3.3","data","Data in use","Data being processed in memory or by the CPU.","Actively being worked on.");
C("3.3","data","Data sovereignty","Data is subject to the laws of the country where it is physically stored.","The country owns the rules.");
C("3.3","data","Geographic restrictions","Limiting access to or storage of data based on location.","Only from these places.");
C("3.3","data","Regulated data","Data governed by laws or regulations, such as health or financial records.","Rules decide how you handle it.");
C("3.3","data","Trade secret","Confidential business information that gives a competitive advantage, like a recipe or process.","The secret sauce.");

// ---------- 3.4 Resilience ----------
C("3.4","site","Hot site","A fully equipped, ready-to-run backup location; recovery in minutes to hours.","Hot coffee: ready to drink now.");
C("3.4","site","Warm site","A partly equipped backup location; needs some setup and data before use.","Warm coffee: give it a minute.");
C("3.4","site","Cold site","A backup location with space and power only; longest to bring online.","Cold coffee: you have to brew it first.");
C("3.4","resil","Load balancing","Spreading traffic across multiple servers so no single one is overwhelmed.","Sharing the load.");
C("3.4","resil","Clustering","Multiple servers working together as one system so another takes over if one fails.","Friends who cover for each other.");
C("3.4","resil","Geographic dispersion","Placing resources in different locations so one disaster cannot take them all.","Don't keep every egg in one city.");
C("3.4","resil","Platform diversity","Using different vendors, OSs, or technologies so one flaw does not affect everything.","Not all the same, not all broken.");
C("3.4","resil","Tabletop exercise","A discussion-based walkthrough of a scenario with no systems actually affected.","Talking it through around a table.");
C("3.4","resil","Failover test","Deliberately switching to backup systems to verify they work.","Pull the plug, see if the backup catches it.");
C("3.4","resil","Snapshot","A point-in-time copy of a system or VM state.","A photo of the system right now.");
C("3.4","resil","Journaling","Recording changes in a log before they are committed so data can be recovered after a crash.","Keeping a diary of every change.");
C("3.4","resil","UPS","Uninterruptible power supply: battery power for short outages and clean shutdowns.","Minutes of battery.");
C("3.4","resil","Generator","Provides long-term backup power during extended outages.","Hours or days of power.");

// ---------- 4.1 Securing resources ----------
C("4.1","harden","Secure baseline","A standard, approved secure configuration that systems are built from and checked against.","The known-good starting point.");
C("4.1","harden","Site survey","Assessing a location before installing wireless to plan placement and find interference.","Survey the site before you build.");
C("4.1","harden","Heat map","A visual map of wireless signal strength across an area.","Hot = strong signal.");
C("4.1","mobile","BYOD","Bring your own device: employees use personal devices for work.","Their phone, your data.");
C("4.1","mobile","COPE","Corporate-owned, personally enabled: company owns the device but allows personal use.","Company phone, personal use OK.");
C("4.1","mobile","CYOD","Choose your own device: employee picks from a list of company-approved devices.","Pick from the menu.");
C("4.1","mobile","MDM","Mobile device management: centrally enforces policies, apps, and remote wipe on mobile devices.","Remote control for the fleet.");
C("4.1","harden","WPA3","Current Wi-Fi security standard; uses SAE instead of a pre-shared key handshake.","The newest Wi-Fi lock.");
C("4.1","harden","SAE","Simultaneous Authentication of Equals: WPA3's handshake that resists offline password cracking.","Replaces PSK in WPA3.");
C("4.1","harden","RADIUS","A centralized AAA protocol commonly used for Wi-Fi enterprise and 802.1X authentication.","The central login server for the network.");
C("4.1","appsec","Input validation","Checking that user input is the expected type and format before processing it.","Never trust user input.");
C("4.1","appsec","Secure cookies","Cookies flagged so they are only sent over HTTPS.","Cookies that only travel in armored cars.");
C("4.1","appsec","Static code analysis","Reviewing source code for vulnerabilities without running it (SAST).","Static = not running.");
C("4.1","appsec","Code signing","Digitally signing software so users can verify its publisher and that it has not been altered.","A tamper seal on the software.");
C("4.1","appsec","Sandboxing","Running code in an isolated environment so it cannot affect the rest of the system.","Let it play in the sandbox.");

// ---------- 4.2 Asset management ----------
C("4.2","asset","Sanitization","Removing data from media so it cannot be recovered, allowing the media to be reused.","Clean it and reuse it.");
C("4.2","asset","Destruction","Physically destroying media (shredding, drilling, degaussing, incinerating) so data is unrecoverable.","It is never coming back.");
C("4.2","asset","Certification of destruction","Documentation, often from a vendor, proving media was destroyed.","The receipt that it is gone.");
C("4.2","asset","Data retention","Keeping data only as long as required by policy or law, then disposing of it.","Keep what you must, as long as you must.");
C("4.2","asset","Asset inventory","A tracked list of hardware and software assets, their owners, and locations.","You cannot protect what you don't know you have.");
C("4.2","asset","Enumeration","Discovering and listing all assets on a network, often with scanning tools.","Count everything that is out there.");

// ---------- 4.3 Vulnerability management ----------
C("4.3","vm","CVE","Common Vulnerabilities and Exposures: a public list of identifiers for known vulnerabilities.","CVE = the name tag.");
C("4.3","vm","CVSS","Common Vulnerability Scoring System: rates vulnerability severity from 0 to 10.","CVSS = the score.");
C("4.3","vm","False positive","A scanner reports a vulnerability that does not actually exist.","The alarm went off, but no fire.");
C("4.3","vm","False negative","A real vulnerability exists but the scanner fails to detect it.","There is a fire, but no alarm. The worst one.");
C("4.3","vm","Bug bounty","A program that pays outside researchers for responsibly reporting vulnerabilities.","A reward poster for bugs.");
C("4.3","vm","Responsible disclosure","Privately reporting a vulnerability to the vendor and giving them time to fix it before going public.","Tell the owner first.");
C("4.3","vm","OSINT","Open-source intelligence: information gathered from publicly available sources.","Public info, legally gathered.");
C("4.3","vm","Threat feed","A stream of current threat data, such as malicious IPs and indicators, from external sources.","A news ticker for threats.");
C("4.3","vm","Credentialed scan","A vulnerability scan that logs in to systems for a deeper, more accurate view.","Scanning with the keys.");
C("4.3","vm","Exposure factor","The percentage of an asset's value lost if a specific threat occurs.","How much of it burns?");

// ---------- 4.4 Alerting & monitoring ----------
C("4.4","mon","SIEM","Security information and event management: collects, correlates, and alerts on logs from across the organization.","The security team's central dashboard.");
C("4.4","mon","SCAP","Security Content Automation Protocol: standards for automating vulnerability and compliance checks.","A common language for scanners.");
C("4.4","mon","Benchmarks","Published secure configuration guides, such as CIS benchmarks, to measure systems against.","The recommended settings checklist.");
C("4.4","mon","Agentless monitoring","Collecting data without installing software on the monitored system.","Watching from outside.");
C("4.4","mon","NetFlow","Collects metadata about network traffic flows: who talked to whom, when, and how much.","Phone bill, not the phone call.");
C("4.4","mon","SNMP trap","An alert sent by a network device to a management station when an event occurs.","The device raises its hand.");
C("4.4","mon","DLP","Data loss prevention: detects and blocks sensitive data from leaving the organization.","Stops the data from walking out the door.");
C("4.4","mon","Alert tuning","Adjusting alert rules to reduce false positives and noise.","Turning down the noise.");
C("4.4","mon","Log aggregation","Collecting logs from many sources into one place for analysis.","All logs in one bucket.");

// ---------- 4.5 Enterprise capabilities ----------
C("4.5","email","SPF","Sender Policy Framework: DNS record listing which mail servers may send for a domain.","SPF = Sender's Permitted From list.");
C("4.5","email","DKIM","DomainKeys Identified Mail: adds a digital signature to email to prove it was not altered and came from the domain.","DKIM = a signature on the envelope.");
C("4.5","email","DMARC","Tells receivers what to do when SPF or DKIM fails (none, quarantine, reject) and sends reports.","DMARC = Decides what to do with fakes.");
C("4.5","ent","DNS filtering","Blocking access to malicious or unwanted domains at the DNS resolution step.","The phone book refuses bad numbers.");
C("4.5","ent","File integrity monitoring","Detects unauthorized changes to important files by comparing hashes.","Did anyone touch this file?");
C("4.5","ent","NAC","Network access control: checks a device's identity and health before letting it on the network.","Health check at the door.");
C("4.5","ent","EDR","Endpoint detection and response: monitors endpoints for threats and can respond automatically.","A security guard on every laptop.");
C("4.5","ent","XDR","Extended detection and response: correlates detection across endpoints, network, cloud, and email.","EDR, extended everywhere.");
C("4.5","ent","User behavior analytics","Detects anomalies by comparing user actions to their normal baseline.","That is not like you.");
C("4.5","ent","Group Policy","Windows feature for centrally managing security settings on domain computers.","One setting pushed to all.");
C("4.5","ent","SELinux","Security-Enhanced Linux: enforces mandatory access control policies on Linux.","Linux with MAC enforcement.");

// ---------- 4.6 Identity & access ----------
C("4.6","acm","Mandatory access control","Access decided by the system using classification labels, such as Secret and Top Secret.","MAC = Military labels.");
C("4.6","acm","Discretionary access control","The data owner decides who gets access.","DAC = owner's Discretion.");
C("4.6","acm","Role-based access control","Access assigned by job role, such as Nurse or HR Manager.","RBAC = your Role.");
C("4.6","acm","Rule-based access control","Access decided by rules set by an admin, such as firewall rules or time restrictions.","Rule-based = the rules apply to everyone.");
C("4.6","acm","Attribute-based access control","Access decided by combining attributes like department, location, device, and time.","ABAC = Any combination of attributes.");
C("4.6","iam","Single sign-on","Log in once to access many applications.","One key for many doors.");
C("4.6","iam","SAML","An XML-based standard for exchanging authentication data, common for web SSO between organizations.","SAML = XML for SSO.");
C("4.6","iam","OAuth","An authorization framework letting an app access resources on your behalf without your password.","Let this app see my calendar.");
C("4.6","iam","LDAP","Lightweight Directory Access Protocol: queries and manages directory services like Active Directory.","The company phone book protocol.");
C("4.6","iam","Federation","Trust between organizations so identities from one can access resources in another.","Log in with your home organization.");
C("4.6","iam","Just-in-time permissions","Elevated access granted only when needed and removed automatically after a short time.","Admin rights on a timer.");
C("4.6","iam","Privileged access management","Tools and processes that control, vault, and monitor admin-level accounts.","Guarding the keys to the kingdom.");
C("4.6","iam","Passwordless","Authentication without a password, such as a security key or biometrics.","Nothing to phish or forget.");
C("4.6","iam","Identity proofing","Verifying a person's real identity before issuing credentials.","Prove it before you get the badge.");
C("4.6","factor","Something you know","An authentication factor based on knowledge, such as a password or PIN.","In your head.");
C("4.6","factor","Something you have","An authentication factor based on possession, such as a smart card, token, or phone.","In your pocket.");
C("4.6","factor","Something you are","An authentication factor based on biometrics, such as a fingerprint or face.","Part of your body.");
C("4.6","factor","Somewhere you are","An authentication factor based on location, such as GPS or IP geolocation.","Where you stand.");

// ---------- 4.7 Automation ----------
C("4.7","auto","Guard rails","Automated limits that prevent unsafe configurations or actions.","Keep everyone on the road.");
C("4.7","auto","SOAR","Security orchestration, automation, and response: automates response playbooks across tools.","The SOC's autopilot.");
C("4.7","auto","Technical debt","Future cost created by quick fixes or poorly maintained automation.","Shortcuts today, bills tomorrow.");
C("4.7","auto","Single point of failure","One component whose failure stops the whole process.","One link breaks, the chain falls.");
C("4.7","auto","Continuous integration","Automatically building and testing code every time changes are merged.","Test every change, every time.");

// ---------- 4.8 Incident response ----------
C("4.8","ir","Preparation","IR phase: building the team, tools, playbooks, and training before an incident.","Pretty Dogs Always Chase Every Rolling Log: P = Preparation.");
C("4.8","ir","Detection","IR phase: identifying that an incident may be occurring from alerts, logs, or reports.","D = Detection.");
C("4.8","ir","Analysis","IR phase: confirming the incident and determining its scope and severity.","A = Analysis.");
C("4.8","ir","Containment","IR phase: limiting the spread and damage, such as isolating infected hosts.","C = Containment. Stop the bleeding.");
C("4.8","ir","Eradication","IR phase: removing the cause, such as malware and attacker accounts.","E = Eradication. Remove the threat.");
C("4.8","ir","Recovery","IR phase: restoring systems to normal operation and monitoring them.","R = Recovery. Back to business.");
C("4.8","ir","Lessons learned","IR phase: reviewing what happened and improving processes afterward.","L = Lessons learned.");
C("4.8","forensic","Chain of custody","Documentation of every person who handled evidence, when, and why.","Every hand that touched it, on paper.");
C("4.8","forensic","Legal hold","A requirement to preserve data relevant to litigation; normal deletion must stop.","Freeze! Don't delete anything.");
C("4.8","forensic","E-discovery","Identifying and collecting electronic information for legal proceedings.","Discovering electronic evidence for court.");
C("4.8","forensic","Root cause analysis","Finding the underlying reason an incident happened so it does not recur.","Why did it really happen?");
C("4.8","forensic","Threat hunting","Proactively searching for threats that have evaded existing detection.","Go looking, don't wait for the alarm.");
C("4.8","forensic","Order of volatility","Collect evidence from most volatile (CPU cache, RAM) to least volatile (disk, backups).","Grab the most fragile evidence first.");

// ---------- 4.9 Investigation data ----------
C("4.9","src","Firewall log","Shows allowed and blocked connections with source, destination, and port.","Who knocked and was let in.");
C("4.9","src","Application log","Records events and errors generated by a specific application.","What the app itself noticed.");
C("4.9","src","Endpoint log","Events recorded on a workstation or server, such as logons, processes, and security events.","What happened on that one machine.");
C("4.9","src","IPS/IDS log","Records traffic that matched attack signatures or anomaly rules.","Which alarms tripped.");
C("4.9","src","Packet capture","A full recording of network traffic including payloads; the most detailed network evidence.","The full phone call recording.");
C("4.9","src","Metadata","Data about data, such as email headers or file timestamps.","The envelope, not the letter.");

// ---------- 5.1 Governance ----------
C("5.1","gov","Policy","A high-level statement of management's intent and rules; says WHAT and WHY.","Policy = the big picture rule.");
C("5.1","gov","Standard","Mandatory, specific requirements that support a policy, such as minimum 14-character passwords.","Standard = the specific must.");
C("5.1","gov","Procedure","Step-by-step instructions for how to do a task.","Procedure = the how-to steps.");
C("5.1","gov","Guideline","A recommended, optional best practice.","Guideline = a suggestion.");
C("5.1","gov","Acceptable use policy","Defines how employees may and may not use company systems.","The rules of the road for users.");
C("5.1","role","Data owner","Senior person accountable for a data set; decides its classification.","Owner is accountable.");
C("5.1","role","Data custodian","Handles day-to-day protection of data, such as backups and applying access controls.","Custodian does the hands-on care.");
C("5.1","role","Data controller","Determines the purposes and means of processing personal data (GDPR term).","Controller decides WHY.");
C("5.1","role","Data processor","Processes personal data on behalf of the controller, such as a payroll vendor.","Processor does it for them.");
C("5.1","role","Data steward","Ensures data quality and that data is handled according to policy.","Steward keeps it accurate and labeled.");

// ---------- 5.2 Risk management ----------
C("5.2","risk","SLE","Single loss expectancy: cost of one occurrence. SLE = asset value x exposure factor.","Single = one hit. AV x EF.");
C("5.2","risk","ARO","Annualized rate of occurrence: how many times per year the event is expected.","Once every 4 years = 0.25.");
C("5.2","risk","ALE","Annualized loss expectancy: expected yearly cost. ALE = SLE x ARO.","Annual = Single x how often per year.");
C("5.2","risk","Risk appetite","The amount of risk an organization is willing to pursue to meet its goals.","How hungry for risk are we?");
C("5.2","risk","Risk tolerance","The acceptable variation from the risk appetite for a specific risk.","How far past the line we can stand.");
C("5.2","risk","Risk register","A document listing identified risks, owners, ratings, and responses.","The master list of risks.");
C("5.2","risk","Key risk indicator","A metric that signals a risk is increasing and may exceed a threshold.","The warning light on the dashboard.");
C("5.2","risk","Residual risk","Risk that remains after controls are applied.","What is left over.");
C("5.2","risk","Inherent risk","Risk before any controls are applied.","The raw, natural risk.");
C("5.2","resp","Risk transfer","Shifting risk to a third party, such as buying cyber insurance.","Insurance takes the hit.");
C("5.2","resp","Risk acceptance","Acknowledging a risk and choosing not to act because it is within tolerance.","We'll live with it.");
C("5.2","resp","Risk avoidance","Eliminating the risk by stopping the risky activity.","Just don't do it.");
C("5.2","resp","Risk mitigation","Reducing likelihood or impact by applying controls.","Shrink it with controls.");
C("5.2","resp","Risk exception","Formal approval to not meet a policy requirement, usually with compensating controls.","A documented pass.");
C("5.2","bia","RTO","Recovery time objective: maximum acceptable time to restore a system after an outage.","RTO = Time to get back up (looks forward).");
C("5.2","bia","RPO","Recovery point objective: maximum acceptable amount of data loss measured in time.","RPO = Point you roll back to (looks backward).");
C("5.2","bia","MTTR","Mean time to repair: average time to fix a failed component.","Repair time.");
C("5.2","bia","MTBF","Mean time between failures: average time a component runs before failing.","Between failures = reliability.");
C("5.2","bia","Business impact analysis","Identifies critical functions and the impact of losing them; sets RTO and RPO.","What hurts most if it stops?");

// ---------- 5.3 Third-party risk ----------
C("5.3","agree","SLA","Service level agreement: defines measurable performance, like 99.9% uptime, and penalties.","SLA = the uptime promise.");
C("5.3","agree","MOU","Memorandum of understanding: a non-binding statement of shared intent between parties.","MOU = a handshake on paper.");
C("5.3","agree","MOA","Memorandum of agreement: more formal than an MOU, defining specific responsibilities.","MOA = the handshake with details.");
C("5.3","agree","MSA","Master service agreement: the umbrella contract governing future work between two parties.","MSA = the master umbrella.");
C("5.3","agree","SOW","Statement of work (or work order): details specific deliverables, timelines, and costs for one project.","SOW = the specific job.");
C("5.3","agree","NDA","Non-disclosure agreement: legally requires parties to keep information confidential.","NDA = keep quiet.");
C("5.3","agree","BPA","Business partners agreement: defines how partners share profits, losses, and responsibilities.","BPA = partnership terms.");
C("5.3","vendor","Right-to-audit clause","Contract language allowing you to audit a vendor's security controls.","The right to check their homework.");
C("5.3","vendor","Due diligence","Investigating a vendor's security, finances, and reputation before selecting them.","Do your homework first.");
C("5.3","vendor","Supply chain analysis","Evaluating risk from a vendor's own suppliers and components.","Who supplies your supplier?");

// ---------- 5.4 Compliance ----------
C("5.4","comply","Right to be forgotten","A privacy right allowing a person to request deletion of their personal data (GDPR).","Forget me.");
C("5.4","comply","Data subject","The individual whom personal data is about.","The person in the data.");
C("5.4","comply","Due care","Acting responsibly to protect the organization, such as maintaining controls.","Doing the right thing.");
C("5.4","comply","Attestation","A formal statement confirming that controls or compliance requirements are in place.","Signing that it is true.");
C("5.4","comply","Non-compliance consequences","Fines, sanctions, reputational damage, loss of license, and contractual impacts.","Break the rules, pay the price.");

// ---------- 5.5 Audits & assessments ----------
C("5.5","pentest","Known environment","Penetration test where testers get full information such as diagrams and credentials (formerly white box).","Known = lights on.");
C("5.5","pentest","Partially known environment","Penetration test with limited information provided (formerly gray box).","Partially known = dim lights.");
C("5.5","pentest","Unknown environment","Penetration test with no prior information, like a real outside attacker (formerly black box).","Unknown = lights off.");
C("5.5","pentest","Passive reconnaissance","Gathering information without directly interacting with the target, such as OSINT.","Watching from across the street.");
C("5.5","pentest","Active reconnaissance","Directly interacting with the target, such as port scanning, to gather information.","Knocking on the doors.");
C("5.5","pentest","Integrated testing","Offensive (red) and defensive (blue) teams working together to improve security (purple team).","Red + blue = purple.");
C("5.5","pentest","Independent third-party audit","An external auditor with no stake in the organization evaluates its controls.","Fresh, unbiased eyes.");

// ---------- 5.6 Security awareness ----------
C("5.6","aware","Phishing campaign","Sending simulated phishing emails to employees to measure and train their responses.","Practice fire drill for your inbox.");
C("5.6","aware","Anomalous behavior recognition","Training people to spot risky, unexpected, or unintentional behavior that may signal a threat.","Notice what's not normal.");
C("5.6","aware","Operational security","Protecting everyday information that could help an attacker, such as not posting badge photos online.","Loose lips sink ships.");
C("5.6","aware","Removable media policy","Rules governing the use of USB drives and other portable storage.","Don't plug in strange USBs.");
