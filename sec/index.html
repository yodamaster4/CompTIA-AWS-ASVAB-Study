function Q(o, q, c, a, e) { PACK.mcq.push({ o, q, c, a, e }); }

Q("1.1","A company posts signs stating the building is under 24-hour video surveillance. What type of control is the sign itself?",["Preventive","Deterrent","Detective","Corrective"],1,"The sign discourages an attacker but does not stop or detect anything. The cameras would be detective; the sign is deterrent.");
Q("1.1","A legacy system cannot be patched, so it is placed on an isolated VLAN with strict access rules. What type of control is this?",["Compensating","Directive","Corrective","Deterrent"],0,"When the primary control (patching) is not possible, an alternative that reduces the same risk is a compensating control.");
Q("1.1","An analyst reviews firewall logs every morning looking for suspicious entries. Which category and type best describe this?",["Technical, preventive","Operational, detective","Managerial, corrective","Physical, deterrent"],1,"A person performs it (operational), and it finds problems after they occur (detective).");
Q("1.1","Which of the following is a managerial control?",["Antivirus software","Security guard","Annual risk assessment","Door lock"],2,"Managerial controls are administrative: planning, risk assessments, and policies.");
Q("1.2","Which zero trust component decides whether a subject should be granted access to a resource?",["Policy enforcement point","Policy engine","Implicit trust zone","Data plane"],1,"The policy engine (control plane) makes the decision. The policy administrator relays it and the enforcement point carries it out.");
Q("1.2","A security team places a file called Payroll_2026_passwords.xlsx on a file share. Any access triggers an alert. What is this?",["Honeynet","Honeytoken","Honeyfile","Honeypot"],2,"A decoy file that alerts when opened is a honeyfile.");
Q("1.2","An employee claims they never approved a purchase order. Which concept, provided by digital signatures, disproves the claim?",["Availability","Non-repudiation","Authorization","Accounting"],1,"Non-repudiation provides proof that a specific person took an action.");
Q("1.2","Which of the following best describes the purpose of a gap analysis?",["Testing backups","Comparing the current state against a target framework","Finding open ports","Measuring network latency"],1,"Gap analysis compares where you are to where you need to be, such as a standard like NIST or ISO.");
Q("1.3","Before approving a firewall change, the change advisory board asks how the team will restore service if the change fails. What are they asking for?",["Impact analysis","Backout plan","Maintenance window","Standard operating procedure"],1,"A backout plan documents how to reverse a change.");
Q("1.3","A server patch requires a service restart. Three business apps rely on that service. What must be identified before scheduling?",["Allow lists","Dependencies","Version control","Legacy applications"],1,"Dependencies are other systems affected by the change. Knowing them prevents surprise outages.");
Q("1.4","Alice wants to send Bob a confidential message using asymmetric encryption. Which key does she use to encrypt it?",["Alice's private key","Alice's public key","Bob's public key","Bob's private key"],2,"Encrypt with the recipient's public key; only the recipient's private key can decrypt it. To SIGN, Alice would use her own private key.");
Q("1.4","A browser needs to check whether a single certificate has been revoked without downloading a full list. What does it use?",["CRL","CSR","OCSP","Key escrow"],2,"OCSP checks one certificate's status in real time. A CRL is the full downloadable list.");
Q("1.4","Which approach is best for storing user passwords?",["Encrypt them with AES","Store them in plaintext in a secure database","Salted hashes with key stretching such as bcrypt","MD5 hashes"],2,"Passwords should be hashed (one way), salted (unique), and stretched (slow to crack). MD5 is weak.");
Q("1.4","A retailer wants apps to use credit card data without storing real card numbers in the app database. What should they use?",["Steganography","Tokenization","Hashing","Data masking"],1,"Tokenization replaces the real value with a token; the mapping lives in a secure vault.");
Q("1.4","Which component stores BitLocker keys on a laptop's motherboard?",["HSM","TPM","KMS","Secure enclave"],1,"The TPM chip is built into the individual device. An HSM is a separate appliance for enterprise-scale key storage.");
Q("1.4","Which provides integrity, authentication, and non-repudiation for a document?",["Symmetric encryption","Digital signature","Hashing alone","Tokenization"],1,"A digital signature is a hash encrypted with the sender's private key, providing all three.");
Q("1.4","A company needs one certificate for www, mail, and shop subdomains of example.com. What should it request?",["Self-signed certificate","Wildcard certificate","Root certificate","CRL"],1,"A wildcard certificate (*.example.com) covers all first-level subdomains.");
Q("2.1","A group defaces a government website to protest a new law. Which threat actor is most likely?",["Nation-state","Organized crime","Hacktivist","Unskilled attacker"],2,"Political or social motivation points to a hacktivist.");
Q("2.1","An attacker maintained hidden access to a defense contractor's network for 18 months, stealing designs. Who is most likely responsible?",["Insider threat","Nation-state","Hacktivist","Unskilled attacker"],1,"Long-term stealth, huge resources, and espionage are hallmarks of a nation-state APT.");
Q("2.1","The marketing team signs up for an unapproved file-sharing service to exchange files with a vendor. What is this?",["Shadow IT","Supply chain attack","Insider threat","Typosquatting"],0,"Technology used without IT approval is shadow IT.");
Q("2.2","The CFO receives an email appearing to be from the CEO asking for an urgent $48,000 wire to a new vendor. What is this most likely?",["Watering hole","Business email compromise","Vishing","Smishing"],1,"Impersonating an executive via email to redirect payments is business email compromise.");
Q("2.2","Attackers compromise an industry forum frequently visited by engineers at a target company. What attack is this?",["Watering hole","Pretexting","Typosquatting","Brand impersonation"],0,"Infecting a site the targets are known to visit is a watering hole attack.");
Q("2.2","A caller claims to be from the help desk and asks an employee to read back the MFA code just sent to their phone. What is this?",["Smishing","Vishing","Phishing","Whaling"],1,"Social engineering by voice call is vishing.");
Q("2.2","An attacker registers micros0ft-support.com hoping users mistype the real domain. What is this?",["DNS poisoning","Typosquatting","Pretexting","On-path attack"],1,"Registering look-alike or misspelled domains is typosquatting.");
Q("2.3","An attacker in a guest virtual machine gains access to the hypervisor. What vulnerability is this?",["Resource reuse","VM escape","Race condition","Side loading"],1,"Breaking out of a VM to the host is VM escape.");
Q("2.3","A login form accepts the input ' OR 1=1 -- and logs the attacker in. What vulnerability exists?",["Cross-site scripting","Buffer overflow","SQL injection","Directory traversal"],2,"SQL syntax in an input field that changes the query logic is SQL injection. Input validation and parameterized queries prevent it.");
Q("2.3","A program checks that a file is safe, and before it opens the file an attacker swaps it for a malicious one. What is this?",["TOC/TOU","Memory injection","Malicious update","Zero-day"],0,"The resource changed between time of check and time of use.");
Q("2.4","Security logs show one failed login each for 300 different accounts using the password Spring2026! from one IP. What attack is this?",["Brute force","Password spraying","Credential replay","Birthday attack"],1,"One common password tried across many accounts, to avoid lockouts, is password spraying.");
Q("2.4","Malware spreads from host to host across the network over SMB without any user clicking anything. What type is it?",["Virus","Trojan","Worm","Logic bomb"],2,"Self-propagating malware that needs no user action is a worm.");
Q("2.4","A user signs in from Ohio at 9:00 AM and from Singapore at 9:12 AM. What indicator does this represent?",["Resource consumption","Impossible travel","Out-of-cycle logging","Account lockout"],1,"Nobody can travel that far in 12 minutes. This suggests stolen credentials.");
Q("2.4","An investigation finds no security logs from 2:00 to 4:00 AM on the breached server. What does this most likely indicate?",["Normal log rotation","An attacker covering tracks","A false positive","Log aggregation"],1,"Missing logs during a suspicious window often mean an attacker cleared them.");
Q("2.4","An attacker forces a client and server to negotiate an old, weak version of TLS. What is this?",["Downgrade attack","Replay attack","Collision","Birthday attack"],0,"Forcing weaker protocols or ciphers is a downgrade attack.");
Q("2.4","A former admin left code that deletes the database if their account is ever removed from payroll. What is this?",["Rootkit","Logic bomb","Trojan","Keylogger"],1,"Malicious code triggered by a condition is a logic bomb.");
Q("2.4","A web request contains ../../../../etc/passwd in a file parameter. What attack is being attempted?",["SQL injection","Directory traversal","XSS","CSRF"],1,"Dot-dot-slash sequences attempting to escape the web root indicate directory traversal.");
Q("2.5","Kiosk computers in a lobby should only run the approved browser and nothing else. Which mitigation fits best?",["Application allow list","Deny list","Segmentation","Patching"],0,"An allow list permits only approved applications and blocks everything else.");
Q("2.5","A server is being retired. The team wipes its drives and removes it from DNS and firewall rules. What is this process?",["Isolation","Decommissioning","Configuration enforcement","Hardening"],1,"Decommissioning means retiring a system completely, leaving no data or access behind.");
Q("3.1","In an IaaS cloud deployment, who is responsible for patching the guest operating system?",["The cloud provider","The customer","Both equally","The hypervisor vendor"],1,"In IaaS the provider secures the physical hardware and hypervisor; the customer manages the OS, apps, and data.");
Q("3.1","A water treatment plant's SCADA system must never be reachable from any outside network. What is the strongest approach?",["VPN","Air gap","NAT","Load balancer"],1,"An air gap physically isolates the network from all others.");
Q("3.1","A team wants server deployments to be repeatable, reviewable, and stored in version control. What should they use?",["Serverless","Infrastructure as code","Microservices","Containerization"],1,"Infrastructure as code defines infrastructure in files that can be versioned and reviewed.");
Q("3.2","A badge-controlled fire exit door must unlock automatically when power fails. What failure mode is this?",["Fail-closed","Fail-open","Fail-secure","Fail-over"],1,"Fail-open allows access on failure, prioritizing life safety and availability.");
Q("3.2","A company needs a device that can actively block malicious traffic in real time. What should it deploy and where?",["IDS on a tap","IPS inline","SIEM on a span port","NetFlow collector"],1,"Only an inline device can block traffic. An IDS on a tap can only alert.");
Q("3.2","Switch ports must only allow devices that authenticate against RADIUS. What should be implemented?",["802.1X","WPA3","MAC filtering","Port mirroring"],0,"802.1X is port-based network access control using EAP and RADIUS.");
Q("3.2","A company wants to protect its web application from SQL injection and XSS at the network edge. What should it deploy?",["WAF","Proxy server","Jump server","Load balancer"],0,"A web application firewall inspects HTTP traffic and blocks web attacks.");
Q("3.2","Where should a public-facing web server be placed?",["Internal LAN","Screened subnet","Management VLAN","Directly on the internet with no firewall"],1,"Public-facing servers go in the screened subnet (DMZ), separated from the internal network.");
Q("3.3","Customer records are being processed in a server's RAM. What state is the data in?",["At rest","In transit","In use","Archived"],2,"Data being actively processed in memory is data in use.");
Q("3.3","A company must keep EU citizens' data stored within the EU because of local law. What concept is this?",["Data masking","Data sovereignty","Tokenization","Data retention"],1,"Data sovereignty means data is subject to the laws where it resides.");
Q("3.4","A business must be operational at a backup location within one hour of a disaster. What should it use?",["Cold site","Warm site","Hot site","Cloud backup only"],2,"A hot site is fully equipped and ready almost immediately.");
Q("3.4","The business states it can lose no more than 4 hours of data. Which metric does this define?",["RTO","RPO","MTTR","MTBF"],1,"RPO is the maximum acceptable data loss measured in time (how far back you restore).");
Q("3.4","The IR team gathers in a conference room and talks through how they would respond to a ransomware scenario. What is this?",["Failover test","Simulation","Tabletop exercise","Parallel processing"],2,"A discussion-based walkthrough with no systems touched is a tabletop exercise.");
Q("4.1","A company buys phones for employees and allows personal use on them. What deployment model is this?",["BYOD","COPE","CYOD","VDI"],1,"Corporate-owned, personally enabled.");
Q("4.1","Before installing wireless access points, a technician maps signal strength throughout the building. What is this called?",["War driving","Site survey","Packet capture","Jamming"],1,"A site survey (often producing a heat map) plans AP placement.");
Q("4.1","Users need assurance that a downloaded application came from the real vendor and was not altered. What provides this?",["Sandboxing","Code signing","Input validation","Static analysis"],1,"Code signing uses a digital signature to prove publisher and integrity.");
Q("4.2","Old hard drives will be reused by another department. What should be done to the data?",["Destruction","Sanitization","Encryption","Degaussing and shredding"],1,"Sanitization removes data while allowing reuse. Destruction makes the drive unusable.");
Q("4.3","A scanner reports an Apache vulnerability on a server that only runs IIS. What is this?",["True positive","False positive","False negative","True negative"],1,"A reported issue that does not exist is a false positive.");
Q("4.3","After applying a patch for a critical vulnerability, what should the team do next?",["Close the ticket","Rescan to validate the fix","Disable the scanner","Report to the CVE database"],1,"Validation through rescanning confirms remediation worked.");
Q("4.3","Which provides a standardized numeric severity score for vulnerabilities?",["CVE","CVSS","SCAP","OSINT"],1,"CVSS scores severity 0 to 10. CVE is just the identifier.");
Q("4.4","Which tool collects logs from many sources, correlates events, and raises alerts?",["NetFlow","SIEM","SNMP","DLP"],1,"A SIEM aggregates and correlates logs.");
Q("4.4","The SOC is overwhelmed by alerts that turn out to be harmless. What should they do?",["Disable the SIEM","Alert tuning","Add more analysts only","Delete old logs"],1,"Alert tuning reduces false positives and noise.");
Q("4.5","Receiving mail servers should verify that a sending server's IP address is authorized to send for the domain. Which record provides this?",["DKIM","SPF","DMARC","MX"],1,"SPF lists authorized sending servers in DNS.");
Q("4.5","Which email standard tells receivers to reject messages that fail authentication and sends reports to the domain owner?",["SPF","DKIM","DMARC","S/MIME"],2,"DMARC sets the policy (none, quarantine, reject) and reporting.");
Q("4.5","The team wants to detect any unauthorized change to critical system files. What should they deploy?",["DLP","FIM","NAC","UBA"],1,"File integrity monitoring compares file hashes to detect changes.");
Q("4.5","Employees must be prevented from emailing Social Security numbers outside the company. What should be implemented?",["DLP","EDR","DNS filtering","SPF"],0,"Data loss prevention detects and blocks sensitive data leaving.");
Q("4.5","An administrator needs to allow secure remote shell access. Which port should be opened?",["23","22","3389","445"],1,"SSH uses TCP 22. Telnet (23) is unencrypted.");
Q("4.6","Nurses get access to patient charts because of their job title. Which access control model is this?",["DAC","MAC","RBAC","ABAC"],2,"Access based on job role is role-based access control.");
Q("4.6","Access is granted only if the user is in Finance, on a company laptop, in the office, during business hours. Which model is this?",["RBAC","ABAC","DAC","MAC"],1,"Combining multiple attributes is attribute-based access control.");
Q("4.6","A user logs in with a password and a code from an authenticator app. Which factors are used?",["Know + are","Know + have","Have + are","Know + know"],1,"Password = something you know; authenticator app = something you have.");
Q("4.6","A third-party scheduling app needs to read a user's calendar without learning their password. What enables this?",["SAML","OAuth","LDAP","RADIUS"],1,"OAuth is for delegated authorization.");
Q("4.6","Admin rights are granted to a technician for one hour and then automatically removed. What is this?",["Least privilege","Just-in-time permissions","Password vaulting","Federation"],1,"Temporary elevation granted only when needed is just-in-time permissions.");
Q("4.6","An employee resigns today. What is the most important IAM step?",["Password reset","De-provisioning their accounts","Identity proofing","Enrolling MFA"],1,"De-provisioning removes access immediately so it cannot be misused.");
Q("4.7","A single automation script is used by dozens of processes. If it fails, all of them stop. What risk does this describe?",["Technical debt","Single point of failure","Guard rails","Scalability"],1,"One component that can stop everything is a single point of failure.");
Q("4.7","A cloud team automatically prevents anyone from creating a publicly readable storage bucket. What is this?",["Guard rails","Orchestration","CI/CD","Ticket escalation"],0,"Automated limits that block unsafe actions are guard rails.");
Q("4.8","An analyst confirms ransomware on a workstation. What should be done first?",["Reimage the workstation","Isolate it from the network","Pay the ransom","Notify the media"],1,"Containment comes first to stop the spread.");
Q("4.8","Which document records every person who handled a piece of evidence?",["Legal hold","Chain of custody","E-discovery","Root cause analysis"],1,"Chain of custody preserves evidence integrity for legal use.");
Q("4.8","A company is notified of a lawsuit and must preserve all related emails. What is this called?",["E-discovery","Legal hold","Data retention","Preservation"],1,"A legal hold suspends normal deletion for relevant data.");
Q("4.8","Analysts proactively search the network for signs of attackers that alerts have not caught. What is this?",["Threat hunting","Tabletop exercise","Penetration testing","Vulnerability scanning"],0,"Proactive searching for undetected threats is threat hunting.");
Q("4.8","The team rebuilds servers from clean images, restores data from backups, and monitors them. Which IR phase is this?",["Containment","Eradication","Recovery","Lessons learned"],2,"Restoring normal operations is recovery.");
Q("4.8","When collecting digital evidence, what should be captured first?",["Hard disk","RAM contents","Backup tapes","Printed logs"],1,"Order of volatility: capture the most volatile data (CPU cache, RAM) first.");
Q("4.9","An analyst needs to see the exact contents of a suspicious data transfer. Which data source is best?",["NetFlow","Packet capture","Firewall log","Metadata"],1,"Packet captures include full payloads. NetFlow only shows metadata about flows.");
Q("4.9","Which log would show that inbound connections to port 3389 were blocked?",["Application log","Firewall log","Endpoint log","Metadata"],1,"Firewall logs record allowed and denied connections with ports.");
Q("5.1","A document states that all passwords must be at least 14 characters. What is it?",["Policy","Standard","Procedure","Guideline"],1,"A standard is a specific, mandatory requirement supporting a policy.");
Q("5.1","Who performs day-to-day tasks like backing up data and applying access controls?",["Data owner","Data custodian","Data controller","Data subject"],1,"The custodian handles hands-on protection. The owner is accountable.");
Q("5.1","Under GDPR, a payroll company processing employee data on behalf of an employer is the:",["Data controller","Data processor","Data owner","Data subject"],1,"The processor acts on behalf of the controller.");
Q("5.2","A server is worth $200,000. A fire would destroy 25% of it. Fires happen once every 2 years. What is the ALE?",["$25,000","$50,000","$100,000","$12,500"],0,"SLE = 200,000 x 0.25 = 50,000. ARO = 0.5. ALE = 50,000 x 0.5 = 25,000.");
Q("5.2","A company buys cyber insurance to cover breach costs. Which risk response is this?",["Accept","Avoid","Transfer","Mitigate"],2,"Shifting financial impact to a third party is transfer.");
Q("5.2","What is the risk that remains after controls have been applied?",["Inherent risk","Residual risk","Risk appetite","Control risk"],1,"Residual risk is what is left after controls.");
Q("5.2","A company stops offering a risky service entirely to eliminate a risk. Which response is this?",["Avoid","Transfer","Accept","Mitigate"],0,"Stopping the activity avoids the risk.");
Q("5.3","Which agreement defines 99.9% uptime and financial penalties if the vendor misses it?",["MOU","SLA","NDA","BPA"],1,"A service level agreement defines measurable performance targets.");
Q("5.3","Two organizations want a non-binding document describing their intent to work together. What should they sign?",["MSA","MOU","SOW","SLA"],1,"An MOU is a non-binding statement of intent.");
Q("5.3","Which contract clause lets a company inspect a vendor's security controls?",["Non-compete","Right-to-audit","Indemnification","Force majeure"],1,"A right-to-audit clause allows you to verify the vendor's controls.");
Q("5.4","A customer asks a company to delete all personal data it holds about them. Which right are they exercising?",["Data portability","Right to be forgotten","Data sovereignty","Legal hold"],1,"The right to be forgotten allows deletion requests under GDPR.");
Q("5.5","Penetration testers receive full network diagrams and credentials before testing. What type of test is this?",["Unknown environment","Partially known environment","Known environment","Passive reconnaissance"],2,"Full information given = known environment (formerly white box).");
Q("5.5","A tester reviews the company's website, job postings, and social media without touching its systems. What is this?",["Active reconnaissance","Passive reconnaissance","Vulnerability scanning","Pivoting"],1,"Gathering public information without interacting with target systems is passive reconnaissance.");
Q("5.6","The security team sends fake phishing emails to staff and tracks who clicks. What is this?",["Phishing campaign","Spear phishing attack","Watering hole","Pretexting"],0,"A simulated phishing campaign measures and trains user awareness.");
Q("5.6","An employee who normally works 9 to 5 starts downloading large amounts of data at 2 AM. What should awareness training teach coworkers and managers to recognize?",["Anomalous behavior","Normal usage","Shadow IT","Data sovereignty"],0,"Unexpected, risky behavior is anomalous behavior that should be reported.");

// ===== GAP FILL: topics identified by comparing against the full SY0-701 objectives outline =====
// All wording original.

// ---- 1.2 Zero trust, physical security, deception ----
C("1.2","zt","Threat scope reduction","A zero trust goal: shrink the number of entry points and what any single identity can reach, so a compromise stays small.","Make the target smaller.");
C("1.2","zt","Policy-driven access control","Zero trust access decisions that follow written rules combining identity, device, and context rather than network location.","Rules decide, not the network.");
C("1.2","zt","Implicit trust zone","The area behind a zero trust enforcement point where a subject is trusted after being allowed in; kept as small as possible.","Inside the gate, trust is assumed.");
C("1.2","zt","Subject / system","In zero trust, the subject is the user or process requesting access; the system is the device or application it uses.","Who is asking, and from what.");
C("1.2","zt","Security zones","Logical areas of a network (trusted, untrusted, internal, external, screened) that decide which traffic may flow between them.","Neighborhoods with rules for crossing.");
C("1.2","aaa","Certificate-based device authentication","Authenticating a device (not a person) with a digital certificate installed on it, often issued by the organization's own CA.","The laptop proves who it is.");
C("1.2","phys","Fencing","A physical barrier that marks a boundary and slows or stops people from entering; can be see-through or opaque.","The first line on the perimeter.");
C("1.2","phys","Video surveillance","Cameras (CCTV) that record or watch an area; modern systems add motion detection and object recognition.","Eyes that never blink.");
C("1.2","phys","Security guards and access badges","People who verify identity and watch for problems, often paired with photo badges that show who belongs.","A person checking your badge.");
C("1.2","phys","Two-person integrity","A rule requiring two people to be present to access something sensitive, so no one person acts alone.","It takes two keys.");
C("1.2","phys","Lighting","Bright, even lighting that deters intruders and helps cameras capture clear images.","Criminals avoid the spotlight.");
C("1.2","sensor","Infrared sensor","Detects body heat to sense a person moving in an area.","Sees heat.");
C("1.2","sensor","Pressure sensor","Detects a change in force on a floor or surface, such as someone stepping on it.","Feels footsteps.");
C("1.2","sensor","Microwave sensor","Sends microwave signals and detects movement by changes in the reflection; covers large areas.","Radar for a room.");
C("1.2","sensor","Ultrasonic sensor","Uses high-frequency sound waves to detect motion or objects.","Bat-style sound pulses.");

// ---- 1.3 Change management details ----
C("1.3","change","Change ownership","The person or team responsible for a change being requested and managed, though they may not perform it.","Someone owns every change.");
C("1.3","change","Stakeholders","Everyone affected by a change, who should be consulted before it's approved.","Who will this touch?");
C("1.3","change","Change test results","Evidence from testing a change in a sandbox or non-production environment before approving it for production.","Prove it in the lab first.");
C("1.3","change","Restricted activities","Keeping implementers inside the approved scope of a change; nothing extra gets done 'while we're in there'.","Stay inside the lines.");
C("1.3","change","Downtime","The period a service is unavailable during a change; planned to minimize business impact.","Schedule the outage.");
C("1.3","change","Service or application restart","Many changes require restarting a service, app, or system, which must be planned and verified.","Plan the reboot.");
C("1.3","change","Legacy applications","Old applications that may break with changes and often lack documentation or vendor support.","The fragile old system.");
C("1.3","change","Updating documentation","After a change, diagrams, policies, and procedures must be updated to match reality.","If it changed, write it down.");

// ---- 1.4 Cryptography details ----
C("1.4","crypto","Transport encryption","Protecting data moving across a network, such as with HTTPS or a VPN.","Encrypt the pipe.");
C("1.4","crypto","Database encryption","Encrypting a database as a whole (transparent encryption) or specific columns that hold sensitive fields.","Lock the table or just the column.");
C("1.4","crypto","File-level encryption","Encrypting individual files or folders rather than the whole disk.","One file at a time.");
C("1.4","crypto","Volume encryption","Encrypting one partition or volume of a drive.","One section of the drive.");
C("1.4","crypto","Key length","Longer keys are harder to brute force; symmetric keys are shorter (128 to 256 bits) than asymmetric keys (often 2048+ bits) for similar strength.","Longer key, harder crack.");
C("1.4","crypto","Out-of-band key exchange","Sharing a key outside the network channel, such as in person or by phone.","Hand it over another way.");
C("1.4","crypto","In-band key exchange","Sharing a key over the same network channel, protected with asymmetric encryption.","Send it through the wire, safely wrapped.");
C("1.4","crypto","Session key","A temporary symmetric key created for one session, often exchanged using asymmetric encryption.","One conversation, one key.");
C("1.4","pki","Private certificate authority","A CA an organization runs internally to issue certificates for its own devices and services.","Your in-house passport office.");
C("1.4","pki","Third-party certificate authority","A public CA trusted by browsers that issues certificates after validating the requester.","The public passport office.");
C("1.4","pki","X.509","The standard format for digital certificates, including serial number, issuer, validity dates, subject, and public key.","The certificate template.");
C("1.4","pki","Subject Alternative Name","A certificate field listing additional hostnames or addresses the certificate is valid for.","Other names on the same certificate.");
C("1.4","pki","Web of trust","A decentralized model where users vouch for each other's keys instead of relying on a CA.","Friends vouch for friends.");
C("1.4","hash","SHA-256 and SHA-3","Current secure hash algorithms. MD5 and SHA-1 are considered broken for security use.","Use SHA-2 or SHA-3.");

// ---- 2.2 Threat vectors ----
C("2.2","vector","Message-based vectors","Attacks delivered through email, SMS, or instant messages, such as malicious links or attachments.","The message is the delivery truck.");
C("2.2","vector","Image-based vectors","Attacks hidden in image files, such as an SVG image carrying script code.","A picture that runs code.");
C("2.2","vector","File-based vectors","Malicious files like documents with macros, PDFs, or compressed archives.","The attachment bites.");
C("2.2","vector","Voice call vectors","Attacks over phone calls, including vishing, war dialing, and call tampering.","The phone is the weapon.");
C("2.2","vector","Vulnerable software vectors","Unpatched software exploited through a client installed on the device or through an agentless service.","The app has a hole.");
C("2.2","vector","Unsecure network vectors","Wireless, wired, or Bluetooth networks without proper protection that let attackers connect or eavesdrop.","An open door on the network.");
C("2.2","se","Eliciting information","Drawing out sensitive details through casual conversation, flattery, or leading questions.","Chatty questions, secret answers.");
C("2.2","se","Identity fraud","Using someone else's personal information to open accounts or make purchases in their name.","Stolen identity, real damage.");
C("2.2","se","Tailgating","Following an authorized person through a secure door without badging in.","Riding someone's badge.");
C("2.2","se","Dumpster diving","Searching trash for sensitive information like invoices or passwords.","Treasure in the trash.");
C("2.2","se","Shoulder surfing","Watching someone's screen or keyboard to capture information.","Looking over your shoulder.");

// ---- 2.3 Vulnerabilities ----
C("2.3","vuln","DLL injection","Forcing a running process to load a malicious library (DLL) so attacker code runs inside a trusted program.","Slip a bad library into a good app.");
C("2.3","vuln","Reflected XSS","Non-persistent XSS: the malicious script is in a link, bounced off the vulnerable site, and runs when the victim clicks.","The link carries the script.");
C("2.3","vuln","Stored XSS","Persistent XSS: the script is saved on the site (like a comment) and runs for everyone who views it.","The script lives on the page.");
C("2.3","vuln","Legacy platforms","Old systems that still run but no longer get vendor support or patches.","Still running, no longer protected.");
C("2.3","vuln","Open permissions","Resources (often cloud storage) accessible to anyone because access was never restricted.","Anyone can walk in.");
C("2.3","vuln","Unsecured admin accounts","Administrator or root accounts with weak passwords, no MFA, or shared use.","Keys to the kingdom, left out.");
C("2.3","vuln","Insecure protocols","Protocols that send data in cleartext, such as Telnet, FTP, and HTTP.","Anyone listening can read it.");
C("2.3","vuln","Supply chain: service providers","Third parties with network access (like HVAC or MSP vendors) that attackers can use as a way in.","The vendor's access is your risk.");
C("2.3","vuln","Supply chain: hardware providers","Counterfeit or tampered hardware introduced before it reaches you.","Is that switch really genuine?");
C("2.3","vuln","Supply chain: software providers","Legitimate software or updates compromised at the vendor, spreading to every customer.","Trust the vendor, inherit their breach.");
C("2.3","vuln","Cloud-specific vulnerabilities","Weaknesses like misconfigured storage, weak API authentication, and denial of service against cloud services.","Cloud mistakes are internet-facing.");

// ---- 2.4 Malware, attacks, and indicators ----
C("2.4","malware","Fileless malware","Malware that runs in memory using built-in tools like PowerShell, leaving little on disk for antivirus to find.","No file to scan.");
C("2.4","virus","Program virus","A virus that infects executable program files.","Rides inside apps.");
C("2.4","virus","Boot sector virus","A virus in the boot area of a drive that runs before the operating system loads.","Starts before the OS.");
C("2.4","virus","Script virus","A virus written in a scripting language that runs through the OS or browser.","Runs as a script.");
C("2.4","virus","Macro virus","A virus embedded in document macros, such as in office files.","Hidden in the spreadsheet.");
C("2.4","netatk","Deauthentication attack","Sending forged disconnect frames to kick users off a Wi-Fi network, often to capture reconnection data.","Knock them off the Wi-Fi.");
C("2.4","netatk","RF jamming","Flooding radio frequencies with interference so wireless devices can't communicate; a denial of service.","Drown out the signal.");
C("2.4","netatk","Domain hijacking","Taking control of a domain registration, often by compromising the registrar account, to redirect traffic.","Steal the domain itself.");
C("2.4","netatk","On-path browser attack","Malware in the victim's browser intercepts and alters traffic, even encrypted sessions (formerly man-in-the-browser).","The attacker sits inside the browser.");
C("2.4","netatk","Session hijacking","Stealing a session ID or cookie to take over a logged-in session without the password.","Steal the wristband, skip the line.");
C("2.4","netatk","Pass the hash","Using a captured password hash to authenticate without ever cracking the password.","The hash works like a key.");
C("2.4","netatk","Bluejacking","Sending unsolicited messages to nearby Bluetooth devices.","Bluetooth spam.");
C("2.4","netatk","Bluesnarfing","Stealing data from a device over Bluetooth.","Bluetooth theft.");
C("2.4","appatk","Injection attacks","Adding attacker-supplied code or commands into input, such as SQL, LDAP, XML, or command injection.","Data pretending to be instructions.");
C("2.4","appatk","Header manipulation","Changing HTTP headers, such as cookies, to hijack sessions or trick the server.","Tamper with the request envelope.");
C("2.4","appatk","Mitigating privilege escalation","Patch quickly, use least privilege, enable data execution prevention, and use address space randomization.","Close the ladder.");
C("2.4","phys","Environmental attack","Attacking systems that support IT, such as power, HVAC, or fire suppression, to cause outages.","Turn off the air conditioning.");
C("2.4","indic","Account lockout","Accounts locked from repeated failed logins can indicate a brute-force attempt.","Someone's been knocking.");
C("2.4","indic","Blocked content","Security tools blocking access to known malicious sites or files; a sign of attempted compromise.","The filter caught something.");
C("2.4","indic","Resource inaccessibility","Files, services, or systems suddenly unavailable, possibly from ransomware or a DoS.","Where did my files go?");
C("2.4","indic","Published or documented","Company data found posted online, such as on a paste site or leak forum.","Your data showed up in public.");

// ---- 2.5 Mitigations ----
C("2.5","mitig","Access control list","A list of rules that allow or deny traffic or access, based on things like IP, port, or user.","The bouncer's list.");
C("2.5","mitig","Change default passwords","Replacing factory passwords on all devices before deployment.","Default passwords are public.");
C("2.5","mitig","Remove unnecessary software","Uninstalling unused applications to reduce vulnerabilities and attack surface.","Less software, fewer holes.");
C("2.5","mitig","Disable unused ports and protocols","Turning off network ports and services that aren't needed.","Close doors you don't use.");
C("2.5","mitig","Monitoring as mitigation","Continuously watching logs and systems to catch issues early.","You can't stop what you can't see.");

// ---- 3.1 Architecture considerations ----
C("3.1","arch","Hybrid cloud considerations","Mixing on-premises and cloud means managing consistent security, authentication, and networking across both.","Two worlds, one policy.");
C("3.1","arch","Third-party cloud vendors","Cloud providers and their partners that store or process your data; their security affects yours.","Their weakness is your risk.");
C("3.1","arch","Physical isolation","Separating devices physically, such as an air gap, so they can't communicate.","No cable between them.");
C("3.1","arch","VLAN segmentation","Logically separating one physical switch into multiple networks; devices on different VLANs can't talk without routing.","One switch, many networks.");
C("3.1","arch","Centralized vs. decentralized","Centralized puts management in one place (easy control, single point of failure); decentralized spreads it (resilient, harder to manage).","One brain vs many.");
C("3.1","arch","Virtualization","Running multiple operating systems on one physical host with a hypervisor; each VM has its own OS.","Many computers in one box.");
C("3.1","arch","IoT devices","Internet-connected sensors and smart devices, often with weak default security.","Smart, but not always secure.");
C("3.1","arch","Embedded system","Hardware and software built for one purpose, like a traffic light controller or medical device.","A computer inside something else.");
C("3.1","arch","High availability","Designing systems to stay running, often with redundancy and failover.","Always on.");
C("3.1","arch","Architecture tradeoffs","Choosing an architecture balances availability, resilience, cost, responsiveness, scalability, ease of deployment and recovery, and patching ability.","Every design gives up something.");
C("3.1","arch","Inability to patch","Some embedded or specialized systems can't be patched easily, so they need compensating controls like segmentation.","Can't fix it? Wall it off.");
C("3.1","arch","Risk transference in the cloud","Using a cloud provider shifts some responsibilities and risks to the provider, but never all of them.","Share the load, not the blame.");

// ---- 3.2 Infrastructure ----
C("3.2","infra","Device placement","Putting security devices at boundaries between zones where they can inspect traffic flowing between them.","Guard the crossings.");
C("3.2","infra","Attack surface","All the points where an attacker could try to get in: open ports, apps, users, and interfaces.","Every door and window.");
C("3.2","infra","Forward proxy","Sits in front of internal users and makes requests to the internet on their behalf, filtering and caching.","Speaks for users going out.");
C("3.2","infra","Reverse proxy","Sits in front of internal servers and handles requests from the internet on their behalf.","Speaks for servers coming in.");
C("3.2","infra","Open proxy","A proxy anyone on the internet can use; often abused to hide attackers' identities.","A public relay, often shady.");
C("3.2","infra","Active/active load balancing","All servers handle traffic at the same time; if one fails, the others keep going.","Everyone works.");
C("3.2","infra","Active/passive load balancing","Some servers stand by and take over only when an active one fails.","Backups wait on the bench.");
C("3.2","infra","Sensors and collectors","Sensors gather data from devices (logs, traffic); collectors aggregate it, often into a SIEM.","Sensors gather, collectors combine.");
C("3.2","infra","Port security","Switch settings that limit which devices can connect to a port, such as by MAC address.","Only known devices plug in.");
C("3.2","infra","EAP","Extensible Authentication Protocol: a framework of authentication methods used with 802.1X.","The language 802.1X speaks.");
C("3.2","infra","Layer 4 vs layer 7 firewall","Layer 4 filters by IP and port; layer 7 (application-aware) inspects the actual application traffic.","Port vs content.");
C("3.2","infra","SSL/TLS VPN","A VPN that runs over TLS on port 443, often through a browser or light client; easy for remote users.","VPN through the web port.");
C("3.2","infra","Site-to-site IPsec VPN","A permanent encrypted tunnel between two networks, usually between firewalls.","Office to office tunnel.");
C("3.2","infra","Selection of effective controls","Choosing controls that fit the risk, the network location, and the business needs.","Right control, right place.");

// ---- 3.3 Data types and classifications ----
C("3.3","dataclass","Public data","Information with no restrictions on who can see it.","Anyone can read it.");
C("3.3","dataclass","Sensitive data","Information like intellectual property or personal data that needs protection.","Handle with care.");
C("3.3","dataclass","Confidential data","Very sensitive information that requires approval to view.","Need approval to see.");
C("3.3","dataclass","Restricted data","Information limited to specific people, often under legal or contractual requirement.","A short list of eyes.");
C("3.3","dataclass","Private data","Information tied to a person that should stay private, like personal records.","About someone, for them.");
C("3.3","dataclass","Critical data","Information that must always be available for the business to operate.","Can't run without it.");
C("3.3","data","Intellectual property","Creations like patents, copyrights, and trademarks owned by the organization.","Owned ideas.");
C("3.3","data","Financial information","Records like account numbers, card data, and payroll; often regulated.","Money data.");
C("3.3","data","Human-readable vs non-human-readable","Human-readable data can be read directly; non-human-readable (like barcodes or encoded data) needs a machine.","People read it, or machines do.");
C("3.3","data","Permission restrictions","Limiting who can read or change data using access controls.","Only the right people.");

// ---- 3.4 Resilience ----
C("3.4","resil","Continuity of operations plan","COOP: how essential functions keep running during a disaster, including manual workarounds.","Keep the lights on no matter what.");
C("3.4","resil","Capacity planning","Matching people, technology, and infrastructure to expected demand so services stay available.","Enough staff, servers, and space.");
C("3.4","resil","Onsite vs offsite backups","Onsite backups restore fast; offsite backups survive a disaster at the main site.","Fast vs safe.");
C("3.4","resil","Backup frequency","How often backups run, set by how much data loss (RPO) is acceptable.","More often, less loss.");
C("3.4","resil","Replication","Continuously copying data to another location to keep it current.","A live copy.");
C("3.4","resil","Parallel processing test","Running the backup system alongside production to confirm it produces the same results.","Run both, compare.");
C("3.4","resil","Simulation test","A realistic drill that acts out a disaster to test responses without real damage.","Practice the real thing.");
C("3.4","resil","Multi-cloud","Using more than one cloud provider so one provider's outage doesn't stop everything.","Don't depend on one cloud.");

// ---- 4.1 Securing resources ----
C("4.1","harden","Establish, deploy, maintain baselines","Create a secure configuration, roll it out to systems, then keep it updated as threats and software change.","Set it, push it, keep it.");
C("4.1","harden","Hardening workstations","Patch regularly, use endpoint protection, remove unnecessary software, and enforce policies centrally.","Lock down the desktop.");
C("4.1","harden","Hardening network devices","Change default credentials, update firmware, and disable unused services on routers and switches.","Secure the plumbing.");
C("4.1","harden","Hardening cloud infrastructure","Use least privilege, secure the management console, and use endpoint protection on cloud workloads.","The cloud needs locks too.");
C("4.1","harden","Hardening ICS/SCADA and embedded","Segment them from the rest of the network and tightly control access, since patching is often hard.","Isolate what you can't patch.");
C("4.1","wireless","WPA2 PSK weakness","With a pre-shared key, an attacker who captures the handshake can brute force the password offline.","Capture once, crack offline.");
C("4.1","wireless","GCMP","Galois/Counter Mode Protocol: the encryption used by WPA3 for confidentiality and integrity.","WPA3's cipher.");
C("4.1","wireless","Open wireless mode","No password and no encryption; anyone can connect and traffic can be read.","Open to everyone.");
C("4.1","wireless","WPA3-Personal","Uses a shared password protected by SAE; suitable for homes and small offices.","One password, better handshake.");
C("4.1","wireless","WPA3-Enterprise","Each user authenticates individually with 802.1X and a RADIUS server.","Everyone logs in separately.");
C("4.1","mobile","Cellular security","Mobile networks can be tracked or intercepted; MDM and encryption help protect devices.","Phones leak location.");
C("4.1","mobile","Bluetooth security","Reduce risk by disabling discovery when not needed and pairing only with known devices.","Don't advertise yourself.");
C("4.1","appsec","Secure coding concepts","Writing software with security in mind from the start: validation, least privilege, error handling, and testing.","Build it secure.");
C("4.1","appsec","Application security monitoring","Watching application logs and behavior for attacks and unusual activity.","Watch the app, not just the network.");

// ---- 4.2 Asset management ----
C("4.2","asset","Acquisition and procurement","The process for purchasing hardware and software through approved vendors and budgets.","Buy through the right door.");
C("4.2","asset","Asset assignment and accounting","Tracking who owns each asset and classifying it by importance.","Every asset has an owner.");
C("4.2","asset","Degaussing","Erasing magnetic media with a strong magnetic field, making drives unusable.","Scramble it with magnets.");

// ---- 4.3 Vulnerability management ----
C("4.3","vm","Dynamic analysis (fuzzing)","Sending random or unexpected input to an application to find crashes and vulnerabilities.","Throw junk at it and see what breaks.");
C("4.3","vm","Package monitoring","Tracking third-party libraries and packages for known vulnerabilities.","Know what's in your code.");
C("4.3","vm","Proprietary threat intelligence","Paid, curated threat data from commercial providers.","Paid intel.");
C("4.3","vm","Information-sharing organization","Groups (like ISACs) where members in the same sector share threat information.","Neighbors warning neighbors.");
C("4.3","vm","Dark web intelligence","Monitoring hidden forums and marketplaces for stolen data or planned attacks.","Watch where criminals talk.");
C("4.3","vm","Rules of engagement","A penetration test's documented scope: what's allowed, when, and how.","The rules before the test.");
C("4.3","vm","CVSS environmental score","Adjusting a vulnerability's severity based on your own environment and the importance of affected systems.","How bad is it here?");
C("4.3","vm","Vulnerability exception","A documented decision not to fix a vulnerability, usually with a compensating control and review date.","A documented pass.");
C("4.3","vm","Cyber insurance","Transferring some of the financial risk of a breach to an insurer.","Pay to share the risk.");

// ---- 4.4 Monitoring ----
C("4.4","mon","Log archiving","Keeping logs long-term to meet retention requirements and support investigations.","Keep the history.");
C("4.4","mon","Quarantine","Isolating a suspicious file or device so it can't cause harm while it's investigated.","Put it in isolation.");
C("4.4","mon","Anti-malware","Software that detects and removes malicious code using signatures and behavior.","The malware hunter.");
C("4.4","mon","Vulnerability scanner","A tool that checks systems for known vulnerabilities and misconfigurations.","The weakness detector.");

// ---- 4.5 Enterprise capabilities ----
C("4.5","ent","Implicit deny","Firewall default: anything not explicitly allowed is blocked, usually as the last rule.","Not on the list? Not getting in.");
C("4.5","ent","IPS rules and signatures","IPS patterns that identify known attacks and decide whether to allow, alert, or block.","Known bad patterns.");
C("4.5","ent","URL filtering","Blocking or allowing web access based on URLs, categories, or reputation.","Block by address or category.");
C("4.5","ent","Content filtering","Inspecting web content and blocking inappropriate or malicious material.","Check what's on the page.");
C("4.5","ent","Reputation-based filtering","Blocking sites or senders with a known bad history.","Bad reputation, blocked.");
C("4.5","ent","Mail gateway","A system in front of the mail server that filters spam, malware, and phishing.","The email checkpoint.");
C("4.5","ent","USB blocking","Preventing removable storage from being used, often through DLP or group policy.","No thumb drives.");
C("4.5","ent","Agent-based vs agentless NAC","Persistent agents stay installed; dissolvable agents run once for a check; agentless checks happen remotely.","Stay, dissolve, or none.");

// ---- 4.6 Identity and access ----
C("4.6","iam","Provisioning and deprovisioning","Creating accounts with the right access when people join, and removing access promptly when they leave.","On the way in, on the way out.");
C("4.6","iam","Attestation (IAM)","Periodically confirming that users still need the access they have.","Does this person still need this?");
C("4.6","iam","OpenID Connect","An authentication layer on top of OAuth that verifies who a user is.","OAuth plus identity.");
C("4.6","iam","Time-of-day restrictions","Limiting when accounts can log in, such as only during work hours.","No logins at 3 AM.");
C("4.6","iam","Password complexity and length","Requiring longer passwords and a mix of characters to resist guessing; length matters most.","Long beats clever.");
C("4.6","iam","Password age and expiration","Rules for how long a password can be used before it must change.","Passwords have a shelf life.");
C("4.6","iam","Password vaulting","Storing privileged credentials in a secure vault that checks them out and records use.","Admin passwords live in a vault.");
C("4.6","iam","Ephemeral credentials","Temporary credentials that expire automatically after a short time.","Here now, gone soon.");

// ---- 4.7 Automation ----
C("4.7","auto","Automation benefits","Saves time, enforces baselines, standardizes configurations, scales securely, speeds reaction, and multiplies the workforce.","Faster, consistent, scalable.");
C("4.7","auto","User and resource provisioning","Automatically creating accounts and infrastructure with the right settings.","Build it the same every time.");
C("4.7","auto","Ticket creation and escalation","Automatically opening and routing tickets when events happen.","The system opens the ticket.");
C("4.7","auto","API integrations","Connecting tools through APIs so they share data and trigger actions automatically.","Tools talking to tools.");
C("4.7","auto","Automation complexity","Automation can become complicated and costly to build and support.","Automating takes work too.");
C("4.7","auto","Ongoing supportability","Automated processes must be maintained as systems change.","Somebody must keep it running.");

// ---- 4.8 Incident response and data ----
C("4.8","forensic","NIST SP 800-61","The NIST guide for computer security incident handling that defines the incident response lifecycle.","The IR rulebook.");
C("4.8","forensic","Incident response training","Teaching staff their roles and practicing with tabletop exercises and simulations.","Practice before the real thing.");
C("4.8","forensic","Evidence acquisition","Collecting data from systems for investigation, including disk images, memory, and logs.","Gather the evidence.");
C("4.9","src","OS-specific security logs","Security logs built into the operating system, like logon events and permission changes.","The OS keeps its own diary.");
C("4.9","src","Network logs","Logs from switches, routers, and access points showing connections and changes.","The network's record.");
C("4.9","src","Vulnerability scan data","Scan results showing which systems had which weaknesses, useful during an investigation.","Where the holes were.");
C("4.9","src","Dashboards","Visual summaries of security data for quick awareness of what's happening.","Everything at a glance.");
C("4.9","src","Automated reports","Scheduled reports generated from SIEM and other tools.","Reports that write themselves.");

// ---- 5.1 Governance ----
C("5.1","gov","Business continuity policy","How the organization keeps working during a disruption.","Keep going through trouble.");
C("5.1","gov","Disaster recovery plan","How to restore IT systems and data after a disaster.","Get IT back up.");
C("5.1","gov","Incident response policy","Defines how incidents are reported, handled, and who is responsible.","Who does what when it hits.");
C("5.1","gov","Software development lifecycle policy","Requires security at each stage of building software, from design to deployment.","Security in every stage.");
C("5.1","gov","Onboarding","Bringing a new person in: accounts, equipment, training, and agreements like the AUP.","Welcome aboard, securely.");
C("5.1","gov","Offboarding","Removing access, collecting equipment, and handling data when someone leaves.","Close every door behind them.");
C("5.1","gov","Playbook","A checklist of steps for a specific situation, such as responding to ransomware.","The step-by-step for this case.");
C("5.1","gov","Governance boards and committees","Groups that set direction and approve security decisions for an organization.","Who decides.");
C("5.1","gov","Centralized vs decentralized governance","Decisions made in one place, or spread across departments or locations.","One headquarters or many.");
C("5.1","gov","External considerations","Laws, regulations, industry rules, and local, national, and global requirements that shape policy.","Outside rules shape inside rules.");
C("5.1","gov","Policy monitoring and revision","Reviewing and updating policies regularly as the business and threats change.","Policies need checkups.");

// ---- 5.2 Risk ----
C("5.2","risk","Risk identification","Finding risks before they cause harm, through assessments, audits, and threat intelligence.","Find it before it finds you.");
C("5.2","risk","Ad hoc risk assessment","A one-off assessment done when a specific need arises.","As needed.");
C("5.2","risk","Recurring risk assessment","An assessment performed on a regular schedule.","On the calendar.");
C("5.2","risk","Continuous risk assessment","Ongoing, often automated monitoring of risk.","Always watching.");
C("5.2","risk","Qualitative risk assessment","Rates risk with categories like low, medium, and high instead of dollar amounts.","Words, not dollars.");
C("5.2","risk","Quantitative risk assessment","Calculates risk with numbers and money, such as SLE and ALE.","Dollars, not words.");
C("5.2","risk","Likelihood and probability","How likely a risk is to happen; likelihood is often qualitative, probability numeric.","How likely?");
C("5.2","risk","Risk owner","The person responsible for managing a specific risk.","Whose risk is it?");
C("5.2","risk","Risk threshold","The level at which a risk requires action.","The line you won't cross.");
C("5.2","risk","Expansionary risk appetite","Willing to take on more risk to pursue growth.","Bold.");
C("5.2","risk","Conservative risk appetite","Prefers to avoid risk, even at the cost of opportunity.","Cautious.");
C("5.2","risk","Risk reporting","Communicating risk status to leadership so they can make decisions.","Tell the decision makers.");

// ---- 5.3 Third-party risk ----
C("5.3","vendor","Evidence of internal audits","Proof from a vendor that it regularly audits its own controls.","Show your homework.");
C("5.3","vendor","Independent assessment","A neutral third party evaluates a vendor's security.","A referee checks them.");
C("5.3","vendor","Vendor questionnaire","A structured set of security questions a vendor answers during selection.","The vendor's security quiz.");
C("5.3","vendor","Conflict of interest","A relationship that could bias vendor selection; must be identified and managed.","No favorites.");
C("5.3","vendor","Vendor monitoring","Ongoing review of a vendor's performance and security after the contract starts.","Keep checking after you sign.");

// ---- 5.4 Compliance ----
C("5.4","comply","Compliance reporting","Internal reports to leadership and external reports to regulators about compliance status.","Tell the right people you comply.");
C("5.4","comply","Sarbanes-Oxley (SOX)","US law requiring accurate financial reporting and controls at public companies.","Honest financial books.");
C("5.4","comply","HIPAA","US law protecting the privacy and security of health information.","Health data protection.");
C("5.4","comply","Data inventory and retention","Knowing what data you have, where it lives, and how long you must keep it.","Know it, keep it, delete it on time.");
C("5.4","comply","Compliance automation","Tools that continuously check and report compliance.","Let tools check the rules.");

// ---- 5.5 Audits ----
C("5.5","pentest","Internal audit","An audit performed by the organization's own staff, often reporting to an audit committee.","Checking yourself.");
C("5.5","pentest","External audit","An audit by an outside party, such as a regulator or independent firm.","Someone else checks you.");
C("5.5","pentest","Regulatory examination","A formal review by a government regulator.","The regulator's inspection.");
C("5.5","pentest","Physical penetration test","Testing whether someone can get into buildings or rooms without authorization.","Try the doors.");
C("5.5","pentest","Self-assessment","The organization evaluates its own controls against a standard.","Grade your own test.");

// ---- 5.6 Awareness ----
C("5.6","aware","Risky behavior","Actions that knowingly increase risk, such as disabling security software.","Knowingly unsafe.");
C("5.6","aware","Unexpected behavior","Unusual actions that could signal a compromise, like logging in at odd hours.","That's not normal.");
C("5.6","aware","Unintentional behavior","Honest mistakes that create risk, like mistyping an email address.","Oops, but still risky.");
C("5.6","aware","Situational awareness","Paying attention to surroundings and unusual requests, online and in person.","Notice what's around you.");
C("5.6","aware","Hybrid and remote work security","Training for secure home networks, device use, and privacy when working away from the office.","Security follows you home.");
C("5.6","aware","Awareness program development","Planning training content and schedule based on the organization's risks.","Plan the training.");
C("5.6","aware","Initial and recurring training","Training when people join and at regular intervals afterward.","Train at hire, then repeat.");

// ---- New exam-style questions ----
Q("1.2","A data center adds sensors that detect body heat in a hallway after hours. What type of sensor is this?",["Pressure","Infrared","Ultrasonic","Microwave"],1,"Infrared sensors detect heat from bodies.");
Q("1.2","Which zero trust concept limits how much of the network a compromised account can reach?",["Implicit trust zone","Threat scope reduction","Non-repudiation","Gap analysis"],1,"Threat scope reduction shrinks the reach of any one identity.");
Q("1.3","During a change, a technician also upgrades an unrelated service 'while they're in there.' Which change management principle was violated?",["Backout plan","Restricted activities","Version control","Dependencies"],1,"Implementers must stay within the approved scope.");
Q("1.4","A company issues certificates to its internal servers without paying a public provider. What is it running?",["Third-party CA","Private certificate authority","Key escrow","Web of trust"],1,"An internal, private CA issues certificates for its own systems.");
Q("1.4","One certificate must cover www.example.com and mail.example.net. Which certificate field makes this possible?",["Serial number","Subject Alternative Name","Validity period","Key usage"],1,"SAN lists additional names the certificate covers.");
Q("1.4","Which pair of hash algorithms should NOT be used for security today?",["SHA-256 and SHA-3","MD5 and SHA-1","SHA-384 and SHA-512","SHA-3 and SHA-512"],1,"MD5 and SHA-1 have known collision weaknesses.");
Q("2.2","An attacker sends an SVG image in a chat that runs code when opened. What vector is this?",["Voice call","Image-based","Removable device","Supply chain"],1,"SVG images can carry scripts, making them an image-based vector.");
Q("2.2","Someone follows an employee through a badge-controlled door without scanning. What is this?",["Shoulder surfing","Tailgating","Pretexting","Dumpster diving"],1,"Entering behind an authorized person is tailgating.");
Q("2.3","A malicious comment on a forum runs a script in every visitor's browser. What type of XSS is this?",["Reflected","Stored","DOM-less","Server-side request forgery"],1,"The script is saved on the site, so it's stored (persistent) XSS.");
Q("2.3","An HVAC contractor's network access is used by attackers to breach a retailer. What type of risk is this?",["Supply chain: service provider","Zero-day","Race condition","VM escape"],0,"Third-party service providers with access are supply chain risks.");
Q("2.4","Users are repeatedly disconnected from Wi-Fi, and an attacker captures their reconnection handshakes. What attack is this?",["RF jamming","Deauthentication","Bluejacking","Evil twin"],1,"Forged disconnect frames force clients off the network: a deauthentication attack.");
Q("2.4","An attacker uses a captured NTLM hash to log in without cracking the password. What is this?",["Password spraying","Pass the hash","Birthday attack","Downgrade"],1,"Pass the hash authenticates with the hash itself.");
Q("2.4","Malware runs entirely in memory using PowerShell and leaves no files. What is it?",["Boot sector virus","Fileless malware","Macro virus","Logic bomb"],1,"Fileless malware lives in memory and uses built-in tools.");
Q("2.4","A company's customer database appears on a public paste site. Which indicator is this?",["Resource consumption","Published/documented","Out-of-cycle logging","Account lockout"],1,"Finding your data published online is a clear indicator of compromise.");
Q("2.4","An attacker steals a user's session cookie and uses it to access their account. What is this?",["Session hijacking","Brute force","Directory traversal","Downgrade"],0,"Using a stolen session token is session hijacking.");
Q("2.4","A virus hides in office document macros. What type is it?",["Program virus","Boot sector virus","Macro virus","Script virus"],2,"Macro viruses live in document macros.");
Q("3.1","A network team separates engineering and finance on the same switch so they can't communicate without routing. What did they use?",["Air gap","VLANs","SASE","Containerization"],1,"VLANs logically segment one physical switch.");
Q("3.1","Medical devices in a hospital can't be patched. What is the best approach?",["Ignore them","Isolate them on a segmented network","Connect them directly to the internet","Remove all logging"],1,"When patching isn't possible, segmentation is a compensating control.");
Q("3.2","A company places a device in front of its web servers to handle incoming internet requests and hide the servers. What is it?",["Forward proxy","Reverse proxy","Open proxy","Jump server"],1,"A reverse proxy handles inbound requests on behalf of servers.");
Q("3.2","Remote employees need VPN access through a browser over port 443. What fits?",["Site-to-site IPsec VPN","SSL/TLS VPN","L2TP only","802.1X"],1,"SSL/TLS VPNs run over 443 and are easy for remote users.");
Q("3.2","In a load balancer setup, backup servers sit idle until an active server fails. What is this?",["Active/active","Active/passive","Round robin","Affinity"],1,"Active/passive keeps standby servers until needed.");
Q("3.2","A firewall blocks traffic based only on IP addresses and port numbers. What type is it?",["Layer 7 firewall","Layer 4 firewall","WAF","NGFW"],1,"Filtering by IP and port is layer 4.");
Q("3.3","Which classification best fits data that must always be available for the business to run?",["Public","Critical","Private","Restricted"],1,"Critical data must always be available.");
Q("3.4","A company runs its backup payroll system alongside production for a month to confirm identical results. What test is this?",["Tabletop","Parallel processing","Failover","Simulation"],1,"Running both systems side by side is a parallel processing test.");
Q("3.4","Which plan focuses on keeping essential business functions running during a disaster, including manual processes?",["Capacity plan","Continuity of operations plan","Change management plan","Asset inventory"],1,"COOP keeps essential functions going.");
Q("4.1","An attacker captures a WPA2-Personal handshake and cracks the password offline. What fixes this weakness?",["WEP","WPA3 with SAE","MAC filtering","Hiding the SSID"],1,"SAE in WPA3 prevents offline brute force of the handshake.");
Q("4.3","Testers send random, malformed input to an application to find crashes. What is this?",["Static analysis","Fuzzing","Package monitoring","Code signing"],1,"Fuzzing is dynamic testing with unexpected input.");
Q("4.3","A penetration test's scope, allowed times, and forbidden targets are documented in the:",["SLA","Rules of engagement","MOU","Risk register"],1,"Rules of engagement define the test's boundaries.");
Q("4.3","A vulnerability's base CVSS is 7.5, but the affected server is isolated and non-critical. What adjusts the score for this context?",["Temporal score","Environmental metrics","Exposure factor","False positive"],1,"Environmental metrics tailor severity to your environment.");
Q("4.5","A firewall's last rule blocks anything not explicitly allowed. What is this?",["Implicit deny","Allow list","Stateful inspection","NAT"],0,"Implicit deny blocks all traffic not explicitly permitted.");
Q("4.5","A NAC agent runs once to check a device's health and then removes itself. What type of agent is it?",["Persistent","Dissolvable","Agentless","EDR"],1,"Dissolvable agents run a check and remove themselves.");
Q("4.6","Contractors should only be able to log in Monday to Friday, 8 AM to 6 PM. What control fits?",["Time-of-day restrictions","MAC","Federation","Password age"],0,"Time-of-day restrictions limit when logins are allowed.");
Q("4.6","A manager must periodically confirm that each team member still needs their current access. What is this?",["Attestation","Provisioning","Identity proofing","Federation"],0,"Access attestation (reviews) confirms access is still needed.");
Q("4.7","Which is a drawback of automation?",["Faster reaction time","Consistent baselines","Ongoing supportability and complexity","Workforce multiplier"],2,"Automation must be maintained and can grow complex.");
Q("5.1","When an employee leaves, their accounts are disabled and laptop collected. Which procedure is this?",["Onboarding","Offboarding","Change control","Playbook"],1,"Offboarding removes access and collects assets.");
Q("5.1","A step-by-step checklist for responding to a ransomware outbreak is called a:",["Policy","Playbook","Standard","Guideline"],1,"Playbooks give steps for a specific scenario.");
Q("5.2","A risk assessment rates risks as low, medium, or high rather than in dollars. What type is it?",["Quantitative","Qualitative","Continuous","Ad hoc"],1,"Qualitative uses categories, not numbers.");
Q("5.2","A startup willingly takes on more risk to grow quickly. What is its risk appetite?",["Conservative","Neutral","Expansionary","Avoidant"],2,"Expansionary appetite accepts more risk for growth.");
Q("5.3","A company asks a potential vendor to answer 100 security questions before selection. What is this?",["Right-to-audit","Vendor questionnaire","MOA","Penetration test"],1,"A questionnaire gathers security details during vendor assessment.");
Q("5.4","Which US law focuses on the privacy of health information?",["SOX","HIPAA","GDPR","PCI DSS"],1,"HIPAA protects health information.");
Q("5.5","A company's own auditors review its controls and report to the audit committee. What is this?",["External audit","Internal audit","Regulatory examination","Independent third-party audit"],1,"Internal audits are performed by the organization's own staff.");
Q("5.6","An employee accidentally emails a spreadsheet to the wrong person. Which behavior category is this?",["Risky","Unexpected","Unintentional","Malicious"],2,"An honest mistake is unintentional behavior.");
